## **Introduction** 

Solid state physics (or condensed matter physics) is one of the most active and versatile branches of modern physics that have developed in the wake of the discovery of quantum mechanics. It deals with problems concerning the properties of materials and, more generally, systems with many degrees of freedom, ranging from fundamental questions to technological applications. This richness of topics has turned solid state physics into the largest subfield of physics; furthermore, it has arguably contributed most to technological development in industrialized countries.

In contrast, in solid state physics we are dealing with phenomena occurring at room temperature ( _T ∼_ 300K) or below, i.e., at characteristic energies of about _E ∼ kBT ∼_ 0 _._ 03eV = 30meV, which is even much smaller than the energy scale of one Hartree. Correspondingly, the important length scales are given by the extension of the system or of the electronic wave functions. The focus is thus quite different from the one of high-energy physics. 

There, a highly successful phenomenological theory for low energies, the so-called standard model, exists, whereas the underlying theory for higher energies is unknown. In solid state physics, the situation is reversed. The Hamiltonian (1) describes the known ’high-energy’ physics (on the energy scale of Hartree), and one aims at describing the low-energy properties using reduced (effective, phenomenological) theories. Both tasks are far from trivial. 

Among the various states of condensed matter that solid state theory seeks to describe are metals, semiconductors, and insulators. Furthermore, there are phenomena such as magnetism, superconductivity, ferroelectricity, charge ordering, and the quantum Hall effect. All of these states share a common origin: Electrons interacting among themselves and with the ions through the Coulomb interaction. More often than not, the microscopic formulation in (1) is too complicated to allow an understanding of the low-energy behavior from first principles. Consequently, the formulation of effective (reduced) theories is an important step in condensed matter theory. On the one hand, characterizing the ground state of a system is an important goal in itself. However, measurable quantities are determined by excited states, so that the concept of ’elementary excitations’ takes on a central role. Some celebrated examples are Landau’s quasiparticles for 

6 

Fermi liquids, the phonons connected to lattice vibrations, and magnons in ferromagnets. The idea is to treat the ground state as an effective vacuum in the sense of second quantization, with the elementary excitations as particles on that vacuum. Depending on the system, the vacuum may be the Fermi sea or some state with a broken symmetry, like a ferromagnet, a superconductor, or the crystal lattice itself. 

According to P. W. Anderson,[1] the description of the properties of materials rests on two principles: The principle of _adiabatic continuity_ and the principle of _spontaneously broken symmetry_ . By adiabatic continuity we mean that complicated systems may be replaced by simpler systems that have the same essential properties in the sense that the two systems may be adiabatically deformed into each other without changing qualitative properties. Arguably the most impressive example is Landau’s Fermi liquid theory mentioned above. The low-energy properties of strongly interacting electrons are the same as those of non-interacting fermions with renormalized parameters. On the other hand, phase transitions into states with qualitatively different properties can often be characterized by broken symmetries. In magnetically ordered states the rotational symmetry and the time-reversal invariance are broken, whereas in the superconducting state the global gauge symmetry is. In many cases the violation of a symmetry is a guiding principle which helps to simplify the theoretical description considerably. Moreover, in recent years some systems have been recognized as having topological order which may be considered as a further principle to characterize low-energy states of matter. A famous example for this is found in the context of the Quantum Hall effect. 

The goal of these lectures is to introduce these basic concepts on which virtually all more elaborate methods are building up. In the course of this, we will cover a wide range of frequently encountered ground states, starting with the theory of metals and semiconductors, proceeding with magnets, Mott insulators, and finally superconductors.

## **Chapter 1** 

## **- Electrons in the periodic crystal band structure** 

One of the characteristic features of many solids is the regular arrangement of their atoms forming a crystal. Electrons moving in such a crystal are subject to a _periodic potential_ which originates from the lattice of ions and an averaged electron-electron interaction (like HartreeFock approximation). The spectrum of extended electronic states, i.e. delocalized eigenstates of the Schr¨odinger equation, form bands of allowed energies and gaps of ”forbidden” energies. There are two limiting starting points towards the understanding of the band formation: (1) the _free electron gas_ whose continuous spectrum is broken up into bands under the influence of a periodic potential (electrons undergo Bragg scattering); (2) _independent atoms_ are brought together into a lattice until the outer-most electronic states overlap and lead to delocalized states turning a discrete set of states into continua of electronic energies - bands. In this chapter we will address the emergence of band structures from these two limiting cases. The band structure of electrons is essential for the basic classification of materials into metals and insulators (semiconductors). 

## **1.1 Symmetries of crystals** 

## **1.1.1 Space groups of crystals**

- If the number of electrons per unit cell is odd, the uppermost non-empty band is half filled (see Figure 1.8). Then the system is a _metal_ , in which electrons can move and excitations with arbitrarily small energies are possible. The electrons remain mobile down to arbitrarily low temperatures. The standard example of a metal are the Alkali metals in the first column of the periodic table (Li, Na, K, Rb, Cs), as all of them have the configuration [noble gas] (ns)[1] , i.e., one mobile electron per ion.

The electronic structure is also responsible for the cohesive forces necessary for the formation of a regular crystal. We may also classify materials according to relevant forces. We distinguish four major types of crystals: 

- **Molecular crystals** are formed from atoms or molecules with closed-shell atomic structures such as the noble gases He, Ne etc. which become solid under pressure. Here the van der Waals forces generate the binding interactions. 

- **Ionic crystals** combine different atoms, A and B, where A has a small ionization energy while B has a large electron affinity. Thus, electrons are transferred from A to B giving a positively charged A[+] and a negatively charge _B[−]_ . In a regular (alternating) lattice the energy gained through Coulomb interaction can overcome the energy expense for the charge transfer stabilizing the crystal. A famous example is NaCl where one electron leaves Na ([Ne] 3 _s_ ) and is added to Cl ([Ne] 3 _s_[2] 3 _p_[5] ) as to bring both atoms to closed-shell electronic configuration. 

- **Covalent-bonded crystals** form through chemical binding, like in the case of the H2, where neighboring atoms share electrons through the large overlap of the electron orbital wavefunction. Insulators like diamond C or semiconductors like Si or GaAs are important examples of this type as we will discuss later. Note that electrons of covalent bonds are localized between the atoms. 

- **Metallic bonding** is based on delocalized electrons (in contrast to the covalent bonds) stripped from their atoms. The stability of simple metals like the alkaly metals Li, Na, K etc will be discussed later. Note that many metals, such as the noble metals Au or Pt, can also

## **Appendix: Approximative band structure calcuations** 

While the approximation of nearly free electrons gives a qualitative picture of the band structure, it rests on the assumption that the periodic potential is weak, and, thus, may be treated as a small perturbation. Only few states connected with different reciprocal lattice vectors are sufficient within this approximation. However, in reality the ionic potential is strong compared to the electrons’ kinetic energy. This leads to strong modulations of the wave function around the ions, which is not well described by slightly perturbed plane waves.

## **Metals** 

The electronic states in a periodic atomic lattice are extended and have an energy spectrum forming energy bands. In the ground state these energy states are filled successively starting at the bottom of the electronic spectrum until the number of electrons is exhausted. Metallic behavior occurs whenever in this way a band is only partially filled. The fundamental difference that distinguishes metals from insulators and semiconductors is the absence of a gap for electronhole excitations. In metals, the ground state can be excited at arbitrarily small energies which has profound phenomenological consequences. 

We will consider a basic model suitable for the description of simple metals like the Alkali metals Li, Na, or K, where the (atomic) electron configuration consists of closed shell cores and one single valence electron in an ns-orbital. Neglecting the core electrons (completely filled bands), we consider the valence electrons only and apply the approximation of nearly free electrons. The lowest band around the Γ-point is then half-filled. First, we will also neglect the influence of the periodic lattice potential and consider the problem of a free electron gas subject to mutual (repulsive) Coulomb interaction.

## **Picture of the potential landscape** 

When the magnetic field is varied the filling _ν_ = _n_ 02 _πℓ_[2] of the Landau level is adjusted accordingly. While all states of a given level are degenerate in the transitionally invariant case, now, these states are spread over a certain energy range due to the disorder. In the quasi-classical approximation, these states correspond to equipotential trajectories that are either filled or empty depending on the strength of the magnetic field, i.e. they are either below or above the chemical potential. These considerations lead to an intuitive picture on localized (closed trajectories) and extended (percolating trajectories) states. We may consider the potential landscape like a real landscape where the the trajectories are contour lines. Assume that we fill now water into such a landscape. The trajectories of the particles is restricted to the shore line. For small filling, we find lakes whose shores are closed and correspond to contour lines. They correspond to closed electron trajectories and represent localized electronic states. At very high water level, only the large mountains of the potential landscape would reach out of the water, forming islands in the sea. The coastlines again represent closed trajectories corresponding to localized electronic states. At some intermediate filling, a boundary between the lake and the island topology, there is a water level at which the coast lines become arbitrarily long and percolate through the whole landscape. Only these contour lines correspond to extended (non-localized) electron states. From this picture we conclude that when a Landau level of a system subject to a random potential is gradually filled, first all occupied state are localized (low filling). At some special intermediate filling level, the extended states are filled and contribute to the current transport. At higher chemical potential (filling) the states would be localized again. In the following argument, going back to Robert B. Laughlin, the presenc ## **Landau’s Theory of Fermi Liquids** 

In the previous chapters, we considered the electrons of the system as more or less independent particles. The effect of their mutual interactions only entered via the renormalization of potentials and collective excitations. The underlying assumptions of our earlier discussions were that electrons in the presence of interactions can still be described as particles with a well-defined energy-momentum relation, and that their groundstate is a filled Fermi sea with a sharp Fermi surface. Since there is no guarantee that this hypothesis holds in general (and in fact they do not), we have to show that in metals the description of electrons as quasiparticles is justified. This quasiparticle picture will lead us to Landau’s phenomenological theory of Fermi liquids.

## **Chapter 6** 

## **Transport properties of metals** 

The ability to transport electrical current is one of the most remarkable and characteristic properties of metals. At zero temperature, a ideal pure metal is a perfect electrical conductor, i.e., its resistivity is zero. However, disorder due to impurities and lattice defects influence the transport and yield a finite _residual resistivity_ , as found in real materials. At finite temperature, electron-electron and electron-phonon scattering lead to a temperature-dependent resistivity. Furthermore, an external magnetic field may influence the resistivity, a phenomenon called magnetoresistance, and also leads to the previously studied Hall effect. In this chapter, the effects of a magnetic field will not be considered. Finally, heat transport, which is also mostly mediated by electrons in metals, is going hand in hand with the electric transport. In this context, transport phenomena such as thermoelectricity (Seebeck and Peltier effect) will be analyzed here.

## **Chapter 7** 

## **Magnetism in metals** 

Magnetic ordering in metals can be viewed as an instability of the Fermi liquid state. We enter this new behavior of metals through a detailed description of the Stoner ferromagnetism. The discussion of antiferromagnetism and spin density wave phases will be only brief here. In Stoner ferromagnets the magnetic moment is provided by the spin of itinerant electrons. Magnetism due to localized magnetic moments will be considered in the context of Mott insulators which are subject of the next chapter. 

Well-known examples of elemental ferromagnetic metals are iron (Fe), cobalt (Co) and nickel (Ni) belonging to the 3 _d_ transition metals, where the 3 _d_ -orbital character is dominant for the conduction electrons at the Fermi energy. These orbitals are rather tightly bound to the atomic cores such that the electron mobility is reduced, enhancing the effect of interaction which is essential for the formation of a magnetic state. 

Other forms of magnetism, such as antiferromagnetism and the spin density wave state are found in the 3 _d_ transition metals Cr and Mn. On the other hand, 4 _d_ and 5 _d_ transition metals within the same columns of the periodic system are not magnetic. Their _d_ -orbitals are more extended, leading to a higher mobility of the electrons, such that the mutual interaction is insufficient to trigger magnetism. It is, however, possible to find ferromagnetism in ZrZn2 where zink (Zn) may act as a spacer reducing the mobility of the 4 _d_ -electrons of zirconium (Zr). The 4 _d_ -elements Pd and Rh and the 5 _d_ -element Pt are, however, nearly ferromagnetic. Going further in the periodic table, the 4 _f_ -orbitals appearing in the lanthanides are nearly localized and can lead to ferromagnetism, as illustrated by the elements going from Gd through Tm in the periodic system. 

Magnetism appears through a phase transition, meaning that the metal is non-magnetic at temperatures above a critical temperature _Tc_ , the Curie-temperature (cf. Table 7.1). In many cases, magnetism appears at _Tc_ as a continuous, second order phase transition involving the spontaneous violation of symmetry. This transition is lacking latent heat (no discontinuity in entropy and volume) but instead features a discontinuity in the specific heat.

Let us eventually turn to the question, why Cu, being a direct neighbor of Ni in the 3d-row of the periodic table, is not ferromagnetic, even though both elemental metals share the same fcc crystal structure. The answer is given by the Stoner instability criterion _UN_ ( _ϵF_ ) = 2. While the conduction electrons at the Fermi level of Ni have 3d-character and belong to a narrow band with a large density of states, the Fermi energy of Cu is situated in the broad 4s-band and constitutes a much smaller density of states (cf. Figure 7.4). With this, the Cu conduction electrons are much less localized and feature a weaker tendency towards ferromagnetic order. Copper is known to be a better conductor than Ni for the same reason.

## **Magnetism of localized moments** 

Up to now, we have mostly assumed that the interaction between electrons leads to secondary effects. This was, essentially, the message of the Fermi liquid theory, the standard model of condensed matter physics. There, the interactions of course renormalize the properties of a metal, but their description is still possible by using a language of nearly independent fermionic quasiparticles with a few modifications. Even in connection with the magnetism of itinerant electrons, where interactions proved to be crucial, the description in terms of extended Bloch states. Many properties were determined by the band structure of the electrons in the lattice, i.e., the electrons were preferably described in _k_ -space. 

However, in this chapter, we will consider situations, were it is less clear wether we should describe the electrons in momentum or in real space. The problem becomes obvious with the following Gedanken experiment: We look at a regular lattice of H-atoms. The lattice constant should be large enough such that the atoms can be considered to be independent for now. In the ground state, each H-atom contains exactly one electron in the 1 _s_ -state, which is the only atomic orbital we consider at the moment. The transfer of one electron to another atom would cost the relatively high energy of _E_ ( _H_[+] )+ _E_ ( _H[−]_ ) _−_ 2 _E_ ( _H_ ) _∼_ 15eV, since it corresponds to an ionization. Therefore, the electrons remain localized on the individual H-atoms and the description of the electron states is obviously best done in real space. The reduction of the lattice constant will gradually increase the overlap of the electron wave functions of neighboring atoms. In analogy to the H2 molecule, the electrons can now extend on neighboring atoms, but the cost in energy remains that of an “ionization”. Thus, transfer processes are only possible virtually, there are not yet itinerant electrons in the sense of a metal.

<script>
function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>

<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
