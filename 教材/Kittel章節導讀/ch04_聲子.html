# Kittel 第4–5章 對照導讀 — 聲子：晶體振動與熱性質（Phonons I & II）

> **這頁是什麼**：讀 Kittel 這兩章時的對照地圖——概念橋（高中→大學→固態）＋術語速查。完整課文見 [Kittel 翻譯本對應章節](../Kittel_翻譯.html)；想看完整推導與考題，見 [單元教學 unit04](../../單元教學/unit04_聲子與晶格振動.html)。

## 🗺️ 這一章在講什麼（3–6 句白話）

固體不是死的——原子會在平衡位置附近抖動。**第4章（晶體振動）**把整排原子當成「用彈簧串起來的珠子」，寫下運動方程，解出**色散關係（dispersion relation）** $\omega(K)$：頻率怎麼隨波矢變化。重點結論有三個：(1) 只有**第一布里淵區（first Brillouin zone）** 內的 $K$ 有意義；(2) 區邊界處群速為零（駐波）；(3) 原胞裡有 $p$ 個原子，就有 3 條**聲學支（acoustic）**＋ $3p-3$ 條**光學支（optical）**。最後把振動能量量子化，這個量子就叫**聲子（phonon）**。

**第5章（熱性質）**把聲子當成一團氣體，算它對**熱容（heat capacity）** 的貢獻：用**普朗克分佈（Planck distribution）** 數每個模式有幾個聲子，配上**態密度（density of states）** $D(\omega)$，得到**德拜模型（Debye）** 的低溫 $T^3$ 定律與**愛因斯坦模型（Einstein）**。再談**非諧性（anharmonicity）** 帶來的熱膨脹與熱傳導，並用 **umklapp（U）過程** 解釋高溫熱阻 $\propto 1/T$。

## 🌉 概念三層對應表（高中 → 大學普物 → 本章固態物理）

| 高中你學過的 | 大學普物的版本 | 本章固態物理變成 |
|---|---|---|
| 彈簧 $F=-kx$、單擺週期 | 簡諧振子、角頻率 $\omega=\sqrt{k/m}$ | 一排原子用力常數 $C$ 連起，求運動方程 |
| 波 $v=f\lambda$、波速固定 | 波矢 $K=2\pi/\lambda$、$\omega=vK$ | **色散關係** $\omega(K)=\sqrt{4C/M}\,\lvert\sin(Ka/2)\rvert$（不再是直線！） |
| 駐波（兩端固定的弦） | 邊界條件決定允許波長 | 週期性邊界條件 → 允許的 $K$ 是離散點，區內共 $N$ 個 |
| 光是一顆顆光子 $E=hf$ | 量子諧振子 $E=(n+\tfrac12)\hbar\omega$ | 晶格振動量子化 → **聲子** $E=(n+\tfrac12)\hbar\omega$ |
| 動量守恆 | 碰撞中總動量守恆 | 波矢選擇規則 $\mathbf k'=\mathbf k+\mathbf K+\mathbf G$（可差一個倒格向量） |
| 加熱要吸熱、比熱 | 杜隆–珀蒂 $C=3Nk_B$ | 低溫時 $C\to 0$；德拜 $C\propto T^3$、愛因斯坦 $\propto e^{-\theta/T}$ |
| 熱脹冷縮 | 位能井不對稱 | 非諧項 $x^3$ → 熱膨脹；三聲子 U 過程 → 熱阻 $\propto 1/T$ |

## 🔑 專有名詞 × 範例（速查）

<details>
<summary><b>▸ 力常數（force constant $C$）</b></summary>

**白話**：相鄰原子平面之間「彈簧的硬度」。
**高中接點**：彈簧常數 $k$。
**定義**：平面 $s$ 受到鄰面位移差造成的力 $F_s=C(u_{s+1}+u_{s-1}-2u_s)$（虎克形式，縱波橫波各不同）。
**範例**：金屬中有效力可延伸到相隔多達 20 個原子平面，可由實驗色散反推 $C_p$。
**在 Kittel 哪裡**：第4章「單原子基底晶體的振動」，式 (2)；「由實驗推導力常數」。
</details>

<details>
<summary><b>▸ 色散關係（dispersion relation $\omega(K)$）</b></summary>

**白話**：頻率隨波矢怎麼變的那條曲線——它不是直線，會在區邊界「壓平」。
**高中接點**：本來以為 $\omega=vK$（直線），這裡彎掉了。
**定義**：單原子鏈 $\displaystyle \omega^2=\frac{4C}{M}\sin^2\!\frac{Ka}{2}$，即 $\omega=\sqrt{4C/M}\,\bigl|\sin(Ka/2)\bigr|$。
**範例**：長波極限 $Ka\ll1$ 回到 $\omega\approx vK$（聲速與頻率無關），符合連續介質。
**在 Kittel 哪裡**：第4章式 (7)(9)，圖 4。
</details>

![單原子鏈色散 $\omega=2\sqrt{C/M}\,|\sin(Ka/2)|$：長波近線性（聲速），區邊界飽和到 $\omega_{\max}$](../../figs/f04_mono_dispersion.svg)

<details>
<summary><b>▸ 第一布里淵區（first Brillouin zone）</b></summary>

**白話**：所有「真正不重複」的波矢都裝在這個範圍裡，超出去的只是複製品。
**高中接點**：駐波只需要比 $2a$ 長的波長就能描述，更短的沒有新意義。
**定義**：$-\pi/a< K\le \pi/a$；$K$ 加減倒格向量 $2\pi n/a$ 後落回區內，位移比不變。
**範例**：$K>\pi/a$ 的波（圖 5）描述的晶格運動，跟某個區內 $K$ 完全一樣。
**在 Kittel 哪裡**：第4章「第一布里淵區」，式 (10)–(11)。
</details>

<details>
<summary><b>▸ 群速 / 相速（group / phase velocity）</b></summary>

**白話**：群速是「能量（波包）跑多快」＝曲線斜率；相速是「單一波峰跑多快」。
**高中接點**：$v=f\lambda$ 是相速；群速是 $d\omega/dK$。
**定義**：$v_g=d\omega/dK$。對單原子鏈 $v_g=\sqrt{Ca^2/M}\,\cos(Ka/2)$。
**範例**：在區邊界 $K=\pi/a$，$v_g=0$——是駐波，淨能量傳輸為零。
**在 Kittel 哪裡**：第4章「群速」，式 (14)，圖 6。
</details>

<details>
<summary><b>▸ 聲學支 / 光學支（acoustic / optical branch）</b></summary>

**白話**：原胞有兩種原子時，色散裂成兩條——低頻「一起動」是聲學，高頻「相對動」是光學。
**高中接點**：兩顆不同質量、用彈簧連的振子，有「同向」和「反向」兩種模。
**定義**：原胞有 $p$ 個原子 → 3 條聲學支 ＋ $3p-3$ 條光學支（LA/TA/LO/TO）。
**範例**：Ge、KBr 原胞 2 原子 → 6 支：1 LA、1 LO、2 TA、2 TO。光學支 $K=0$ 處兩原子反相、質心不動（帶異號電荷時可被光波激發）。
**在 Kittel 哪裡**：第4章「原始基底含兩個原子」，圖 7–10；兩支之間有頻率縫隙。
</details>

![雙原子鏈色散：下方聲學支與上方光學支，兩支之間有頻率能隙](../../figs/f04_diatomic_dispersion.svg)

<details>
<summary><b>▸ 聲子（phonon）</b></summary>

**白話**：晶格振動的能量「一份一份」的那個量子，就像光的光子。
**高中接點**：光子 $E=hf$；這裡換成晶格波。
**定義**：模式被激發到量子數 $n$ 時能量 $E=(n+\tfrac12)\hbar\omega$，含零點能 $\tfrac12\hbar\omega$。
**範例**：聲子**不帶真實動量**（除 $K=0$ 外是相對座標），但和光子/中子作用時表現得像有動量 $\hbar K$。
**在 Kittel 哪裡**：第4章「彈性波的量子化」「聲子動量」，式 (25)。
</details>

<details>
<summary><b>▸ 波矢選擇規則 與 中子非彈性散射（wavevector selection rule & inelastic neutron scattering）</b></summary>

**白話**：聲子被「打出來/吸收」時，進出波矢要對得上（可差一個倒格向量）；中子撞晶格就是用這招量 $\omega(K)$。
**高中接點**：碰撞的動量守恆＋能量守恆。
**定義**：$\mathbf k+\mathbf K=\mathbf k'+\mathbf G$（產生聲子）或 $\mathbf k+\mathbf K=\mathbf k'$（吸收），外加能量守恆 $\tfrac{\hbar^2k^2}{2M_n}=\tfrac{\hbar^2k'^2}{2M_n}\pm\hbar\omega$。
**範例**：Ge、KBr、Na 的色散曲線（圖 8、11）都是中子非彈性散射量出來的。
**在 Kittel 哪裡**：第4章「聲子動量」「聲子非彈性散射」，式 (30)–(34)。
</details>

<details>
<summary><b>▸ 普朗克分佈（Planck distribution）</b></summary>

**白話**：溫度 $T$ 下，某個頻率 $\omega$ 的模式平均「裝了幾個聲子」。
**高中接點**：玻爾茲曼因子 $e^{-E/k_BT}$ 的加權平均。
**定義**：$\displaystyle \langle n\rangle=\frac{1}{e^{\hbar\omega/k_BT}-1}$。
**範例**：高溫 $k_BT\gg\hbar\omega$ 時 $\langle n\rangle\approx k_BT/\hbar\omega$（與 $T$ 成線性）。
**在 Kittel 哪裡**：第5章「普朗克分佈」，式 (2)–(5)，圖 1。
</details>

<details>
<summary><b>▸ 態密度（density of states $D(\omega)$）</b></summary>

**白話**：在某個頻率附近、每單位頻率有「幾個振動模式」。
**高中接點**：把允許的 $K$ 點數出來，再換成「每單位 $\omega$ 有幾個」。
**定義**：$\displaystyle D(\omega)=\frac{V}{(2\pi)^3}\int\frac{dS_\omega}{|\nabla_K\omega|}$；群速為零處出現**范霍夫奇異性（van Hove singularity）**。
**範例**：一維 $D(\omega)=\dfrac{2N}{\pi}\dfrac{1}{\sqrt{\omega_m^2-\omega^2}}$，在 $\omega\to\omega_m$ 發散。
**在 Kittel 哪裡**：第5章「正模計數」「一/三維的態密度」「$D(\omega)$ 的一般結果」，圖 12–14。
</details>

<details>
<summary><b>▸ 德拜模型 與 $T^3$ 定律（Debye model & $T^3$ law）</b></summary>

**白話**：把聲子當成「聲速固定」的彈性波，得到低溫熱容隨 $T^3$ 掉下去。
**高中接點**：低溫時很難加熱（比熱趨零），不是常數。
**定義**：$\omega=vK$，截止頻率由模式總數 $=N$ 定出；低溫 $C_V\approx \tfrac{12\pi^4}{5}Nk_B(T/\theta)^3$，$\theta$ 是德拜溫度。
**範例**：固態氬在 $\theta=92\,$K 以下漂亮符合 $T^3$（圖 9）；高溫回到 $3Nk_B$。
**在 Kittel 哪裡**：第5章「德拜態密度模型 → 德拜 $T^3$ 定律」，圖 7–10。
</details>

![Debye 比熱：低溫 $\propto T^3$、高溫趨杜隆–珀蒂 $3R$](../../figs/f04_debye_heat.svg)

<details>
<summary><b>▸ 愛因斯坦模型（Einstein model）</b></summary>

**白話**：假設所有振子同一個頻率 $\omega_0$；簡單但低溫掉太快。
**高中接點**：杜隆–珀蒂 $3Nk_B$ 的量子修正版。
**定義**：$D(\omega)=N\delta(\omega-\omega_0)$；高溫 → $3Nk_B$，低溫隨 $e^{-\hbar\omega/k_BT}$ 掉。
**範例**：常用來近似聲子譜裡的**光學支**（頻率較集中）；鑽石用 $\theta_E\approx1320\,$K 擬合（圖 11）。
**在 Kittel 哪裡**：第5章「愛因斯坦態密度模型」，式 (33)–(34)。
</details>

<details>
<summary><b>▸ 非諧性 與 熱膨脹（anharmonicity & thermal expansion）</b></summary>

**白話**：位能井不是完美對稱的拋物線——有 $x^3$ 項，加熱時原子平均位置會往外挪，所以熱脹。
**高中接點**：純諧（拋物線）位能不會熱脹；要有不對稱項。
**定義**：$U(x)=cx^2-gx^3-fx^4$；用玻爾茲曼平均得 $\langle x\rangle\approx \dfrac{3g}{4c^2}k_BT$（最低階只靠不對稱 $gx^3$ 項）。
**範例**：固態氬晶格常數隨 $T$ 上升（圖 15），斜率 $\propto$ 熱膨脹係數。
**在 Kittel 哪裡**：第5章「非諧晶格相互作用 → 熱膨脹」，式 (37)–(39)。
</details>

<details>
<summary><b>▸ umklapp 過程 與 熱阻（umklapp process & thermal resistance）</b></summary>

**白話**：兩個聲子相撞、合成的波矢「跑出第一布里淵區」，得加一個倒格向量 $\mathbf G$ 拉回來——這一拉就把熱流「掉頭」，造成熱阻。
**高中接點**：氣體熱導用「平均自由程」$K=\tfrac13Cv\ell$；這裡 $\ell$ 由 U 過程決定。
**定義**：正常（N）過程 $\mathbf K_1+\mathbf K_2=\mathbf K_3$ 不產生熱阻（守恆動量）；**U 過程** $\mathbf K_1+\mathbf K_2=\mathbf K_3+\mathbf G$（$\mathbf G\neq0$）才產生熱阻。
**範例**：高溫所有模式都激發，U 過程多 → 熱阻 $\propto T$（熱導率 $\propto 1/T$）；低溫 U 過程因需高能聲子而被凍結（$\propto e^{\theta/2T}$），改由邊界/同位素散射主導。
**在 Kittel 哪裡**：第5章「熱傳導 → 聲子氣體的熱阻 → umklapp 過程 → 缺陷」，式 (42)，圖 16–19。
</details>

## ⚠️ 讀這章常卡的點 ＋ 翻譯雷區

- **「聲子有動量 $\hbar K$」是假的（crystal momentum）**：聲子不攜帶真實物理動量（$K=0$ 除外），只是在選擇規則 $\mathbf k'=\mathbf k+\mathbf K+\mathbf G$ 裡「表現得像」有動量。Kittel 特別澄清——別把它當真動量。
- **雙原子鏈的 $a$ 定義要看清楚**：第4章圖 9 把 $a$ 定義為「最近的**同種**平面之距離」，不是最近鄰平面距離。代式 (18)→(19) 時搞錯 $a$，色散會整個錯。
- **聲學/光學支數目別記反**：是 **3 條聲學** ＋ $3p-3$ 條光學（不是「3 條光學」）。$p=1$ 時 $3p-3=0$，所以單原子鏈沒有光學支。
- **德拜 vs 愛因斯坦的低溫行為**：德拜給 $T^3$（聲學支、長波），愛因斯坦給 $e^{-\theta/T}$（光學支、單一頻率）。實驗低溫是 $T^3$，所以光學支用愛因斯坦近似、聲學支用德拜。別把兩者的低溫式互換。
- **N 過程「不」造成熱阻，U 過程才會**：很多人以為「聲子互撞就有熱阻」。錯——N 過程守恆總聲子動量 $\mathbf J$，熱流照樣傳（圖 16c，熱阻為零）；必須是改變 $\mathbf J$ 的 U 過程才行。
- **翻譯本亂碼／OCR 雷區**：章名出現「光子 I」「音子」「漿子」其實是「**聲子（phonon）**／**電漿子（plasmon）**」等的誤譯；大量公式被替換成 `==> picture intentionally omitted <==`（色散式 (7)(9)、態密度、$T^3$ 式都是），表 1（德拜溫度）、表 2/11/12 的數字欄位被擠在一起。關鍵式請回 [Kittel 翻譯本](../Kittel_翻譯.html) 或對照 [原文](../Kittel_原文.html)。

## 📝 實際範例（Worked Examples）

### 例題 1：單原子鏈的最大頻率（maximum frequency）

**題目**：單原子鏈的色散關係為 $\omega=2\sqrt{C/M}\,\lvert\sin(Ka/2)\rvert$。給力常數 $C=15$ N/m、原子質量 $M=4.0\times10^{-26}$ kg，求最大角頻率 $\omega_{\max}$ 與對應頻率 $f_{\max}$。

**Step 1**：$\lvert\sin(Ka/2)\rvert$ 的最大值為 1，發生在 $Ka/2=\pi/2$，即布里淵區邊界 $K=\pi/a$。故 $\omega_{\max}=2\sqrt{C/M}$。

**Step 2**：先算比值 $\dfrac{C}{M}=\dfrac{15}{4.0\times10^{-26}}=3.75\times10^{26}\ \text{s}^{-2}$。

**Step 3**：開根號 $\sqrt{3.75\times10^{26}}=1.936\times10^{13}\ \text{s}^{-1}$，再乘 2：

$$\omega_{\max}=2\times1.936\times10^{13}=3.87\times10^{13}\ \text{rad/s}.$$

**Step 4**：換算頻率 $f_{\max}=\omega_{\max}/2\pi=3.87\times10^{13}/6.283\approx6.16\times10^{12}\ \text{Hz}$。

$$\boxed{\omega_{\max}=2\sqrt{C/M}\approx3.87\times10^{13}\ \text{rad/s}\;\;(f_{\max}\approx6.2\ \text{THz})}$$

### 例題 2：群速度（group velocity）在布里淵區邊界為零

**題目**：承例題 1 的色散關係，求群速度 $v_g=d\omega/dK$，並證明在區邊界 $K=\pi/a$ 處 $v_g=0$。

**Step 1**：寫出 $\omega=2\sqrt{C/M}\,\sin(Ka/2)$（取 $0\le K\le\pi/a$，此區間 $\sin$ 為正，可去絕對值）。

**Step 2**：對 $K$ 微分。內層 $\dfrac{d}{dK}\!\left(\dfrac{Ka}{2}\right)=\dfrac{a}{2}$，故

$$v_g=\frac{d\omega}{dK}=2\sqrt{\frac{C}{M}}\cdot\cos\!\frac{Ka}{2}\cdot\frac{a}{2}=a\sqrt{\frac{C}{M}}\,\cos\!\frac{Ka}{2}.$$

**Step 3**：代入區邊界 $K=\pi/a$，則 $\dfrac{Ka}{2}=\dfrac{\pi}{2}$，而 $\cos(\pi/2)=0$。

**Step 4**：故 $v_g=a\sqrt{C/M}\times0=0$，代表此處是駐波、無淨能量傳輸。

$$\boxed{v_g=a\sqrt{C/M}\,\cos(Ka/2);\quad v_g\big|_{K=\pi/a}=0}$$

### 例題 3：德拜 $T^3$ 定律的低溫比熱比值

**題目**：某固體德拜溫度 $\theta_D=300$ K。在低溫區（$T\ll\theta_D$）熱容遵守 $C_V\propto T^3$。求 $T=30$ K 與 $T=3$ K 的比熱比值 $C_V(30)/C_V(3)$。

**Step 1**：確認兩個溫度都遠小於 $\theta_D=300$ K（$30/300=0.1$、$3/300=0.01$，皆 $\ll1$），$T^3$ 定律適用。

**Step 2**：因 $C_V=A\,T^3$（同一物質 $A$ 相同），比值只與溫度三次方有關：

$$\frac{C_V(30)}{C_V(3)}=\frac{A\,(30)^3}{A\,(3)^3}=\left(\frac{30}{3}\right)^3.$$

**Step 3**：計算 $\left(\dfrac{30}{3}\right)^3=10^3=1000$。

$$\boxed{\frac{C_V(30\,\text{K})}{C_V(3\,\text{K})}=\left(\frac{30}{3}\right)^3=1000}$$

（溫度差 10 倍，低溫比熱差 1000 倍——這就是 $T^3$ 定律「掉得很快」的具體感受。）

<script>
function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>

<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
