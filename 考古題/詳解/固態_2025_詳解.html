# 固態物理導論 2025 資格考 — 教學版逐題詳解（從普物起建 · 代數不跳步）

> **寫法**(對齊 QFT tutorials):每題走
> `📋 原題 → 題目（白話版）→ 🎯 核心訊息 → 🧭 約定 → 📚 前情提要(從普物串上來) → 🔍 符號說明(點開,熱身/中階/本題三範例) → 解答 Step(每步附小結) → ✅ 自我檢核 → 🔀 變化的可能情況 → 信心`。
> 共用觀念另見 [`_共用觀念與公式.html`](_共用觀念與公式.html)。
> **註**:本卷整體偏輕(Q3/Q4 為 5% 短答);**Q1(40%)、Q2(30%) 已加深到嚴格推導**(從圖推向量、定理證 basis、結構因子消光)。想看真正硬的長推導,見 `固態_2016_詳解`(Bloch 證明、Kronig–Penney、Wiedemann–Franz 等)。

## 🧭 全卷約定
- 2D:$\hat e_x$ 右、$\hat e_y$ 上;倒晶格 $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$;自由電子 $E=\hbar^2k^2/2m$。
- 配分 **1(40%)·2(30%)·3(20%)·4(10%)**。閉書,符號依 Kittel。

# 📘 第 1 題 — 二維晶體結構（40%）

## 📋 原題
> A 2D structure (right figure): species α (β) = solid (open) symbols; $\hat e_x,\hat e_y$ along $x,y$.
> **(a)** α、β **same** element, $b=a/3$: derive $\mathbf a_1,\mathbf a_2$, draw the primitive cell, state how many atoms in the basis. (20%)
> **(b)** α、β **different**, $b=a/6$: same. (20%)

## 題目（白話版）
給兩種點 α(實心)、β(空心)與尺寸 $a,2a/3,b$。要 (1) 最小重複向量 $\mathbf a_1,\mathbf a_2$;(2) 畫原胞;(3) 數基元原子數。(a) 同種、$b=a/3$;(b) 異種、$b=a/6$。

## ⚠️ 原圖與讀法（請先確認）
![2025 第1題原圖](figs/固態_2025_第1題_原圖.png)

- ● = α、○ = β,各排成直行、α 行與 β 行水平交替。
- **α 子晶格 = 矩形**:水平週期 $a$(底「a」標尺)、垂直週期 $\tfrac{2a}{3}$(左「2a/3」)。
- **β** = 與 α 全等矩形格,整體位移 $\boldsymbol\delta=b\hat e_x+\tfrac a3\hat e_y$(水平 $b$;圖示意畫 $a/2$,真值題給;垂直半週期 $\tfrac a3$)。
- 若與原圖不符(尤其 $2a/3$ 是否=α 垂直週期、$b$ 是否=水平偏移),告訴我正確座標即重算。

## 🎯 核心訊息
> **basis 幾顆,由一條定理決定:** 兩個全等子晶格(α 與 α+$\boldsymbol\delta$)合起來仍是「單一 Bravais 格(basis 1)」**若且唯若 $2\boldsymbol\delta$ 是 α 晶格向量、且 $\boldsymbol\delta$ 本身不是**(即 $\boldsymbol\delta$ 為某置心半向量)。本題 $\boldsymbol\delta=(b,\tfrac a3)$,$2\boldsymbol\delta=(2b,\tfrac{2a}3)$:水平 $2b=2a/3$(a)或 $a/3$(b)**都不是 $a$ 的整數倍** → $2\boldsymbol\delta\notin L$ → **不能縮,basis = 2**。

## 📚 前情提要：從普物一路串到本題
### 階段 1（國中/普物):磁磚鋪地
一塊磁磚(可帶花樣)+「右移一格、上移一格」就鋪滿牆。
> **留存**:晶體 = **格子(怎麼重複)** × **花樣(每格放什麼)** = lattice × basis。

### 階段 2（線代):兩個向量描述重複
整齊重複的格點 $\mathbf R=m\mathbf a_1+n\mathbf a_2$;原胞面積 $|\mathbf a_1\times\mathbf a_2|$,**恰含 1 格點**。
> **留存**:Bravais = 「每格點環境都相同」。要嚴格,得**證**你選的 $\mathbf a_1,\mathbf a_2$ 是 primitive(面積最小、含 1 點)。

### 階段 3（晶體學):兩格疊加能不能縮 — 嚴格判準
兩個全等子晶格 $L$ 與 $L+\boldsymbol\delta$ 的聯集 $S$。$S$ 仍是 Bravais ⟺ $S$ 對減法封閉。
- 任兩點差落在 $\{L,\ L+\boldsymbol\delta,\ L-\boldsymbol\delta\}$;要全落回 $S$,需 $\boldsymbol\delta-(-\boldsymbol\delta)=2\boldsymbol\delta\in L$。
- 又若 $\boldsymbol\delta\in L$ 則 β 與 α 重合(退化)。故 **$S$ Bravais ⟺ $2\boldsymbol\delta\in L$ 且 $\boldsymbol\delta\notin L$**(此時 $\boldsymbol\delta$ 是置心半向量,basis 可縮 1)。
> **留存**:這就是「(½,½) 置心能縮、(⅓,½) 不能」的嚴格版。**異種原子**則不論幾何一律 basis 2(α≠β 無法用平移互換)。

### 對應表
| 普物 | 本題 |

| 磁磚重複 | $\mathbf a_1=a\hat e_x,\ \mathbf a_2=\tfrac{2a}3\hat e_y$ |
| 花樣 | basis = {α(0,0), β($\boldsymbol\delta$)} |
| 能否更簡 | 判 $2\boldsymbol\delta\in L$? |

> **一句話**:認出 α 矩形格 → 算 $2\boldsymbol\delta$ 在不在 $L$ → 定 basis。

## 🔍 符號說明
<details>
<summary><b>▸ primitive vectors / cell / basis 與「$2\boldsymbol\delta\in L$」縮格定理</b></summary>

### 你普物學過的
鋪磁磚的平移向量 + 每格花樣。

### 為什麼要這個
把無限晶體壓成兩向量+幾顆原子;原胞原子數=基元數=本題要答。

### 定義 + 定理
$\mathbf R=m\mathbf a_1+n\mathbf a_2$,原胞面積 $|\mathbf a_1\times\mathbf a_2|$ 含 1 格點。
**縮格定理**:$L\cup(L+\boldsymbol\delta)$ 為單一 Bravais(basis 1)⟺ $2\boldsymbol\delta\in L$ 且 $\boldsymbol\delta\notin L$。

**範例 1（熱身）**:正方 $a$,$\boldsymbol\delta=(\tfrac a2,\tfrac a2)$:$2\boldsymbol\delta=(a,a)\in L$ ✓ → 體心式縮成 basis 1。
**範例 2（中階）**:$\boldsymbol\delta=(\tfrac a2,0)$:$2\boldsymbol\delta=(a,0)\in L$ → 其實週期是 $a/2$,basis 1。
**範例 3（本題）**:$\boldsymbol\delta=(\tfrac a3,\tfrac a3)$:$2\boldsymbol\delta=(\tfrac{2a}3,\tfrac{2a}3)$,水平 $\tfrac{2a}3\notin a\mathbb Z$ → **不能縮,basis 2**。
</details>

## 解答

### (a) α=β 同元素,$b=a/3$

**Step 1 — 從圖嚴格定出 α 的 primitive vectors。**
α 落在水平相鄰行間距 $a$、垂直相鄰列間距 $\tfrac{2a}3$ 的矩形交點,且各行各列對齊(非鋸齒)。
- 最短的兩個獨立平移:水平 $\mathbf a_1=a\hat e_x$、垂直 $\mathbf a_2=\tfrac{2a}3\hat e_y$。
- **驗證為 primitive**:此胞面積 $|\mathbf a_1\times\mathbf a_2|=a\cdot\tfrac{2a}3=\tfrac{2a^2}3$;圖中每 $\tfrac{2a^2}3$ 面積恰含 1 個 α 格點 → 是最小重複胞 ✓。
> **小結**:$\mathbf a_1,\mathbf a_2$ 不是用猜的——是「最短獨立平移 + 胞內 1 格點」兩條件定出來的。

**Step 2 — 放上 basis,寫分數座標。**
α 在 $(0,0)$;β 在 $\boldsymbol\delta=\tfrac a3\hat e_x+\tfrac a3\hat e_y$,分數座標 $\big(\tfrac{a/3}{a},\tfrac{a/3}{2a/3}\big)=(\tfrac13,\tfrac12)$。

**Step 3 — 用縮格定理判 basis(嚴格)。**
$2\boldsymbol\delta=\tfrac{2a}3\hat e_x+\tfrac{2a}3\hat e_y$。要 $2\boldsymbol\delta\in L$ 需 $\tfrac{2a}3=m a$ 與 $\tfrac{2a}3=n\tfrac{2a}3$ 同時成立:
- 垂直:$n=1$ ✓;**水平:$m=\tfrac23\notin\mathbb Z$ ✗**。
故 $2\boldsymbol\delta\notin L$ → **不能縮成 basis 1**。
> **小結**:關鍵卡在水平分數 $\tfrac13$:$2\times\tfrac13=\tfrac23\neq$ 整數。若是 $\tfrac12$ 才會 $2\times\tfrac12=1$ 過關。

**Step 4 — 畫原胞、寫結論。**
原胞 = 以 $\mathbf a_1,\mathbf a_2$ 為邊的 $a\times\tfrac{2a}3$ 矩形;左下角放 α,內部 $(\tfrac a3,\tfrac a3)$ 放 β。
$$\boxed{\mathbf a_1=a\hat e_x,\quad \mathbf a_2=\tfrac{2a}3\hat e_y,\quad \text{basis}=2:\ \alpha(0,0),\ \beta(\tfrac a3,\tfrac a3).}$$

### (b) α≠β 不同元素,$b=a/6$

**Step 1 — 座標。** $\boldsymbol\delta=\tfrac a6\hat e_x+\tfrac a3\hat e_y$,分數 $(\tfrac16,\tfrac12)$。
**Step 2 — basis(兩條獨立理由都指向 2)。**
1. **物理**:α≠β,任何晶格平移都無法把 α 變 β → 至少 basis 2。
2. **幾何(縮格定理)**:$2\boldsymbol\delta=(\tfrac a3,\tfrac{2a}3)$,水平 $\tfrac a3=m a\Rightarrow m=\tfrac13\notin\mathbb Z$ → $2\boldsymbol\delta\notin L$,本來幾何上也縮不了。
**Step 3 — 結論。**
$$\boxed{\mathbf a_1=a\hat e_x,\quad \mathbf a_2=\tfrac{2a}3\hat e_y,\quad \text{basis}=2:\ \alpha(0,0),\ \beta(\tfrac a6,\tfrac a3).}$$

<details>
<summary><b>📝 更多範例（點開）：縮格定理 $2\boldsymbol\delta\in L$? 逐步判 basis</b></summary>

判 basis 流程(全等兩子晶格 $L\cup(L+\boldsymbol\delta)$):**①寫分數座標 $\boldsymbol\delta$ ②算 $2\boldsymbol\delta$ ③逐分量問「是不是晶格向量(整數係數)」**。全是整數 → $2\boldsymbol\delta\in L$ → 可縮成 basis 1;只要一個分量非整數 → 縮不掉、basis 2。異種原子另有物理理由,直接 basis 2。

**範例 A（正方體心,可縮）**:正方格 $\mathbf a_1=a\hat e_x,\ \mathbf a_2=a\hat e_y$,$\boldsymbol\delta=(\tfrac a2,\tfrac a2)$,分數 $(\tfrac12,\tfrac12)$。

$$2\boldsymbol\delta=(a,a)=1\cdot\mathbf a_1+1\cdot\mathbf a_2.$$

兩分量係數 $1,1$ 都是整數 → $2\boldsymbol\delta\in L$,且 $\boldsymbol\delta\notin L$(係數 $\tfrac12$ 非整數)→ **可縮成 basis 1**(這就是「正方→體心正方=面心式 2D 格」)。

**範例 B（本題 (a),縮不掉）**:矩形格 $\mathbf a_1=a\hat e_x,\ \mathbf a_2=\tfrac{2a}3\hat e_y$,$\boldsymbol\delta=(\tfrac a3,\tfrac a3)$。先化分數座標:水平 $\dfrac{a/3}{a}=\tfrac13$、垂直 $\dfrac{a/3}{2a/3}=\tfrac12$,故 $\boldsymbol\delta=(\tfrac13,\tfrac12)$(以 $\mathbf a_1,\mathbf a_2$ 為單位)。

$$2\boldsymbol\delta=(\tfrac23,\,1)\ \Rightarrow\ \text{水平係數 }\tfrac23\notin\mathbb Z.$$

垂直係數 $1$ 過關,但**水平 $\tfrac23$ 非整數** → $2\boldsymbol\delta\notin L$ → **縮不掉,basis = 2**。卡點正是水平分數 $\tfrac13$($2\times\tfrac13=\tfrac23$)。

**範例 C（本題 (b),縮不掉且異種）**:$\boldsymbol\delta=(\tfrac a6,\tfrac a3)$,分數 $\big(\dfrac{a/6}{a},\dfrac{a/3}{2a/3}\big)=(\tfrac16,\tfrac12)$。

$$2\boldsymbol\delta=(\tfrac13,\,1)\ \Rightarrow\ \text{水平 }\tfrac13\notin\mathbb Z.$$

幾何上 $2\boldsymbol\delta\notin L$ → 縮不掉;又因 α≠β,**平移無法把 α 換成 β**,獨立再給一個 basis = 2 的理由。兩條都指向 **basis = 2**。

**範例 D（邊心位移,週期其實減半）**:矩形格 $\boldsymbol\delta=(\tfrac a2,0)$,分數 $(\tfrac12,0)$。

$$2\boldsymbol\delta=(a,0)=1\cdot\mathbf a_1+0\cdot\mathbf a_2\in L,\quad \boldsymbol\delta\notin L.$$

可縮 basis 1——而且更直白:β 正好落在兩個 α 的水平中點,真正的水平週期是 $\tfrac a2$ 不是 $a$。重取 $\mathbf a_1'=\tfrac a2\hat e_x$ 後整個結構就是單一矩形格、basis 1。提醒「先檢查有沒有更短平移」。
</details>

## ✅ 自我檢核
- 量綱 $|\mathbf a_i|\sim a$ ✓;面積 $\tfrac{2a^2}3$ ✓。
- 面密度 $2/(\tfrac{2a^2}3)=3/a^2$,(a)(b) 一致 ✓。
- **定理自洽**:取 $b=a/2$(分數 $(\tfrac12,\tfrac12)$)→ $2\boldsymbol\delta=(a,\tfrac{2a}3)=\mathbf a_1+\mathbf a_2\in L$ → 縮 basis 1。題給 $a/3,a/6$ 故意避開,考點正是「縮不了」。

## 🔀 變化的可能情況
- **若 $b=a/2$ 且同元素**:basis 縮 **1**;新 primitive vectors $\mathbf a_1=a\hat e_x,\ \mathbf a_2'=\tfrac a2\hat e_x+\tfrac a3\hat e_y$(中心矩形)。← 最常見「陷阱反面」。
- **若改畫 Wigner–Seitz cell**:矩形格的 WS = 各最近鄰中垂線圍的矩形,面積仍 $\tfrac{2a^2}3$。
- **若 3D(加 $\hat e_z$ 一層)**:定理不變,$2\boldsymbol\delta\in L$ 改在 3D 判;面積換體積。
- **歷年同型**:2023 graphene(basis 2)、2024 認 Bravais+算 primitive cell、2022 CaF₂(basis 3)。同一招:位移是不是晶格(半)向量。

## 📋 原題
> **(a)** Derive $\mathbf b_1,\mathbf b_2$ for $\mathbf a_1,\mathbf a_2$ in 1(a). (10%)　**(b)** Same for 1(b). (10%)

## 🎯 核心訊息
> **倒晶格只認 lattice(峰位置)、結構因子才認 basis(峰強度)。** 1(a)1(b) 的 $\mathbf a_i$ 一樣 → $\mathbf b_i$ 一樣;β 位置只進結構因子 $S_{\mathbf G}$。繞射能否發生看「最短 $|\mathbf G|\le 2k$」,夾角 $2\theta$ 由 $\sin\theta=|\mathbf G|/2k$。

<details>
<summary><b>▸ 一般 2D 倒晶格公式(不靠正交捷徑) + 結構因子</b></summary>

### 為什麼要這個
題目「derive」要看到方法,不能只寫答案;且 (b) 要談 basis → 必用結構因子。

### 定義
把 $\mathbf a_1,\mathbf a_2$ 排成矩陣 $A=\begin{pmatrix}\mathbf a_1\\ \mathbf a_2\end{pmatrix}$,則 $\begin{pmatrix}\mathbf b_1\\ \mathbf b_2\end{pmatrix}=2\pi (A^{-1})^{\mathsf T}$(由 $A B^{\mathsf T}=2\pi I$)。
結構因子 $S_{\mathbf G}=\sum_j f_j e^{i\mathbf G\cdot\mathbf r_j}=f_\alpha+f_\beta e^{i\mathbf G\cdot\boldsymbol\delta}$。

**範例 1（熱身）**:正交 $A=\mathrm{diag}(a_1,a_2)$ → $B=2\pi\,\mathrm{diag}(1/a_1,1/a_2)$。
**範例 2（中階）**:斜方 $\mathbf a_2$ 有 $x$ 分量時 $\mathbf b_1$ 也斜,靠 $A^{-1}$ 自動處理。
**範例 3（本題）**:$f_\alpha=f_\beta$(同種,a)時某些 $S_{\mathbf G}=0$ → 消光;異種(b)不全消。
</details>

## 解答

### (a) 由 1(a) 求 $\mathbf b_1,\mathbf b_2$(一般法 + 驗證)
**Step 1 — 矩陣法。** $A=\begin{pmatrix}a&0\\[2pt]0&\tfrac{2a}3\end{pmatrix}$,$A^{-1}=\begin{pmatrix}1/a&0\\[2pt]0&3/2a\end{pmatrix}$,
$$\begin{pmatrix}\mathbf b_1\\ \mathbf b_2\end{pmatrix}=2\pi(A^{-1})^{\mathsf T}\Rightarrow \boxed{\mathbf b_1=\tfrac{2\pi}a\hat e_x,\quad \mathbf b_2=\tfrac{3\pi}a\hat e_y.}$$
**Step 2 — 用定義驗。** $\mathbf a_1\cdot\mathbf b_1=2\pi$✓,$\mathbf a_2\cdot\mathbf b_2=\tfrac{2a}3\cdot\tfrac{3\pi}a=2\pi$✓,交叉項 0 ✓。

### (b) 由 1(b) 求 $\mathbf b_1,\mathbf b_2$ + 結構因子差異
$\mathbf a_i$ 與 (a) 相同 →
$$\boxed{\mathbf b_1=\tfrac{2\pi}a\hat e_x,\quad \mathbf b_2=\tfrac{3\pi}a\hat e_y\ (\text{同 (a)})。}$$
**深一層:消光差異(這才是 (a)(b) 的物理區別)。** 對 $\mathbf G=h\mathbf b_1+k\mathbf b_2$,$\mathbf G\cdot\boldsymbol\delta=2\pi\!\left(h\tfrac{\delta_x}a+k\tfrac{3\delta_y}{2a}\right)$。
- (a) 同種 $f_\alpha=f_\beta=f$,$\boldsymbol\delta=(\tfrac a3,\tfrac a3)$:$S_{\mathbf G}=f\big(1+e^{i2\pi(h/3+k/2)}\big)$ → 當 $\tfrac h3+\tfrac k2$ 為半整數(如 $h=0,k=1$)時 $S=0$ **消光**。
- (b) 異種 $f_\alpha\ne f_\beta$:$S_{\mathbf G}=f_\alpha+f_\beta e^{i\dots}$ 一般 $\ne0$,**不全消**(峰仍在,強度被調制)。
> **小結**:倒晶格不變,但同種/異種讓「哪些峰消失」不同——這是 basis 真正進場的地方。

### (c) $\lambda=2a/5$ 會繞射嗎?夾角?
**Step 1 — 波數。** $k=\dfrac{2\pi}\lambda=\dfrac{5\pi}a$,$2k=\dfrac{10\pi}a$。
**Step 2 — 能否繞射(Ewald 判據)。** 需存在 $0<|\mathbf G|\le2k$。最短 $|\mathbf b_1|=\tfrac{2\pi}a\approx\tfrac{6.28}a<\tfrac{10\pi}a$ → **會(YES)**。
**Step 3 — 夾角(最低階 $\mathbf G=\mathbf b_1$)。**
$$\sin\theta=\frac{|\mathbf b_1|}{2k}=\frac{2\pi/a}{10\pi/a}=\frac15\Rightarrow \theta=\arcsin\tfrac15\approx11.5^\circ,\quad \boxed{2\theta\approx23.1^\circ.}$$
**Step 4 — 最高階。** 需 $|\mathbf G|=|h|\,|\mathbf b_1|\le2k\Rightarrow |h|\le\dfrac{10\pi/a}{2\pi/a}=5$ → 沿 $\mathbf b_1$ 最高到 $h=5$(共 5 階)。
**Step 5 — Bragg 驗。** $d_{10}=2\pi/|\mathbf b_1|=a$,$\sin\theta=\lambda/2d=\tfrac{2a/5}{2a}=\tfrac15$ ✓。

<details>
<summary><b>📝 更多範例（點開）：矩陣求倒晶格、結構因子消光、繞射角數值</b></summary>

**範例 A（矩陣法求 $\mathbf b_i$,逐步）**:給 $\mathbf a_1=a\hat e_x,\ \mathbf a_2=\tfrac{2a}3\hat e_y$。排成 $A=\begin{pmatrix}a&0\\[2pt]0&\tfrac{2a}3\end{pmatrix}$。對角矩陣的逆是各元素取倒數:

$$A^{-1}=\begin{pmatrix}\tfrac1a&0\\[2pt]0&\tfrac3{2a}\end{pmatrix},\qquad \begin{pmatrix}\mathbf b_1\\ \mathbf b_2\end{pmatrix}=2\pi(A^{-1})^{\mathsf T}=2\pi\begin{pmatrix}\tfrac1a&0\\[2pt]0&\tfrac3{2a}\end{pmatrix}.$$

逐列讀:$\mathbf b_1=\dfrac{2\pi}a\hat e_x$,$\mathbf b_2=2\pi\cdot\dfrac3{2a}\hat e_y=\dfrac{3\pi}a\hat e_y$。驗 $\mathbf a_2\cdot\mathbf b_2=\tfrac{2a}3\cdot\tfrac{3\pi}a=2\pi$ ✓、$\mathbf a_1\cdot\mathbf b_2=0$ ✓。

**範例 B（結構因子消光,同種 $f_\alpha=f_\beta=f$)**:basis $\alpha(0,0)$、$\beta=\boldsymbol\delta$ 分數 $(\tfrac13,\tfrac12)$。對 $\mathbf G=h\mathbf b_1+k\mathbf b_2$,相位 $\mathbf G\cdot\boldsymbol\delta=2\pi(h\cdot\tfrac13+k\cdot\tfrac12)$,故

$$S_{\mathbf G}=f\big(1+e^{\,i2\pi(h/3+k/2)}\big).$$

取 $(h,k)=(0,1)$:指數 $=e^{\,i2\pi\cdot\frac12}=e^{i\pi}=-1$,$S=f(1-1)=0$ → **(0,1) 峰消光**。取 $(h,k)=(0,2)$:$e^{\,i2\pi\cdot1}=1$,$S=2f\neq0$ → 峰在。可見「同種」會讓一半的 $k$ 奇數峰沿 $\mathbf b_2$ 消失。

**範例 C（異種不消,$f_\alpha\ne f_\beta$)**:同上 $(h,k)=(0,1)$ 但 $f_\alpha\ne f_\beta$:

$$S_{\mathbf G}=f_\alpha+f_\beta e^{i\pi}=f_\alpha-f_\beta\neq0\quad(\text{因 }f_\alpha\ne f_\beta).$$

峰**不消**,只是強度 $\propto|f_\alpha-f_\beta|^2$ 被壓低。這就是 (a)(b) 物理差別:倒晶格同、但消光花樣不同。

**範例 D（繞射角數值,$\lambda=2a/5$)**:$k=\dfrac{2\pi}\lambda=\dfrac{2\pi}{2a/5}=\dfrac{5\pi}a$,$2k=\dfrac{10\pi}a$。沿 $\mathbf b_1$ 最低階 $|\mathbf G|=|\mathbf b_1|=\dfrac{2\pi}a$:

$$\sin\theta=\frac{|\mathbf G|}{2k}=\frac{2\pi/a}{10\pi/a}=\frac15=0.2\ \Rightarrow\ \theta=\arcsin0.2\approx11.54^\circ,\quad 2\theta\approx23.07^\circ.$$

最高階沿 $\mathbf b_1$:需 $|h|\,|\mathbf b_1|\le2k\Rightarrow|h|\le\dfrac{10\pi/a}{2\pi/a}=5$,故 $h=1,\dots,5$ 共 5 個繞射級。沿 $\mathbf b_2$($|\mathbf b_2|=\tfrac{3\pi}a$):$\sin\theta=\dfrac{3\pi/a}{10\pi/a}=0.3$,$2\theta\approx34.92^\circ$。
</details>

## ✅ 自我檢核
$\sin\theta=1/5\le1$ ✓。取 $\mathbf b_2$:$\sin\theta=\tfrac{3\pi/a}{10\pi/a}=0.3$,$2\theta\approx34.9^\circ$,亦可。

## 🔀 變化的可能情況
- **波長太長($\lambda>2d_{\max}$)**:最短 $|\mathbf G|>2k$ → 不繞射(理由 $\sin\theta>1$)。
- **問強度/消光**:就用上面 $S_{\mathbf G}$(2018 bcc (100) 消光、2021 fcc/bcc (110) 同型)。
- **3D**:$\mathbf b_1=2\pi\dfrac{\mathbf a_2\times\mathbf a_3}{\mathbf a_1\cdot(\mathbf a_2\times\mathbf a_3)}$。
- **歷年同型**:2022 tetragonal 倒晶格+BZ、2024 倒晶格+BZ、2021 給 λ,θ 算間距。

## 信心:**高**(倒晶格/結構因子/繞射全為完整推導;唯 $\mathbf a_2$ 承第 1 題圖讀)。

## 解答
### (a) $\boxed{\psi_{\mathbf k}(\mathbf r)=e^{i\mathbf k\cdot\mathbf r}u_{\mathbf k}(\mathbf r),\ u_{\mathbf k}(\mathbf r+\mathbf R)=u_{\mathbf k}(\mathbf r).}$
### (b) $e^{ik_iL}=1\Rightarrow k_i=\tfrac{2\pi}L n_i\Rightarrow \boxed{\Delta k_{\min}=2\pi/L.}$
### (c) 每態占 $(2\pi/L)^2$;$N(k)=\dfrac{\pi k^2}{(2\pi)^2/L^2}=\dfrac{L^2k^2}{4\pi}$,$E=\tfrac{\hbar^2k^2}{2m}$ →
$$\boxed{g(E)=\frac{dN}{dE}=\frac{L^2 m}{2\pi\hbar^2}\ (\text{spin-up,不乘 2,與 }E\text{ 無關}).}$$
### (d) $E(k)=\varepsilon_0-\alpha-2\gamma\cos ka$,$\gamma>0$ → $\cos ka=-1$ 最大 → $\boxed{k=\pm\pi/a\ (\text{BZ 邊界}).}$

<details>
<summary><b>📝 更多範例（點開）：k 間距、2D DOS 推導、TB 能帶極值</b></summary>

**範例 A（BvK 定 $k$ 間距,逐步)**:邊長 $L$ 立方,週期邊界 $\psi(\mathbf r+L\hat e_i)=\psi(\mathbf r)$。Bloch 因子 $e^{i k_i L}=1$ 要求 $k_iL=2\pi n_i$($n_i\in\mathbb Z$):

$$k_i=\frac{2\pi}{L}n_i\ \Rightarrow\ \text{相鄰 }(n_i\to n_i+1)\text{ 差 }\Delta k_{\min}=\frac{2\pi}{L}.$$

每個允許態在 $k$ 空間佔一個邊長 $2\pi/L$ 的小盒,2D 面積 $(2\pi/L)^2$、3D 體積 $(2\pi/L)^3$。

**範例 B（2D 自由電子 DOS,單一自旋)**:半徑 $k$ 的圓盤含態數 = 圓面積 ÷ 每態面積:

$$N(k)=\frac{\pi k^2}{(2\pi/L)^2}=\frac{\pi k^2 L^2}{4\pi^2}=\frac{L^2k^2}{4\pi}.$$

代色散 $E=\dfrac{\hbar^2k^2}{2m}\Rightarrow k^2=\dfrac{2mE}{\hbar^2}$,故 $N=\dfrac{L^2}{4\pi}\cdot\dfrac{2mE}{\hbar^2}=\dfrac{L^2mE}{2\pi\hbar^2}$。微分:

$$g(E)=\frac{dN}{dE}=\frac{L^2m}{2\pi\hbar^2}\quad(\text{spin-up,不乘 2;與 }E\text{ 無關,是常數}).$$

**範例 C（含兩自旋 DOS)**:若把上下自旋都算,$N$ 乘 2 → $g(E)=\dfrac{L^2m}{\pi\hbar^2}$,仍與 $E$ 無關(2D 特徵)。對照 3D:$N\propto k^3\propto E^{3/2}$ → $g\propto E^{1/2}$(隨 $E$ 增);1D:$g\propto E^{-1/2}$(隨 $E$ 減)。2D 剛好夾在中間,常數。

**範例 D（TB 能帶極值,$s$ vs $p$)**:$E(k)=\varepsilon_0-\alpha-2\gamma\cos ka$。對 $k$ 微分找極值:

$$\frac{dE}{dk}=2\gamma a\sin ka=0\ \Rightarrow\ ka=0,\ \pm\pi.$$

$s$ 軌道 hopping $\gamma>0$:$\cos ka$ 最小($=-1$,即 $ka=\pm\pi$)時 $E$ **最大** → 帶頂在 $k=\pm\pi/a$(BZ 邊界);帶底在 $k=0$。帶寬 $=E_{\max}-E_{\min}=4\gamma$。若 $p$ 軌道使有效 $\gamma<0$,則上下顛倒,帶頂落在 $k=0$。
</details>

## ✅ 自我檢核 / 🔀 變化
(b)(c) 同源 ✓;(c) 兩自旋 $\times2$、3D 改 $g\propto E^{1/2}$;(d) $p$ 軌道則最高在 $k=0$。

<script>
function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>

<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
