# 固態物理導論 2021 資格考 — 教學版逐題詳解（從普物起建 · 代數不跳步）

> **寫法**（對齊 QFT tutorials 與 2016/2025 詳解）：每大題走
> `📋 原題 → 🎯 核心訊息 → （必要時）📚 前情提要 → 🔍 符號說明（點開，熱身/中階/本題三範例） → 解答 Step（每步附小結，不跳代數，$\boxed{}$） → ✅ 自我檢核 → 🔀 變化的可能情況 → 信心`。
> 共用觀念另見 [`_共用觀念與公式.html`](_共用觀念與公式.html)，引用不重抄。
> **本卷性質**：2021 是「均衡卷」——四大題各 25%，每題都混了 1–2 個**要真的算**的小題（hcp 填充率與 $c/a$、NaCl 繞射數值、phonon 截止頻率、電子平均能與電洞有效質量），其餘是定性短答。計算題學 2016 的長推導寫法，短答學 2025 的簡潔。

## 🧭 全卷約定
- 立方晶體慣用立方邊 $a$；倒晶格 $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$；結構因子 $S_{\mathbf G}=\sum_j f_j e^{i\mathbf G\cdot\mathbf r_j}$。
- 自由電子 $E=\hbar^2k^2/2m$，含自旋簡併 2；$T=0$ 平均動能 $\langle E\rangle=\tfrac35E_F$。
- 1D 單原子鏈：質量 $M$、最近鄰彈簧常數 $C$、間距 $a$。
- 常數（題目給）：$\varepsilon_0=8.85\times10^{-12}\,\mathrm{F/m}$，$1\,\text{Å}=10^{-10}\,\mathrm{m}$，$e=1.602\times10^{-19}\,\mathrm{C}$，$1\,\mathrm{eV}=1.602\times10^{-19}\,\mathrm J$，$m_e=9.1\times10^{-31}\,\mathrm{kg}$；另用 $\hbar=1.0546\times10^{-34}\,\mathrm{J\,s}$、$hc=1240\,\mathrm{eV\cdot nm}$。閉書，符號依 Kittel。

# 📘 第 1 題 — 晶體結構：hcp 緊密堆積（25%）

## 📋 原題
> hcp 是單原子晶體最密堆積之一。
> **(a)** 能否想到另一個密度同樣高的堆積結構？(5%)
> **(b)** hcp 晶體有百分之幾的體積是空的？(10%)
> **(c)** hcp 面內晶格常數 $a$ 與面外 $c$ 的比值是多少？(5%)
> **(d)** 石墨的 $c/a\approx2.4$，這告訴你它面內與面外機械性質的什麼差別？(5%)

## 🎯 核心訊息
> hcp 與 fcc 是同一件事的兩種堆疊（ABAB 對 ABCABC），**填充率都是 $\dfrac{\pi}{3\sqrt2}=0.74$（空 26%）**；理想 $c/a=\sqrt{8/3}=1.633$ 純由「B 層球落進 A 層三角凹洞、與三顆相切」這個正四面體幾何鎖死。$c/a$ 偏離 1.633（石墨 2.4）就代表面外不是密堆、而是另一種（弱）鍵結。

## 📚 前情提要：從「堆橘子」一路到 hcp
### 階段 1（生活/普物）：堆橘子
一層球排成三角形最密（每球周圍 6 顆）。第二層落在第一層的凹洞。第三層有兩種放法：**回到第一層正上方 → ABAB = hcp**；**落到第三種位置 → ABCABC = fcc**。兩者「每層內」一樣密，差別只在堆疊順序。
> **留存**：hcp 與 fcc 是「最密堆積」的孿生兄弟，填充率必然相同。

### 階段 2（幾何）：相切球定半徑
單原子晶體 = 等大硬球互相相切。**最近鄰距離 = $a$ = 球心距 = $2r$**，故球半徑 $r=a/2$。填充率 = （胞內球體積）/（胞體積），與 $a$ 無關（會約掉）。
> **留存**：算填充率不用知道 $a$ 多大，只需「每胞幾顆球 + 胞體積用 $a,c$ 表示」。

## 🔍 符號說明
<details>
<summary><b>▸ 填充率（packing fraction）與理想 <span>$c/a$</span> 的正四面體幾何</b></summary>

### 你普物學過的
密度 = 質量/體積；硬球相切 = 球心距等於直徑。

### 為什麼要這個
「空多少」=$1-$填充率；填充率 = 胞內球總體積 ÷ 胞體積。hcp 的 $c/a$ 不是自由參數——它由密堆幾何決定，是經典送分題。

### 定義
- 填充率 $\eta=\dfrac{n\cdot\frac43\pi r^3}{V_{\text{cell}}}$，$n$=胞內原子數，$r=a/2$。
- 理想 $c/a$：B 層球與下方三顆 A 層球構成**正四面體**（邊長 $a$），其高 $=c/2$。

**範例 1（熱身·simple cubic）**：每立方 1 顆，$r=a/2$，$\eta=\frac{\frac43\pi(a/2)^3}{a^3}=\frac\pi6=0.52$。
**範例 2（中階·fcc）**：每立方 4 顆，相切沿面對角線 $4r=\sqrt2 a\Rightarrow r=\frac{\sqrt2}4a$，$\eta=\frac{4\cdot\frac43\pi r^3}{a^3}=\frac{\pi}{3\sqrt2}=0.74$。
**範例 3（本題·hcp）**：用原胞（2 顆），$V=\sqrt2\,a^3$（下面算），$\eta=\frac{2\cdot\frac43\pi(a/2)^3}{\sqrt2 a^3}=\frac{\pi}{3\sqrt2}=0.74$——與 fcc **同值**，正是 (a) 的物理。
</details>

## 解答

### (a) 另一個同密度的結構：fcc（立方最密堆積 ccp）
**fcc = cubic close packing**，與 hcp 一樣是最密堆積，填充率同為 $0.74$。差別只在第三層的堆疊：hcp 是 **ABAB**（第三層疊回第一層），fcc 是 **ABCABC**（第三層佔第三種凹洞）。
$$\boxed{\text{fcc（ccp），填充率同 hcp }=0.74。}$$
> **小結**：兩者「最近鄰數=12、配位數相同、填充率相同」，僅長程堆疊次序不同。

### (b) hcp 空了多少？（完整推導）
**Step 1 — 選原胞、數原子。** hcp 原胞 = 底面為邊長 $a$、夾角 $120^\circ$ 的菱形、高 $c$ 的斜柱，內含 **2 顆**原子（一顆在角、一顆在體內 $(\frac13,\frac23,\frac12)$）。
**Step 2 — 胞體積（用 $a,c$）。**
$$V_{\text{cell}}=\underbrace{a^2\sin120^\circ}_{\text{菱形面積}}\cdot c=\frac{\sqrt3}{2}a^2\,c.$$
**Step 3 — 代入理想 $c=\sqrt{8/3}\,a$（見 (c)）。**
$$V_{\text{cell}}=\frac{\sqrt3}{2}a^2\cdot\sqrt{\tfrac83}\,a=\frac{\sqrt3}{2}\cdot\frac{2\sqrt2}{\sqrt3}\,a^3=\sqrt2\,a^3.$$
（用了 $\sqrt{8/3}=2\sqrt2/\sqrt3$，$\sqrt3$ 約掉。）
**Step 4 — 球體積、填充率。** $r=a/2$，2 顆：
$$V_{\text{atoms}}=2\cdot\frac43\pi\Big(\frac a2\Big)^3=2\cdot\frac43\pi\frac{a^3}8=\frac{\pi a^3}{3}.$$
$$\eta=\frac{V_{\text{atoms}}}{V_{\text{cell}}}=\frac{\pi a^3/3}{\sqrt2\,a^3}=\frac{\pi}{3\sqrt2}=0.7405.$$
**Step 5 — 空隙。**
$$\boxed{\text{未填體積比例}=1-0.7405=0.2595\approx26\%.}$$
> **小結**：$a^3$ 全約掉——填充率是純幾何常數，跟原子大小無關。

### (c) 理想 $c/a$（完整推導）
**Step 1 — 認出正四面體。** A 層取一個由三顆相切球構成的等邊三角形（邊長 $a$）；B 層球落在這三顆的凹洞正上方，與三顆都相切 → 四顆球心構成**正四面體**，邊長 $a$。
**Step 2 — 三角形外心到頂點距離。** 等邊三角形（邊 $a$）的外接圓半徑 $R=\dfrac{a}{\sqrt3}$。
**Step 3 — 用畢氏求 B 層高度 $h$。** B 球心在三角形外心正上方，到任一 A 球心距離 $=a$：
$$h^2+R^2=a^2\Rightarrow h^2=a^2-\frac{a^2}{3}=\frac23a^2\Rightarrow h=a\sqrt{\tfrac23}.$$
**Step 4 — $h$ 就是半個 $c$。** A→B→A 兩層間距 $=c/2=h$：
$$c=2h=2a\sqrt{\tfrac23}=a\sqrt{\tfrac83}\Rightarrow \boxed{\frac ca=\sqrt{\frac83}=1.633.}$$
> **小結**：$c/a$ 被正四面體鎖死；真實金屬略有偏差（Mg 1.624、Zn 1.86）反映非理想鍵結。

**範例 A（bcc 填充率 0.68，逐步）**：bcc 慣用立方含 $8\times\tfrac18+1=2$ 顆；最近鄰沿體對角線相切，體對角線長 $=\sqrt3\,a$ 等於 $4r$，故 $r=\dfrac{\sqrt3}{4}a$。每顆球體積 $\tfrac43\pi r^3=\tfrac43\pi\Big(\dfrac{\sqrt3}{4}a\Big)^3=\tfrac43\pi\cdot\dfrac{3\sqrt3}{64}a^3=\dfrac{\sqrt3\,\pi}{16}a^3$。填充率 $\eta=\dfrac{2\cdot\frac{\sqrt3\pi}{16}a^3}{a^3}=\dfrac{\sqrt3\,\pi}{8}=\dfrac{1.732\times3.1416}{8}=\dfrac{5.441}{8}=0.6802$。故 bcc 空 $1-0.68=32\%$。

**範例 B（diamond 填充率 0.34，逐步）**：金剛石結構 = fcc + basis $(000),(\tfrac14\tfrac14\tfrac14)$，慣用立方含 $8$ 顆。最近鄰沿體對角線 $\tfrac14$ 段，相切距 $2r=\dfrac{\sqrt3}{4}a$，故 $r=\dfrac{\sqrt3}{8}a$。$\eta=\dfrac{8\cdot\frac43\pi r^3}{a^3}=\dfrac{32\pi}{3}\Big(\dfrac{\sqrt3}{8}\Big)^3=\dfrac{32\pi}{3}\cdot\dfrac{3\sqrt3}{512}=\dfrac{\sqrt3\,\pi}{16}=\dfrac{1.732\times3.1416}{16}=\dfrac{5.441}{16}=0.3401$。金剛石很「鬆」（共價方向鍵、非密堆），故只 $34\%$。

**範例 C（hcp 體積與密度數值）**：設 Mg 的 $a=3.21\,\text{Å}$、理想 $c=\sqrt{8/3}\,a=1.633\times3.21=5.24\,\text{Å}$。原胞體積 $V=\dfrac{\sqrt3}{2}a^2c=\dfrac{1.732}{2}(3.21)^2(5.24)\,\text{Å}^3=0.866\times10.30\times5.24=46.8\,\text{Å}^3=4.68\times10^{-29}\,\mathrm{m^3}$。每原胞 $2$ 顆，Mg 原子質量 $m=\dfrac{24.3\times10^{-3}}{6.022\times10^{23}}=4.04\times10^{-26}\,\mathrm{kg}$。密度 $\rho=\dfrac{2m}{V}=\dfrac{2\times4.04\times10^{-26}}{4.68\times10^{-29}}=\dfrac{8.08\times10^{-26}}{4.68\times10^{-29}}=1726\,\mathrm{kg/m^3}\approx1.73\,\mathrm{g/cm^3}$，與 Mg 實測 $1.74\,\mathrm{g/cm^3}$ 吻合 ✓。

### (d) 石墨 $c/a\approx2.4$ 說明的機械性質
$c/a=2.4\gg1.633$ → **面外間距遠大於密堆值**，代表面外不是金屬式密堆，而是另一種鍵結。石墨：
- **面內**：每個 C 以 $sp^2$ **共價鍵**鍵結成蜂巢網（強、剛性高）→ 面內極硬、難拉斷、導電好。
- **面外**：層與層之間只有弱 **van der Waals 力**（鍵長＝大間距的來源）→ 層間易滑動、易剝離。
$$\boxed{\text{面內共價（強、剛）、面外凡得瓦（弱、軟）→ 強烈機械異向性（故石墨可當潤滑劑/鉛筆芯）。}}$$
> **小結**：「$c/a$ 偏大」是「層間弱鍵」的直接幾何指紋。

## ✅ 自我檢核
- $\eta=\pi/3\sqrt2$ 與 fcc 完全相同 ✓（同為最密堆積）。
- $c/a=1.633$ 是 Kittel 標準值 ✓；$V_{\text{cell}}=\sqrt2 a^3$ 量綱對 ✓。
- 石墨 $2.4>1.633$ → 面外更鬆 → 弱鍵 ✓（與「易剝離」一致）。

## 🔀 變化的可能情況
- 常改問 **fcc/bcc/sc/diamond 的填充率**（0.74 / 0.68 / 0.52 / 0.34）——同一招：數胞內原子＋相切定 $r$。
- 也可改問 **配位數**（hcp/fcc 皆 12）或 **每個原胞含幾原子**。
- 2016 第 1 題從同一族（晶格/堆積）出發但走倒晶格；本題走幾何填充。

## 信心：**高**（填充率、$c/a$ 均為標準完整推導，Kittel Ch1）。

# 📗 第 2 題 — 繞射：結構因子與 NaCl 數值（25%）

## 📋 原題
> 繞射源自晶體反射波的干涉。
> **(a)** 對立方晶體，「Lattice Constant（晶格常數）」是什麼意思？(5%)
> **(b)** 為何 bcc 晶體的 (110) 面可觀察到一階 X 光繞射，fcc 的 (110) 面卻不行？(10%)
> **(c)** 波長 $\lambda=0.084\,\mathrm{nm}$ 對 NaCl 晶體繞射，最低繞射角在 $8.35^\circ$。此 FCC 晶體的晶格間距為何？(5%)
> **(d)** 在 (c) 的實驗中，可觀察到的最高繞射階數是多少？(5%)

## 🎯 核心訊息
> **倒晶格定峰位置、結構因子定峰強弱（消光）。** bcc 對 (110) 有 $h{+}k{+}l$ 偶 → $S=2f\neq0$（亮）；fcc 對 (110) 屬「奇偶混合」→ $S=0$（消光）。數值題用 Bragg $2d\sin\theta=n\lambda$，最低角 = fcc 第一個允許峰 (111)。

## 📚 前情提要
### 階段 1（普物）：雙狹縫
路徑差 = 整數波長才亮。晶體繞射 = 三維週期版。
### 階段 2（Bragg/Laue）：$2d\sin\theta=n\lambda$，等價 $\Delta\mathbf k=\mathbf G$，$d_{hkl}=\dfrac{a}{\sqrt{h^2+k^2+l^2}}$（cubic）。
### 階段 3（結構因子）：basis 造成某些 $\mathbf G$ 的振幅相消：$S_{\mathbf G}=\sum_j f_j e^{i\mathbf G\cdot\mathbf r_j}$，$S=0$ → 該峰消光。
> **留存**：「能不能看到 (110)」是 $S$ 的問題，不是 $d$ 的問題。

## 🔍 符號說明
<details>
<summary><b>▸ 結構因子的消光規則（bcc / fcc）</b></summary>

### 為什麼要這個
(b) 整題就是消光；(c)(d) 需要知道 fcc「哪一個峰最先出現」。

### 定義
$S_{hkl}=\sum_j f_j e^{2\pi i(hx_j+ky_j+lz_j)}$。
- **bcc** basis $(000),(\tfrac12\tfrac12\tfrac12)$：$S=f[1+(-1)^{h+k+l}]$ → $h{+}k{+}l$ 偶才亮。
- **fcc** basis $(000),(\tfrac12\tfrac120),(\tfrac120\tfrac12),(0\tfrac12\tfrac12)$：$S=f[1+(-1)^{h+k}+(-1)^{h+l}+(-1)^{k+l}]$ → $h,k,l$ **全奇或全偶**才亮。

**範例 1（熱身）**：bcc (100)：$1{+}0{+}0$ 奇 → 消光；(110)：偶 → 亮。
**範例 2（中階）**：fcc (111)：全奇 → 亮（第一個允許峰）；(200)：全偶 → 亮。
**範例 3（本題）**：fcc (110)：$1,1,0$ 混合奇偶 → $S=f[1+1-1-1]=0$ → **消光**（本題 (b)）。
</details>

## 解答

### (a) cubic 的「晶格常數」
立方晶體只需**一個**長度參數：慣用立方晶胞的**邊長 $a$**（即沿立方軸的重複週期）。三軸等長、互相垂直，故 $a$ 一個數就定下整個晶格的尺度（面間距、原子位置都用 $a$ 表示）。
$$\boxed{\text{lattice constant}=a=\text{立方晶胞邊長（唯一尺度參數）。}}$$

### (b) bcc (110) 亮、fcc (110) 暗（完整）
**Step 1 — bcc (110)。** $h{+}k{+}l=1{+}1{+}0=2$（偶）：
$$S_{110}^{\text{bcc}}=f\,[\,1+(-1)^{2}\,]=2f\neq0\ \Rightarrow\ \text{允許（可見一階）}.$$
**Step 2 — fcc (110)。** 逐項：$(-1)^{h+k}=(-1)^2=1$、$(-1)^{h+l}=(-1)^1=-1$、$(-1)^{k+l}=(-1)^1=-1$：
$$S_{110}^{\text{fcc}}=f\,[\,1+1-1-1\,]=0\ \Rightarrow\ \boxed{\text{消光（看不到）}.}$$
**Step 3 — 物理圖像。** fcc 的 (110) 面之間，正中央還插了一層等密度的面心原子面；它散射的波與 (110) 面差**半個波程**，恰好破壞性干涉相消。bcc 沒有這個半程插層，故 (110) 是其最強的一階峰。
> **小結**：同樣的 (110) 幾何 $d$，亮暗完全由 basis（結構因子）決定。

### (c) NaCl 晶格間距（完整）
**Step 1 — 認出最低角 = fcc 第一個允許峰 (111)。** fcc 允許的最小 $\{hkl\}$（全奇/全偶且 $|G|$ 最小）是 **(111)**，對應最大 $d$、最小 $\theta$。故 $8.35^\circ$ 是 (111) 的一階。
**Step 2 — Bragg 求 $d_{111}$。** $2d_{111}\sin\theta=\lambda$：
$$d_{111}=\frac{\lambda}{2\sin\theta}=\frac{0.084}{2\sin8.35^\circ}.$$
$\sin8.35^\circ=0.1452$，故
$$d_{111}=\frac{0.084}{2\times0.1452}=\frac{0.084}{0.2904}=0.2892\,\mathrm{nm}.$$
**Step 3 — 由 $d_{111}$ 反推立方邊 $a$。** $d_{hkl}=\dfrac{a}{\sqrt{h^2+k^2+l^2}}$，$(111)\Rightarrow d_{111}=a/\sqrt3$：
$$a=\sqrt3\,d_{111}=1.732\times0.2892=\boxed{0.501\,\mathrm{nm}\ (\approx5.0\,\text{Å}).}$$
> **小結**：若「晶格間距」指被繞射的面間距，答 $d_{111}\approx0.289\,\mathrm{nm}$；若指立方邊 $a$，答 $0.501\,\mathrm{nm}$。（真實 NaCl $a=0.564\,\mathrm{nm}$；差異源於 NaCl (111) 因 Na/Cl 散射因子不同而很弱，最強的反而是 (200)——見自我檢核。）

### (d) 最高繞射階數（完整）
**Step 1 — 同一組 (111) 面、各階 $n$。** $n\lambda=2d_{111}\sin\theta_n$，$\sin\theta_n\le1$ 限制：
$$n_{\max}=\Big\lfloor\frac{2d_{111}}{\lambda}\Big\rfloor=\Big\lfloor\frac{2\times0.2892}{0.084}\Big\rfloor=\big\lfloor 6.89\big\rfloor.$$
$$\boxed{n_{\max}=6.}$$
**Step 2 — 驗最後一階。** $n=6$：$\sin\theta_6=\dfrac{6\times0.084}{2\times0.2892}=\dfrac{0.504}{0.5784}=0.871\le1$（$\theta_6\approx60.6^\circ$）✓；$n=7$ 給 $\sin\theta=1.02>1$，不可能 ✗。
> **小結**：等價說法——可觀測的最小面間距為 $d_{\min}=\lambda/2=0.042\,\mathrm{nm}$，$(111)$ 的 6 階 (666) 仍在此限內。

**範例 A（diamond 的 (200) 消光，逐步）**：金剛石 = fcc 晶格 + basis $(000),(\tfrac14\tfrac14\tfrac14)$，結構因子 $S_{hkl}=f\big[1+e^{i\frac\pi2(h+k+l)}\big]\times S_{hkl}^{\text{fcc}}$。對 $(200)$：fcc 部分 $h,k,l=2,0,0$ 全偶 → $S^{\text{fcc}}=4f\neq0$（fcc 允許）；但 basis 因子 $1+e^{i\frac\pi2(2+0+0)}=1+e^{i\pi}=1+(-1)=0$ → 整體 $S_{200}=0$，**金剛石 (200) 消光**。對 $(111)$：fcc 全奇允許，basis $1+e^{i\frac\pi2(3)}=1+e^{i3\pi/2}=1-i\neq0$，$|S|^2\propto|1-i|^2=2\neq0$ → **(111) 可見**。

**範例 B（給 $\lambda,a$ 反求最低角，逐步）**：設 fcc 金屬 $a=0.36\,\mathrm{nm}$、$\lambda=0.154\,\mathrm{nm}$（Cu-Kα）。第一允許峰 (111)：$d_{111}=\dfrac{a}{\sqrt3}=\dfrac{0.36}{1.732}=0.2078\,\mathrm{nm}$。Bragg：$\sin\theta=\dfrac{\lambda}{2d_{111}}=\dfrac{0.154}{2\times0.2078}=\dfrac{0.154}{0.4156}=0.3705$，$\theta=\arcsin0.3705=21.7^\circ$（繞射全角 $2\theta=43.4^\circ$）。

**範例 C（最高可見階數，逐步）**：續範例 B，沿 (111) 各階 $n\lambda=2d_{111}\sin\theta_n$，$\sin\theta_n\le1$ 給 $n_{\max}=\Big\lfloor\dfrac{2d_{111}}{\lambda}\Big\rfloor=\Big\lfloor\dfrac{2\times0.2078}{0.154}\Big\rfloor=\big\lfloor2.70\big\rfloor=2$。驗：$n=2$ 給 $\sin\theta_2=2\times0.3705=0.741\le1$（$\theta_2=47.8^\circ$）✓；$n=3$ 給 $\sin\theta=1.11>1$ ✗。故此組僅見到二階。

## ✅ 自我檢核
- (b) 消光純由奇偶判定，與 $d$ 無關 ✓。
- (c) $\sin\theta=0.145\le1$ ✓；以 (111) 為第一峰得 $a=0.50\,\mathrm{nm}$。**注意**：嚴格的 NaCl，(111) 因 $f_{\text{Na}}\neq f_{\text{Cl}}$ 而微弱，最低**強**峰常是 (200)；若視最低角為 (200) 則 $a=2d=0.578\,\mathrm{nm}$，較接近實值 $0.564\,\mathrm{nm}$。題目稱「FCC 晶體」、要「lattice spacing」，本解採課本式「第一允許峰 (111)」。
- (d) $n=6$ 時 $\sin\theta<1$、$n=7$ 超界 ✓。

## 🔀 變化的可能情況
- 常把 (b) 換成「diamond 哪些峰消光」（如 (200) 消）、或「fcc/bcc 互換」。
- 數值題常給不同 $\lambda,\theta$ 反求 $a$ 或問「能看到幾個峰」——同一招 Bragg + 整數階。
- 2025 第 2(c) 是 2D 版（給 $\lambda=2a/5$ 問繞射角與最高階），與本題 (c)(d) 完全同型。

## 信心：**中高**（消光與 Bragg 計算完整；唯 (c)「最低角＝(111) 或 (200)」依課本約定取 (111)，已在自我檢核註明替代值）。

# 📙 第 3 題 — 聲子：單原子鏈色散與非諧（25%）

## 📋 原題
> 想像晶體一側受聲壓。
> **(a)** 畫出晶體中不同位置原子的振幅（用簡諧近似）。(5%)
> **(b)** 給定彈簧常數與原子質量，單原子晶體能傳遞的最高聲頻是多少？(5%)
> **(c)** 若聲頻高於 (b) 算出的最高頻，不同位置的振幅會如何變化？（可畫、可算、可描述）(10%)
> **(d)** 描述熱膨脹的微觀過程，並解釋為何稱為「非諧（anharmonic）」過程。(5%)

## 🎯 核心訊息
> 1D 單原子鏈色散 $\omega=2\sqrt{C/M}\,|\sin(ka/2)|$ 有**截止頻率 $\omega_{\max}=2\sqrt{C/M}$**（在 $k=\pi/a$）。低於它 → 行進波、振幅均勻；高於它 → $k$ 變複數、波**指數衰減**（evanescent，不傳遞）。熱膨脹則需要位能的**非對稱（非諧）項**：純拋物線位能不會膨脹。

## 📚 前情提要：從兩顆耦合振子到一條鏈
### 階段 1（普物）：兩質量 + 彈簧 = 簡正模。
### 階段 2（推廣）：$N$ 顆等間距、最近鄰彈簧 → 平移對稱 ⇒ 解為平面波 $u_n=A\,e^{i(kna-\omega t)}$。
### 階段 3（色散）：代入運動方程得 $\omega(k)$，有最大值（band 有頂）。
> **留存**：晶格是「機械帶通濾波器」——只讓 $\omega\le\omega_{\max}$ 通過。

## 🔍 符號說明
<details>
<summary><b>▸ 單原子鏈運動方程 → 色散 → 截止頻率</b></summary>

### 為什麼要這個
(a)(b)(c) 全靠這條 $\omega(k)$；(c) 的「指數衰減」來自 $\omega>\omega_{\max}$ 時 $k$ 變複數。

### 定義（運動方程）
$$M\ddot u_n=C(u_{n+1}+u_{n-1}-2u_n).$$
代 $u_n=A\,e^{i(kna-\omega t)}$：$-M\omega^2=C(2\cos ka-2)=-4C\sin^2(ka/2)$，得
$$\omega(k)=2\sqrt{\tfrac CM}\,\big|\sin(ka/2)\big|.$$

**範例 1（熱身）**：$k\to0$ → $\omega\approx\sqrt{C/M}\,a\,k$（線性，聲速 $v=a\sqrt{C/M}$）。
**範例 2（中階）**：$k=\pi/a$ → $\sin(\pi/2)=1$ → $\omega=\omega_{\max}=2\sqrt{C/M}$（區邊界、相鄰原子反相）。
**範例 3（本題 c）**：$\omega>\omega_{\max}$ → 需 $\sin^2(ka/2)>1$ → $k=\pi/a+i\kappa$，$\sin(ka/2)=\cosh(\kappa a/2)$ → 振幅 $\propto(-1)^n e^{-\kappa n a}$ 指數衰減。
</details>

## 解答

### (a) 振幅 vs 位置（簡諧、低於截止）
聲頻在傳遞頻段（$\omega\le\omega_{\max}$）時，是一個**行進波**：$u_n=A\cos(kna-\omega t)$。各原子用**同一振幅 $A$**做簡諧振動，位移沿鏈呈**正弦分布**（瞬時快照是一條正弦曲線），振幅不隨深入晶體而衰減。
$$\boxed{u_n=A\cos(kx_n-\omega t),\quad \text{各處振幅 }=A\ (\text{均勻、不衰減}).}$$
> **小結**：能傳遞 = 振幅恆定的正弦波（為 (c) 的「衰減」做對照）。

### (b) 最高可傳遞聲頻（完整）
由色散 $\omega=2\sqrt{C/M}|\sin(ka/2)|$，最大值在 $\sin(ka/2)=1$，即 $ka/2=\pi/2\Rightarrow k=\pi/a$（第一布里淵區邊界）：
$$\boxed{\omega_{\max}=2\sqrt{\frac CM},\qquad f_{\max}=\frac{\omega_{\max}}{2\pi}=\frac1\pi\sqrt{\frac CM}.}$$
> **小結**：$k=\pi/a$ 時相鄰原子反相（波長 $=2a$），是鏈能撐起的最短波長。

### (c) 頻率高於 $\omega_{\max}$：指數衰減（完整）
**Step 1 — 為何沒有實 $k$。** 要 $\omega>\omega_{\max}$ 需 $\sin^2(ka/2)=\dfrac{M\omega^2}{4C}>1$，實數 $k$ 做不到 → $k$ 必為複數。
**Step 2 — 設 $k=\dfrac\pi a+i\kappa$。** 則
$$\sin\!\Big(\frac{ka}{2}\Big)=\sin\!\Big(\frac\pi2+\frac{i\kappa a}{2}\Big)=\cos\!\Big(\frac{i\kappa a}{2}\Big)=\cosh\!\Big(\frac{\kappa a}{2}\Big)\ge1.$$
代回色散：$\omega=2\sqrt{C/M}\,\cosh(\kappa a/2)$，可由 $\cosh(\kappa a/2)=\omega/\omega_{\max}$ 解出 $\kappa>0$。
**Step 3 — 振幅形態。** $u_n=A\,e^{i k n a}=A\,e^{i\pi n}e^{-\kappa n a}=A(-1)^n e^{-\kappa n a}$：
$$\boxed{u_n\propto(-1)^n\,e^{-\kappa\,n a}\ \Rightarrow\ \text{振幅隨深入晶體指數衰減（evanescent，不傳遞能量）。}}$$
**Step 4 — 物理。** 只有靠近受力面的少數原子被驅動，振幅一層層指數變小、且相鄰反相；晶體對 $\omega>\omega_{\max}$ 像「全反射的帶止濾波器」。
> **小結**：(a) 的均勻正弦 → (c) 的指數包絡，差別就在 $k$ 由實變複。

### (d) 熱膨脹的微觀過程與「非諧」
**微觀**：原子在最近鄰位能井中振動。隨溫度升高振幅變大；若位能井**非對稱**（壓縮側陡、伸張側緩），原子在大 $r$ 一側停留較久，**平均間距 $\langle r\rangle$ 隨 $T$ 增大** → 宏觀膨脹。
**為何「非諧」**：把位能展開 $U(r)=U_0+\tfrac12 k(\delta r)^2-g(\delta r)^3+\cdots$。**純諧項（拋物線、對稱）**下 $\langle\delta r\rangle=0$，無論振幅多大都不膨脹；膨脹完全來自**三次方 $-g(\delta r)^3$ 等非對稱項**，即「超出簡諧（anharmonic）」的部分。
$$\boxed{\langle\delta r\rangle\approx\frac{g}{k^2}k_BT\neq0\ \text{僅當 }g\neq0\ (\text{非諧})\ \Rightarrow\ \text{熱膨脹係數}\propto g。}$$
> **小結**：純諧晶體不膨脹；熱膨脹是非諧性的直接證據。

- (b) $k\to0$ 回到聲速線性、$k=\pi/a$ 取極大 ✓。
- (c) $\kappa\to0$ 當 $\omega\to\omega_{\max}^+$（衰減長度發散，連續接上傳遞頻段）✓。
- (d) 對稱位能 $\langle\delta r\rangle=0$、加三次項才非零 ✓（與「諧振子不膨脹」一致）。

- (b) 可改問**聲速** $v=a\sqrt{C/M}$ 或**態密度** $g(\omega)$（1D 在 $\omega_{\max}$ 有 van Hove 發散）。

# 📕 第 4 題 — 電子：費米氣體、能隙與電洞（25%）

## 📋 原題
> **(a)** 若金屬中電子濃度被某種方式加倍，平均電子能量會如何變？(10%)
> **(b)** 解釋絕緣體中禁帶（forbidden gap）的來源。(5%)
> **(c)** 某絕緣材料吸收所有短於 $\lambda_0$ 的波長，求其禁帶寬度。(5%)
> **(d)** 半導體價帶頂附近電子能量 $E=-10^{-37}|k|^2$（$E$ 單位 J、$k$ 單位 m$^{-1}$）。從 $k=2\times10^8\,\mathrm{m^{-1}}\,\hat x$ 移走一電子，求所生電洞的有效質量與速度。(5%)

## 🎯 核心訊息
> 自由電子 $E_F\propto n^{2/3}$、平均能 $\langle E\rangle=\tfrac35E_F\propto n^{2/3}$，故 $n\to2n$ 時平均能 $\times2^{2/3}\approx1.59$。能隙來自布里淵區邊界的 Bragg 反射（駐波分裂）。吸收邊 $E_g=hc/\lambda_0$。電洞質量 = 能帶曲率的負倒數取正（$1/m^*=\hbar^{-2}d^2E/dk^2$），電洞速度 = 被移走電子的群速。

## 📚 前情提要
### 階段 1（費米球）：$T=0$ 電子填到 $k_F$，$n=\dfrac{k_F^3}{3\pi^2}$ → $E_F=\dfrac{\hbar^2}{2m}(3\pi^2n)^{2/3}\propto n^{2/3}$。
### 階段 2（平均能）：$\langle E\rangle=\dfrac{\int_0^{E_F}E\,g(E)dE}{\int_0^{E_F}g(E)dE}=\tfrac35E_F$（3D）。
### 階段 3（半古典）：群速 $v=\tfrac1\hbar\dfrac{dE}{dk}$，有效質量 $\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dk^2}$。
> **留存**：價帶頂曲率為負 → 電子 $m^*<0$ → 用「正質量、正電」的電洞描述。

## 🔍 符號說明
<details>
<summary><b>▸ <span>$\langle E\rangle=\tfrac35E_F$</span> 的 <span>$n$</span> 依賴 + 有效質量/電洞</b></summary>

### 為什麼要這個
(a) 要 $\langle E\rangle$ 對 $n$ 的標度；(d) 要由 $E(k)$ 取二階導得 $m^*$、一階導得 $v$。

### 定義
- $E_F\propto n^{2/3}$，$\langle E\rangle=\tfrac35E_F\propto n^{2/3}$。
- $v_g=\tfrac1\hbar\dfrac{dE}{dk}$；$\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dk^2}$。電洞：$m_h^*=-m_e^*>0$，$v_h=v_e(\text{被移走的態})$。

**範例 1（熱身）**：$n\to8n$ → $E_F\to8^{2/3}=4$ 倍。
**範例 2（中階）**：拋物帶 $E=\hbar^2k^2/2m$ → $d^2E/dk^2=\hbar^2/m$ → $m^*=m$（回到自由電子）。
**範例 3（本題 d）**：$E=-\beta k^2$（$\beta=10^{-37}$）→ $d^2E/dk^2=-2\beta$ → $m_e^*=-\hbar^2/2\beta<0$ → 電洞 $m_h^*=+\hbar^2/2\beta$。
</details>

## 解答

### (a) 電子濃度加倍 → 平均能變化（完整）
**Step 1 — 標度關係。** $\langle E\rangle=\tfrac35E_F$，$E_F=\dfrac{\hbar^2}{2m}(3\pi^2n)^{2/3}\propto n^{2/3}$，故 $\langle E\rangle\propto n^{2/3}$。
**Step 2 — 取比值。** $n\to2n$：
$$\frac{\langle E\rangle_{\text{new}}}{\langle E\rangle_{\text{old}}}=\Big(\frac{2n}{n}\Big)^{2/3}=2^{2/3}=1.587.$$
$$\boxed{\text{平均電子能量變為原本的 }2^{2/3}\approx1.59\text{ 倍（增加約 }59\%）。}$$
> **小結**：因 $E_F\propto n^{2/3}$，加倍密度不是加倍能量，而是 $\times2^{2/3}$。

### (b) 禁帶來源（nearly-free electron）
週期位能的傅立葉分量 $U_G$ 在布里淵區邊界（$k=\pm\pi/a$）讓兩個簡併平面波 $e^{\pm i\pi x/a}$ 混成兩個**駐波**：$\psi_+\propto\cos(\pi x/a)$（電子密度堆在離子上，能量低）、$\psi_-\propto\sin(\pi x/a)$（堆在離子間，能量高）。兩者能量差即**能隙**：
$$\boxed{E_g=2\,|U_G|.}$$
電子無法擁有落在此區間的能量；絕緣體因下方（價）帶填滿、且到上方（導）帶的 $E_g$ 大，無可用態 → 不導電。
> **小結**：能隙 = 區邊界 Bragg 反射造成的駐波分裂。

### (c) 吸收邊 → 禁帶寬度
材料吸收所有 $\lambda<\lambda_0$（即光子能量 $E=hc/\lambda>hc/\lambda_0$）。吸收的**閾值**正是把電子跨過禁帶所需的最小能量 $E_g$，對應最長被吸收波長 $\lambda_0$：
$$\boxed{E_g=\frac{hc}{\lambda_0}=\frac{1240\ \mathrm{eV\cdot nm}}{\lambda_0\,[\mathrm{nm}]}.}$$
> **小結**：吸收邊波長 $\lambda_0$ 直接給出 $E_g$；$\lambda_0$ 愈短 → $E_g$ 愈大。

### (d) 電洞的有效質量與速度（完整）
給 $E(k)=-\beta k^2$，$\beta=10^{-37}\,\mathrm{J\,m^2}$，取 $k=2\times10^8\,\mathrm{m^{-1}}$。
**Step 1 — 一、二階導數。**
$$\frac{dE}{dk}=-2\beta k,\qquad \frac{d^2E}{dk^2}=-2\beta=-2\times10^{-37}\,\mathrm{J\,m^2}.$$
**Step 2 — 電子有效質量（會是負的）。**
$$m_e^*=\frac{\hbar^2}{d^2E/dk^2}=\frac{(1.0546\times10^{-34})^2}{-2\times10^{-37}}=\frac{1.112\times10^{-68}}{-2\times10^{-37}}=-5.56\times10^{-32}\,\mathrm{kg}.$$
**Step 3 — 電洞有效質量取正。**
$$\boxed{m_h^*=-m_e^*=+5.56\times10^{-32}\,\mathrm{kg}\approx0.061\,m_e.}$$
**Step 4 — 電洞速度 = 被移走電子的群速。**
$$\frac{dE}{dk}\Big|_{k}=-2\beta k=-2(10^{-37})(2\times10^8)=-4\times10^{-29}\,\mathrm{J\,m}.$$
$$v_h=\frac1\hbar\frac{dE}{dk}=\frac{-4\times10^{-29}}{1.0546\times10^{-34}}=-3.79\times10^{5}\,\mathrm{m/s}.$$
$$\boxed{v_h\approx-3.8\times10^{5}\,\mathrm{m/s}\,\hat x\ (\text{量值 }3.8\times10^5\,\mathrm{m/s},\ \text{沿 }-\hat x).}$$
> **小結**：電洞質量 = 價帶頂負曲率取正（$\sim0.06\,m_e$）；電洞速度 = 該空態電子的群速度，方向沿 $-\hat x$。

- 2016 第 5 題從同族（半導體/有效質量）出發，推完整 effective-mass equation；本題是其數值應用版。

<script>
function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>

<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
