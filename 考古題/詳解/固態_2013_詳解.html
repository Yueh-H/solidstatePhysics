# 📘 第 1 題 — Bravais 晶格、bcc 原胞、fcc 參數、晶向⊥晶面（2+2+3+2+3+4+3 = 19 pts）

## 📋 原題
> Bravais lattice 是描述晶體週期排列的基本概念。
> (a) 什麼是 Bravais lattice?定義之。
> (b) 二維有幾種相異晶格?是哪些(畫出來)?
> (c) 三維有幾種相異晶格?是哪些(畫出來)?
> (d) 什麼是 primitive cell?
> (e) bcc 的 primitive cell 是哪一種 Bravais lattice?算出夾角與晶格常數。
> (f) 求 fcc 的:慣用胞體積、慣用胞含幾格點、原胞體積、原胞含幾格點、最近鄰數、最近鄰距離、堆積率。
> (g) 證明 cubic 中晶向 $[hkl]\perp$ 同指標晶面 $(hkl)$。相鄰面間距?

## 🎯 核心訊息
> 一條「實空間幾何」主線:**14 種 Bravais**(2D 是 5 種)→ **bcc 原胞 = 菱面體**(算出 $109.47°$)→ **fcc 數格點/鄰居/堆積**(0.74)→ **cubic 才有 $[hkl]\parallel\mathbf G\perp(hkl)$**。

## 解答

### (a) Bravais lattice 定義
**Bravais lattice** = 所有 $\mathbf R=n_1\mathbf a_1+n_2\mathbf a_2+n_3\mathbf a_3$($n_i\in\mathbb Z$)構成的無限點集,其中 $\mathbf a_i$ 為 primitive vectors。等價判準:**從任一格點看出去的方位與環境都完全相同**(平移不變)。例:simple cubic $\mathbf a_i=a\hat e_i$。

### (b) 二維 5 種
$$\boxed{\text{oblique(斜方)、square(正方)、rectangular(矩形 P)、centered rectangular(矩形 C/置心)、hexagonal(六方)}}$$
- oblique:$|\mathbf a_1|\ne|\mathbf a_2|$,夾角任意。
- square:$|\mathbf a_1|=|\mathbf a_2|$,$90°$。
- rectangular(P):$|\mathbf a_1|\ne|\mathbf a_2|$,$90°$。
- centered rectangular(C):矩形多一個面心點(它**不能**化簡成更小矩形,故獨立成一型)。
- hexagonal:$|\mathbf a_1|=|\mathbf a_2|$,$120°$。

### (c) 三維 14 種
**7 晶系 × 允許置心 = 14**:cubic(P, I, F)、tetragonal(P, I)、orthorhombic(P, C, I, F)、monoclinic(P, C)、triclinic(P)、trigonal/rhombohedral(R)、hexagonal(P)。(P 簡單、I 體心、F 面心、C 底心。)

### (d) primitive cell
含**恰 1 個格點**的最小重複體積胞,$V_{\text{prim}}=|\mathbf a_1\cdot(\mathbf a_2\times\mathbf a_3)|$,平移它可不重不漏鋪滿全空間。形狀可任選(平行六面體或 Wigner–Seitz 胞)。

### (e) bcc 的原胞 = 菱面體(rhombohedral),完整計算
**Step 1 — bcc primitive vectors(立方邊 $a$)。**
$$\mathbf a_1=\tfrac a2(-\hat x+\hat y+\hat z),\quad \mathbf a_2=\tfrac a2(\hat x-\hat y+\hat z),\quad \mathbf a_3=\tfrac a2(\hat x+\hat y-\hat z).$$
這三個向量由「立方角 → 體心」連線得到,各含 1 格點(原胞體積 $=a^3/2$,正是 bcc 每立方含 2 點)。

**Step 2 — 原胞晶格常數(邊長)。**
$$|\mathbf a_i|=\frac a2\sqrt{(-1)^2+1^2+1^2}=\frac a2\sqrt3=\boxed{\frac{\sqrt3}{2}\,a\approx0.866\,a.}$$

**Step 3 — 夾角。**
$$\mathbf a_1\cdot\mathbf a_2=\frac{a^2}{4}\big[(-1)(1)+(1)(-1)+(1)(1)\big]=\frac{a^2}{4}(-1)=-\frac{a^2}{4}.$$
$$\cos\theta=\frac{\mathbf a_1\cdot\mathbf a_2}{|\mathbf a_1||\mathbf a_2|}=\frac{-a^2/4}{3a^2/4}=-\frac13\ \Rightarrow\ \boxed{\theta=\arccos\!\big(-\tfrac13\big)\approx109.47°.}$$
> **小結**:bcc 原胞是「三邊等長 $\tfrac{\sqrt3}2a$、三夾角皆 $109.47°$」的**菱面體**,屬 **trigonal/rhombohedral** Bravais lattice。(這個 $109.47°$ 正是四面體鍵角,非巧合——四個體對角線方向。)

### (f) fcc 七項參數
| 量 | 值 | 說明 |
|---|---|---|
| 慣用胞體積 | $a^3$ | 立方 |
| 慣用胞格點數 | $4$ | $8\times\tfrac18+6\times\tfrac12=1+3$ |
| 原胞體積 | $a^3/4$ | $V_{\text{conv}}/4$ |
| 原胞格點數 | $1$ | primitive 定義 |
| 最近鄰數 | $12$ | 面心配位 |
| 最近鄰距離 | $a/\sqrt2$ | 面對角線一半 $\tfrac{\sqrt2}2a$ |
| 堆積率 | $\dfrac{\pi}{3\sqrt2}\approx0.74$ | 見下 |

**堆積率推導**:硬球相切 → 球半徑 $r=\tfrac12\cdot\tfrac{a}{\sqrt2}=\tfrac{a}{2\sqrt2}$。每慣用胞 4 球:
$$f=\frac{4\cdot\frac43\pi r^3}{a^3}=\frac{\frac{16}3\pi\left(\frac{a}{2\sqrt2}\right)^3}{a^3}=\frac{\frac{16}3\pi\cdot\frac{a^3}{16\sqrt2}}{a^3}=\frac{\pi}{3\sqrt2}=\boxed{0.7405.}$$

### (g) cubic 中 $[hkl]\perp(hkl)$ + 面間距
**Step 1.** 平面 $(hkl)$ 的法向 = 倒晶格向量 $\mathbf G=h\mathbf b_1+k\mathbf b_2+l\mathbf b_3$。cubic 時 $\mathbf b_i=\tfrac{2\pi}a\hat e_i$,故
$$\mathbf G=\frac{2\pi}a(h\hat x+k\hat y+l\hat z).$$
**Step 2.** 晶向 $[hkl]=h\hat x+k\hat y+l\hat z\parallel\mathbf G$,而 $\mathbf G\perp(hkl)$(倒晶格向量恆垂直其對應晶面)→ $[hkl]\perp(hkl)$ ✓。**注意這只在 cubic 成立**,因唯 cubic 才有 $\mathbf b_i\parallel\mathbf a_i$。
**Step 3.** 面間距
$$d_{hkl}=\frac{2\pi}{|\mathbf G|}=\boxed{\frac{a}{\sqrt{h^2+k^2+l^2}}.}$$

- bcc 原胞角 $109.47°$、邊 $0.866a$,屬 trigonal ✓(Kittel 標準)。
- fcc 堆積率 $0.74$ = 最密堆積(與 hcp 同)✓;最近鄰 12 ✓。
- (g) $d_{100}=a,\ d_{110}=a/\sqrt2,\ d_{111}=a/\sqrt3$,遞減合理 ✓。

# 📗 第 2 題 — Bragg ↔ von Laue 等價（10 pts）

## 📋 原題
> X 光繞射的 Bragg 與 von Laue 表述各是什麼?證明兩者等價。

## 🎯 核心訊息
> 兩者是同一物理的兩種語言:Bragg 把晶面當鏡子($2d\sin\theta=n\lambda$),von Laue 看動量轉移($\Delta\mathbf k=\mathbf G$)。代入 $|\mathbf G|=2\pi n/d$ 與 $|\Delta\mathbf k|=2k\sin\theta$ 即互換。

## 解答
### Bragg 表述
視平行晶面(間距 $d$)為部分反射鏡,相鄰面反射光程差 $2d\sin\theta$,建設性干涉:
$$\boxed{2d\sin\theta=n\lambda.}$$

### von Laue 表述
彈性散射 $|\mathbf k'|=|\mathbf k|=2\pi/\lambda$;建設性干涉要求動量轉移等於倒晶格向量:
$$\boxed{\Delta\mathbf k=\mathbf k'-\mathbf k=\mathbf G.}$$

### 等價證明
**Step 1.** 由 $\Delta\mathbf k=\mathbf G$,取模:$|\mathbf G|=|\mathbf k'-\mathbf k|$。彈性 $|\mathbf k'|=|\mathbf k|=k$,且入射與散射對 $\mathbf G$(即晶面法向)對稱,夾半角 $\theta$:
$$|\Delta\mathbf k|=2k\sin\theta=\frac{4\pi}{\lambda}\sin\theta.$$
**Step 2.** 倒晶格向量大小與面間距關係:$\mathbf G$ 對應 $(hkl)$ 面族,最短的 $|\mathbf G_{hkl}|=2\pi/d_{hkl}$;其 $n$ 倍 $|\mathbf G|=2\pi n/d$。
**Step 3.** 令兩者相等 $\Delta k=G$:
$$\frac{4\pi}{\lambda}\sin\theta=\frac{2\pi n}{d}\ \Rightarrow\ 2d\sin\theta=n\lambda.\ \blacksquare$$
> **小結**:von Laue 的 $n$ 階繞射 = Bragg 把 $\mathbf G$ 取 $n$ 倍(即 $(nh,nk,nl)$ 面)。兩者完全等價。

# 📙 第 3 題 — 結構因子（sc / bcc / fcc / diamond）（2+3+3+3+3 = 14 pts）

## 📋 原題
> (a) X 光繞射中的 structure factor 是什麼?算 (b) simple cubic、(c) bcc、(d) fcc、(e) diamond 的結構因子,並列出各晶格可能出現的反射。

## 🎯 核心訊息
> **倒晶格定峰位置,結構因子定峰強度(消光)。** basis 內各原子的相位和 $S_{\mathbf G}=\sum_j f_j e^{-i2\pi(hx_j+ky_j+lz_j)}$;當相位相消 $S=0$ → 該峰消失。

## 解答

### (a) structure factor 定義
一個原胞內 basis 各原子($f_j$ 為原子形狀因子,$\mathbf r_j$ 為分數座標)對繞射振幅的相干貢獻:
$$\boxed{S_{\mathbf G}=\sum_j f_j\,e^{-i2\pi(hx_j+ky_j+lz_j)}.}$$
繞射強度 $I\propto|S_{\mathbf G}|^2$;$S=0$ 即系統消光。

### (b) simple cubic — basis 1 原子 $(0,0,0)$
$$S=f\quad\forall(hkl)\ \Rightarrow\ \boxed{\text{所有 }(hkl)\text{ 皆出現}.}$$

### (c) bcc — basis $(0,0,0),(\tfrac12,\tfrac12,\tfrac12)$
$$S=f\big[1+e^{-i\pi(h+k+l)}\big]=f\big[1+(-1)^{h+k+l}\big]=\boxed{\begin{cases}2f & h+k+l\ \text{偶}\\ 0 & h+k+l\ \text{奇}\end{cases}}$$
**出現**:110, 200, 211, 220, 310, 222,…(指標和為偶)。

### (d) fcc — basis $(000),(\tfrac12\tfrac120),(\tfrac120\tfrac12),(0\tfrac12\tfrac12)$
$$S=f\big[1+e^{-i\pi(h+k)}+e^{-i\pi(h+l)}+e^{-i\pi(k+l)}\big]=\boxed{\begin{cases}4f & h,k,l\ \text{全奇或全偶}\\ 0 & \text{混合奇偶}\end{cases}}$$
**出現**:111, 200, 220, 311, 222, 400,…。

### (e) diamond — fcc 再加 basis $(\tfrac14\tfrac14\tfrac14)$
$$S=S_{\text{fcc}}\cdot\big[1+e^{-i\frac\pi2(h+k+l)}\big].$$
在 fcc 允許峰中再篩選:
- $h{+}k{+}l\equiv0\pmod4$(全偶且和為 4 倍):$[1+1]=2$ → **出現**(如 400, 220, 440)。
- $h{+}k{+}l\equiv2\pmod4$:$[1-1]=0$ → **消光**(如 **200, 222, 420**)。
- $h{+}k{+}l$ 奇(全奇):$[1\mp i]$,$|S|^2$ 有限 → **出現**(如 111, 311, 331)。

**出現**:111, 220, 311, 400, 331, 422,…;**消光**:200, 222, 420,…。

### 反射總表
| 晶格 | 出現規則 | 前幾個出現 |
|---|---|---|
| sc | 全部 | 100,110,111,200,210,211,… |
| bcc | $h{+}k{+}l$ 偶 | 110,200,211,220,310,222,… |
| fcc | 全奇 / 全偶 | 111,200,220,311,222,400,… |
| diamond | fcc 規則 ∧ $h{+}k{+}l\ne4n{+}2$ | 111,220,311,400,331,422,… |

$(100)$：$h+k+l=1$ 奇 $\Rightarrow S=f[1+(-1)]=0$ → **消光**。
$(110)$：$h+k+l=2$ 偶 $\Rightarrow S=f[1+1]=2f$ → **出現**，$I\propto|2f|^2=4f^2$。

**範例 B（fcc 為何無 (210)）**：fcc 允許 $\Leftrightarrow h,k,l$ 全奇或全偶。$(210)$ 是「偶奇偶」混合 $\Rightarrow$ 代入 $S=f[1+e^{-i\pi(h+k)}+e^{-i\pi(h+l)}+e^{-i\pi(k+l)}]$：$h+k=3$ 奇、$h+l=2$ 偶、$k+l=1$ 奇 $\Rightarrow S=f[1-1+1-1]=0$ → **消光**。

**範例 C（diamond 的 (222) 消、(400) 在）**：diamond $S=S_{\text{fcc}}\cdot[1+e^{-i\frac\pi2(h+k+l)}]$。
$(222)$：全偶 → fcc 允許；$h+k+l=6\equiv2\pmod4\Rightarrow e^{-i\frac\pi2\cdot6}=e^{-i3\pi}=-1\Rightarrow[1-1]=0$ → **消光**。
$(400)$：全偶 → fcc 允許；$h+k+l=4\equiv0\pmod4\Rightarrow e^{-i\frac\pi2\cdot4}=e^{-i2\pi}=1\Rightarrow[1+1]=2$ → **出現**。

**範例 D（CsCl：兩種原子不全消）**：CsCl 是 sc，basis $\mathrm{Cs}(000)+\mathrm{Cl}(\tfrac12\tfrac12\tfrac12)$，兩原子形狀因子 $f_{\mathrm{Cs}}\ne f_{\mathrm{Cl}}$：
$$S=f_{\mathrm{Cs}}+f_{\mathrm{Cl}}e^{-i\pi(h+k+l)}=\begin{cases}f_{\mathrm{Cs}}+f_{\mathrm{Cl}} & h+k+l\ \text{偶}\\ f_{\mathrm{Cs}}-f_{\mathrm{Cl}} & h+k+l\ \text{奇}\end{cases}$$
奇指標峰**不再完全消失**（只變弱 $\propto|f_{\mathrm{Cs}}-f_{\mathrm{Cl}}|^2$）——這是區分 CsCl 與真 bcc 的判據。
</details>

## ✅ 自我檢核
- bcc (100) 奇 → 消光、(110) 偶 → 出現 ✓(實驗一致)。
- diamond (200) 消、(222) 消、(111) 在 ✓(矽/鍺繞射特徵)。

# 📕 第 4 題 — 晶體鍵結類型（5 pts）

## 📋 原題
> 主要晶體鍵結類型有哪些?各舉至少一種材料系統為例。

## 🎯 核心訊息
> 五類,由弱到強的代表:van der Waals → hydrogen → metallic → ionic → covalent。

## 解答
| 鍵結 | 機制 | 例 |
|---|---|---|
| **van der Waals**(分子) | 瞬時偶極–感應偶極($\propto r^{-6}$) | Ar、Kr、固態 CH₄ |

# 📒 第 5 題 — van der Waals 推導 + 氪熔點估計（10 pts）

## 📋 原題
> 由「兩個全同諧振子」或「兩偶極的靜電作用能」推導 van der Waals 交互作用。用 $U(R)\approx-10^{-58}\,\mathrm{erg\,cm^6}/R^6$、原子間距 $4\,\text{Å}$、$k_B=1.38\times10^{-16}\,\mathrm{erg/K}$,估計惰性氣體氪的熔點。

## 🎯 核心訊息
> 兩個耦合諧振子的**零點能**因偶極耦合而下降,降幅 $\propto -1/R^6$ → 這就是 van der Waals 吸引。熔點估計:令熱能 $k_BT_m\sim|U(R)|$。

## 🔍 符號說明
<details>
<summary><b>▸ 兩耦合諧振子 → 零點能下降 → $-1/R^6$</b></summary>

每個原子模型成一維諧振子(電子相對離子位移 $x_i$,彈簧常數 $C$,$\omega_0=\sqrt{C/m}$)。兩振子相距 $R$,偶極矩 $p_i=ex_i$,偶極–偶極耦合能 $\sim\dfrac{2e^2x_1x_2}{R^3}$。對角化耦合 → 兩正則模頻率分裂 → 零點能 $\tfrac12\hbar(\omega_++\omega_-)$ 低於未耦合的 $\hbar\omega_0$,降幅 $\propto R^{-6}$。
</details>

## 解答

### (i) 推導(兩諧振子法,完整)
**Step 1 — 未耦合 Hamiltonian。**
$$H_0=\frac{p_1^2}{2m}+\frac12 C x_1^2+\frac{p_2^2}{2m}+\frac12 C x_2^2,\qquad \omega_0=\sqrt{C/m}.$$
**Step 2 — 偶極耦合。** 兩共線偶極($ex_1,ex_2$)相距 $R$ 的靜電作用,展開到領先項:
$$H_1\approx-\frac{2e^2}{R^3}x_1x_2.$$
**Step 3 — 正則模。** 令 $x_\pm=\tfrac1{\sqrt2}(x_1\pm x_2)$,則
$$\tfrac12C(x_1^2+x_2^2)-\tfrac{2e^2}{R^3}x_1x_2=\tfrac12\Big(C-\tfrac{2e^2}{R^3}\Big)x_+^2+\tfrac12\Big(C+\tfrac{2e^2}{R^3}\Big)x_-^2,$$
$$\omega_\pm=\sqrt{\frac{C\mp 2e^2/R^3}{m}}=\omega_0\sqrt{1\mp\frac{2e^2}{CR^3}}.$$
**Step 4 — 零點能差。** 展開到二階 $\sqrt{1+x}\approx1+\tfrac x2-\tfrac{x^2}8$:
$$\Delta U=\tfrac12\hbar(\omega_++\omega_-)-\hbar\omega_0\approx\tfrac12\hbar\omega_0\Big[-\tfrac18\Big(\tfrac{2e^2}{CR^3}\Big)^2\cdot2\Big]=-\frac{\hbar\omega_0}{8}\Big(\frac{2e^2}{CR^3}\Big)^2.$$
$$\boxed{\Delta U=-\frac{\hbar\omega_0\,e^4}{2C^2}\frac1{R^6}\equiv-\frac{A}{R^6}<0.}$$
一階項 $\mp\tfrac12$ 相消,二階項同號相加 → 淨吸引 $\propto-1/R^6$,即 van der Waals。

### (ii) 氪熔點估計(完整數值)
熔點時熱能與鍵能同量級,取 $k_BT_m\approx|U(R)|$。代 $R=4\,\text{Å}=4\times10^{-8}\,\mathrm{cm}$:
$$R^6=(4\times10^{-8})^6=4^6\times10^{-48}=4096\times10^{-48}=4.096\times10^{-45}\,\mathrm{cm^6}.$$
$$|U|=\frac{10^{-58}}{4.096\times10^{-45}}=2.44\times10^{-14}\,\mathrm{erg}.$$
$$\boxed{T_m\approx\frac{|U|}{k_B}=\frac{2.44\times10^{-14}}{1.38\times10^{-16}}\approx177\,\mathrm{K}.}$$
> **小結**:估得 $\sim177\,\mathrm K$,與氪實際熔點 $116\,\mathrm K$ 同量級(差約 1.5 倍)——這是「$k_BT_m\sim$ 鍵能」的粗估,沒考慮配位數與多體和,量級正確即達題意。

# 📓 第 6 題 — 單原子鏈聲子的總能量（4+7 = 11 pts）★長推導

## 📋 原題
> 單原子線晶格(原子質量 $M$、間距 $a$、最近鄰力常數 $C$),縱波 $u_s=u\cos(\omega t-sKa)$。
> (a) 證明波的總能量為
> $$E=\frac12 M\sum_s\Big(\frac{du_s}{dt}\Big)^2+\frac12 C\sum_s(u_s-u_{s+1})^2.$$
> (b) 代入 $u_s$,證明每原子的時間平均總能量為
> $$\frac14 M\omega^2u^2+\frac12 C(1-\cos Ka)u^2=\frac12 M\omega^2u^2,$$
> 最後一步用了色散關係 $\omega^2=(4C/M)\sin^2\tfrac12 Ka$。

## 🎯 核心訊息
> 動能時間平均 $\tfrac14M\omega^2u^2$、位能時間平均 $\tfrac12C(1-\cos Ka)u^2$;**用色散關係 $C(1-\cos Ka)=\tfrac12M\omega^2$**,兩者相等 → 各 $\tfrac14M\omega^2u^2$,合計 $\tfrac12M\omega^2u^2$(動能=位能,簡諧振子均分定理)。

## 🔍 符號說明
<details>
<summary><b>▸ 為何位能寫成 $\tfrac12C(u_s-u_{s+1})^2$、色散關係怎麼來</b></summary>

最近鄰彈簧:第 $s$、$s{+}1$ 原子間的彈簧伸長 $=u_s-u_{s+1}$,儲能 $\tfrac12C(u_s-u_{s+1})^2$。運動方程 $M\ddot u_s=C(u_{s+1}+u_{s-1}-2u_s)$,代行波解即得色散 $\omega^2=\dfrac{4C}{M}\sin^2\dfrac{Ka}{2}=\dfrac{2C}{M}(1-\cos Ka)$。故 $C(1-\cos Ka)=\tfrac12M\omega^2$——這正是 (b) 最後一步的鑰匙。
</details>

## 解答

### (a) 總能量 = 動能 + 彈性位能
**動能**:第 $s$ 原子質量 $M$、速度 $\dot u_s$,動能 $\tfrac12M\dot u_s^2$。對所有原子求和:
$$T=\frac12 M\sum_s\dot u_s^2=\frac12 M\sum_s\Big(\frac{du_s}{dt}\Big)^2.$$
**位能**:最近鄰諧近似下,每對相鄰原子(力常數 $C$)的彈性能 $\tfrac12C(u_s-u_{s+1})^2$。對所有鍵求和:
$$V=\frac12 C\sum_s(u_s-u_{s+1})^2.$$
$$\boxed{E=T+V=\frac12 M\sum_s\Big(\frac{du_s}{dt}\Big)^2+\frac12 C\sum_s(u_s-u_{s+1})^2.}\ \blacksquare$$

### (b) 代入行波,取時間平均
**Step 1 — 動能項。** $\dot u_s=-u\omega\sin(\omega t-sKa)$,
$$\frac12 M\dot u_s^2=\frac12 M u^2\omega^2\sin^2(\omega t-sKa).$$
時間平均 $\langle\sin^2\rangle=\tfrac12$,故**每原子動能平均**
$$\langle T\rangle_s=\frac12 Mu^2\omega^2\cdot\frac12=\frac14 M\omega^2u^2.$$

**Step 2 — 位能項。** 用和差化積 $\cos A-\cos B=-2\sin\tfrac{A+B}{2}\sin\tfrac{A-B}{2}$,取 $A=\omega t-sKa$、$B=\omega t-(s+1)Ka$($A-B=Ka$):
$$u_s-u_{s+1}=u\big[\cos A-\cos B\big]=-2u\sin\!\Big(\omega t-(s+\tfrac12)Ka\Big)\sin\frac{Ka}{2}.$$
平方:
$$(u_s-u_{s+1})^2=4u^2\sin^2\!\Big(\omega t-(s+\tfrac12)Ka\Big)\sin^2\frac{Ka}{2}.$$
時間平均 $\langle\sin^2\rangle=\tfrac12$:
$$\big\langle(u_s-u_{s+1})^2\big\rangle=4u^2\cdot\frac12\cdot\sin^2\frac{Ka}{2}=2u^2\sin^2\frac{Ka}{2}.$$
用 $\sin^2\tfrac{Ka}{2}=\tfrac12(1-\cos Ka)$,**每原子位能平均**
$$\langle V\rangle_s=\frac12 C\cdot2u^2\sin^2\frac{Ka}{2}=Cu^2\sin^2\frac{Ka}{2}=\frac12 C(1-\cos Ka)u^2.$$

**Step 3 — 合計並用色散關係。** 每原子時間平均總能
$$\langle E\rangle_s=\frac14 M\omega^2u^2+\frac12 C(1-\cos Ka)u^2.$$
代色散 $\omega^2=\dfrac{2C}{M}(1-\cos Ka)\Rightarrow C(1-\cos Ka)=\tfrac12 M\omega^2$:
$$\frac12 C(1-\cos Ka)u^2=\frac12\cdot\frac12 M\omega^2u^2=\frac14 M\omega^2u^2.$$
$$\boxed{\langle E\rangle_s=\frac14 M\omega^2u^2+\frac14 M\omega^2u^2=\frac12 M\omega^2u^2.}\ \blacksquare$$
> **小結**:動能平均 = 位能平均 = $\tfrac14M\omega^2u^2$(諧振子位能/動能均分),合計 $\tfrac12M\omega^2u^2$,與題目一致。

# 📘 第 7 題 — Debye vs Einstein 聲子 DOS（3 pts）

## 📋 原題
> 聲子態密度的 Debye 模型是什麼?Einstein 模型是什麼?

## 解答
- **Debye**:把晶格振動當**連續彈性介質**,色散 $\omega=vk$ 線性,DOS
  $$g(\omega)=\frac{3V\omega^2}{2\pi^2v^3}\quad(0\le\omega\le\omega_D),$$
  並以「模式總數 $=3N$」截止於 Debye 頻率 $\omega_D=v(6\pi^2N/V)^{1/3}$。對應比熱低溫 $\propto T^3$、高溫 $\to3Nk_B$。
- **Einstein**:假設 $3N$ 個模**全同頻率 $\omega_E$**(獨立振子),DOS 為單一 $\delta$ 峰
  $$g(\omega)=3N\,\delta(\omega-\omega_E).$$
  低溫比熱**指數**衰減(因缺低頻聲學模,衰太快),適合描述 optical 模。

## ✅ 自我檢核：Debye $\int_0^{\omega_D}g\,d\omega=3N$ ✓;Einstein 低溫過衰 → 故低溫須用 Debye $T^3$ ✓。

# 📙 第 9 題 — Drude 與 Sommerfeld 理論（3+3+3+3 = 12 pts）

## 📋 原題
> 金屬模型 Drude theory:(a) 盡量描述它。(b) 主要成就與失敗?(c) Sommerfeld 如何修正?(d) Sommerfeld 修正的主要成就與失敗?

## 🎯 核心訊息
> Drude = 古典自由電子氣(Maxwell–Boltzmann);Sommerfeld 換成 **Fermi–Dirac + Pauli**。換統計就解決了比熱過大、Lorenz 數等問題;但兩者都「自由電子」,擋不住能隙/絕緣體/正 Hall 係數——那要 Bloch(第 10–11 題)。

## 解答

### (a) Drude theory 描述
- 金屬中價電子視為**古典理想氣體**,在固定離子背景中自由運動;遵守 **Maxwell–Boltzmann** 統計。
- 電子與離子(實則雜質/聲子)碰撞,平均**弛豫時間 $\tau$**,碰撞間隨機化速度。
- 結果:直流電導 $\sigma=\dfrac{ne^2\tau}{m}$、運動方程 $m\dfrac{d\mathbf v}{dt}=-e\mathbf E-\dfrac{m\mathbf v}\tau$。

### (b) Drude 成就與失敗
**成就**:Ohm 定律與 $\sigma=ne^2\tau/m$、Hall 效應、AC 電導與電漿頻率、Wiedemann–Franz 定律($\kappa/\sigma T=$ 常數,數值幸運地約對)。
**失敗**:預測電子比熱 $\tfrac32k_B$/電子(實測小百倍)、Lorenz 數靠**兩個錯(過大 $v^2$ × 過大 $C$)相消**才對、無法解釋為何有絕緣體、部分金屬 Hall 係數為**正**、磁阻與熱電勢量級錯。

### (c) Sommerfeld 修正
保留自由電子,但把 **Maxwell–Boltzmann 換成 Fermi–Dirac 分布 + Pauli 不相容**:電子填到費米能 $E_F$,只有費米面附近 $\sim k_BT$ 寬的電子能被熱激發。

### (d) Sommerfeld 成就與失敗
**成就**:正確的電子比熱 $C_{el}=\tfrac{\pi^2}2 nk_B(T/T_F)\propto T$(故小)、正確的 Lorenz 數 $L=\tfrac{\pi^2}3(k_B/e)^2$、Pauli 順磁、合理的熱電勢量級。
**失敗**:**仍是自由電子** → 不解釋能隙/絕緣體/半導體、正 Hall 係數、為何平均自由程可極長、能帶結構。需引入週期位能 → **Bloch 理論**。

## ✅ 自我檢核：核心一句——「Sommerfeld 修對了統計(比熱、Lorenz),但沒修『自由』這件事(能隙)」✓。

# 📕 第 10 題 — Bloch 定理 + 證明（2+10 = 12 pts）★長推導

## 📋 原題
> (a) Bloch 定理是什麼?(b) 證明之(可用一般量子力學論述或其他)。

## 🎯 核心訊息
> 「平移算符與 $H$ 對易 → 共同本徵態 → 本徵值是模 1 相位 $e^{i\mathbf k\cdot\mathbf R}$」。Bloch 不是假設,是「平移對稱 + 歸一不變」的必然。

## 📚 前情提要
週期位能 $V(\mathbf r+\mathbf R)=V(\mathbf r)$ ⇒ 平移 $\mathbf R$ 不改 $H$ ⇒ 平移算符 $T_{\mathbf R}$ 與 $H$ 對易 ⇒ 可同時對角化。$T_{\mathbf R}$ 本徵值因平移不改機率而模 1 → $e^{i\mathbf k\cdot\mathbf R}$。

## 解答

### (a) Bloch 定理敘述
週期位能下,單電子本徵態可寫成「平面波 × 週期函數」:
$$\boxed{\psi_{\mathbf k}(\mathbf r)=e^{i\mathbf k\cdot\mathbf r}u_{\mathbf k}(\mathbf r),\qquad u_{\mathbf k}(\mathbf r+\mathbf R)=u_{\mathbf k}(\mathbf r),}$$
等價於 $\psi_{\mathbf k}(\mathbf r+\mathbf R)=e^{i\mathbf k\cdot\mathbf R}\psi_{\mathbf k}(\mathbf r)$。

### (b) 證明（平移算符法,完整）
**Step 1 — 定義平移算符。** $T_{\mathbf R}f(\mathbf r)=f(\mathbf r+\mathbf R)$。因 $V$ 週期,$T_{\mathbf R}\big(H\psi\big)=H\big(T_{\mathbf R}\psi\big)$,即 $[T_{\mathbf R},H]=0$。
**Step 2 — 平移群可交換。** $T_{\mathbf R}T_{\mathbf R'}=T_{\mathbf R+\mathbf R'}=T_{\mathbf R'}T_{\mathbf R}$。一族互相對易又與 $H$ 對易 → 有**共同本徵態** $\psi$。
**Step 3 — 本徵值模 1。** 設 $T_{\mathbf R}\psi=c(\mathbf R)\psi$。歸一不變($\int|\psi|^2$ 不因平移改變)⇒ $|c(\mathbf R)|=1$。又群性質 ⇒ $c(\mathbf R)c(\mathbf R')=c(\mathbf R+\mathbf R')$。
**Step 4 — 解函數方程。** $|c|=1$ 且對加法為乘法同態 ⇒ 必為 $c(\mathbf R)=e^{i\mathbf k\cdot\mathbf R}$(某實向量 $\mathbf k$)。故
$$\psi(\mathbf r+\mathbf R)=e^{i\mathbf k\cdot\mathbf R}\psi(\mathbf r).$$
**Step 5 — 化成 Bloch 形。** 定義 $u_{\mathbf k}(\mathbf r)\equiv e^{-i\mathbf k\cdot\mathbf r}\psi(\mathbf r)$,則
$$u_{\mathbf k}(\mathbf r+\mathbf R)=e^{-i\mathbf k\cdot(\mathbf r+\mathbf R)}\psi(\mathbf r+\mathbf R)=e^{-i\mathbf k\cdot\mathbf r}e^{-i\mathbf k\cdot\mathbf R}\,e^{i\mathbf k\cdot\mathbf R}\psi(\mathbf r)=u_{\mathbf k}(\mathbf r).\ \blacksquare$$
> **小結**:唯一輸入是「平移對稱 + 歸一不變」;$\hbar\mathbf k$ 是平移群的量子數(晶體動量),只在模一個 $\hbar\mathbf G$ 下守恆。

## ✅ 自我檢核：$\mathbf k\to\mathbf k+\mathbf G$ 給同一 $c(\mathbf R)$(因 $e^{i\mathbf G\cdot\mathbf R}=1$)→ $\mathbf k$ 可限第一 BZ ✓。
## 🔀 變化：也可走 central equation(見第 11 題);2016 第 4(a) 同題。
## 信心：高（Kittel Ch7 標準）

# 📒 第 11 題 — 能隙起源 + BZ 邊界能隙 $2U$（2+5+7 = 14 pts）★長推導

## 📋 原題
> (a) 能隙的起源?(b) 一維晶體(常數 $a$),位能 $U(x)=2U\cos Gx$,$G=2\pi/a$ 為倒晶格向量,證明 Brillouin zone 邊界的能隙大小為 $2U$(一階)。(加分:用 central equation $(\lambda_k-E)C(k)+\sum_G U_G C(k-G)=0$ 導出,$\lambda_k=\hbar^2k^2/2m$,$H\psi=(p^2/2m+U(x))\psi=E\psi$;假設位能 Fourier 分量遠小於 zone 邊界自由電子動能。)

## 🎯 核心訊息
> 在 BZ 邊界 $k=\pm\pi/a$,兩個簡併平面波 $e^{\pm i\pi x/a}$ 被週期位能耦合,$2\times2$ 久期方程給 $E_\pm=\lambda\pm U$,**能隙 $=2U=2|U_G|$**。

## 🔍 符號說明
<details>
<summary><b>▸ $U(x)=2U\cos Gx$ 的 Fourier 分量是 $U$,不是 $2U$</b></summary>

$2U\cos Gx=U e^{iGx}+U e^{-iGx}$,故 $U_{+G}=U_{-G}=U$。能隙 $=2|U_G|=2U$。這個「2」的來源是 $\pm G$ 兩個分量,別與 cos 前的係數 $2U$ 混淆。
</details>

## 解答

### (a) 能隙起源
自由電子 $E=\hbar^2k^2/2m$ 連續無隙。在 BZ 邊界 $k=\pm\pi/a$,$e^{i\pi x/a}$ 與 $e^{-i\pi x/a}$ 簡併,被週期位能的 Fourier 分量 $U_G$ 強耦合(Bragg 反射),混成兩個**駐波**:
$$\psi_+\propto\cos\frac{\pi x}{a}\ (\text{電子密度堆在離子上,能量低}),\quad \psi_-\propto\sin\frac{\pi x}{a}\ (\text{堆在離子間,能量高}).$$
兩者能量差 = 能隙。

### (b) 退化微擾法(一階,給 $2U$)
**Step 1 — 簡併基底。** 在 $k=\pi/a$,取 $|1\rangle=e^{i\pi x/a}$、$|2\rangle=e^{-i\pi x/a}$,自由電子能皆 $\lambda=\dfrac{\hbar^2}{2m}\Big(\dfrac\pi a\Big)^2$。
**Step 2 — 位能矩陣元。** $U(x)=Ue^{iGx}+Ue^{-iGx}$,$G=2\pi/a$。
$$\langle1|U|2\rangle=\frac1L\int e^{-i\pi x/a}U(x)e^{-i\pi x/a}dx=\frac1L\int U(x)e^{-i2\pi x/a}dx=U_G=U,$$
(只有 $e^{+iGx}$ 項殘存,挑出 $U_G=U$);同理 $\langle2|U|1\rangle=U_{-G}=U$,對角元 $\langle1|U|1\rangle=\langle2|U|2\rangle=0$。
**Step 3 — 久期方程。**
$$\begin{vmatrix}\lambda-E & U\\ U & \lambda-E\end{vmatrix}=0\ \Rightarrow\ (\lambda-E)^2=U^2\ \Rightarrow\ E_\pm=\lambda\pm U.$$
$$\boxed{E_{\text{gap}}=E_+-E_-=2U.}$$

### (b′) central equation 法(加分,完整)
**Step 1 — 寫 central equation。** 在 $k$ 附近只保留與 $C(k)$ 經由 $U_{\pm G}$ 耦合的 $C(k-G)$ 兩係數:
$$(\lambda_k-E)C(k)+U_G\,C(k-G)+U_{-G}\,C(k+G)+\dots=0.$$
在 zone 邊界 $k=G/2=\pi/a$,最近共振的是 $k$ 與 $k-G=-\pi/a$。截斷成兩式:
$$(\lambda_k-E)C(k)+U\,C(k-G)=0,$$
$$(\lambda_{k-G}-E)C(k-G)+U\,C(k)=0.$$
**Step 2 — 邊界簡併。** $\lambda_k=\dfrac{\hbar^2}{2m}\Big(\dfrac\pi a\Big)^2=\lambda$,$\lambda_{k-G}=\dfrac{\hbar^2}{2m}\Big(-\dfrac\pi a\Big)^2=\lambda$(相等)。
**Step 3 — 久期行列式。**
$$\begin{vmatrix}\lambda-E & U\\ U & \lambda-E\end{vmatrix}=0\ \Rightarrow\ E_\pm=\lambda\pm U\ \Rightarrow\ \boxed{E_{\text{gap}}=2U.}$$
(假設 $U\ll\lambda$,故只需保留這兩個近簡併分量,高階 $C(k\pm2G)$ 可略 → 一階結果。)
> **小結**:兩法同源——「兩個近簡併平面波 + 把它們耦起來的單一 Fourier 分量 $U_G$」。能隙 $=2|U_G|$,此題 $|U_G|=U$ → $2U$。

$$\begin{vmatrix}\lambda+V_0-E & U_G\\ U_G^* & \lambda+V_0-E\end{vmatrix}=0\Rightarrow E_\pm=\lambda+V_0\pm|U_G|,$$

**範例 D（Kronig–Penney δ 位能對照）**：$U(x)=A\sum_n\delta(x-na)$ 的 Fourier 分量 $U_G=\dfrac{A}{a}$（與 $G$ 無關，各階等大）。故 KP 模型**每個** BZ 邊界都開能隙 $\approx2A/a$（弱位能極限），不像單 $\cos$ 只開第一隙。這對應 2014 第 11 題、2016 第 4(e) 的 $\delta$-KP 題型。

## ✅ 自我檢核
- $U\to0$ 時 gap $\to0$ → 回自由電子 ✓。
- 駐波能量 $E_\pm=\lambda\pm U$ 對稱分裂於自由電子值 $\lambda$ ✓。
- Fourier 分量取對:$U(x)=2U\cos Gx\Rightarrow U_G=U$(非 $2U$)✓。

# 📓 第 12 題 — 電洞、本徵/外質半導體（3 pts）

## 📋 原題
> 半導體中的「holes」是什麼?什麼是 (a) 本徵(intrinsic)、(b) 外質(extrinsic)半導體?

## 解答
- **Holes(電洞)**:價帶頂部缺一個電子留下的空位;在電場/能帶動力學中表現如**帶 $+e$、正 effective mass** 的載子,與電子反向漂移但**同向貢獻電流**。
- **(a) Intrinsic**:純(未摻雜)半導體,載子完全來自**熱激發跨能隙**,$n=p=n_i\propto T^{3/2}e^{-E_g/2k_BT}$。
- **(b) Extrinsic**:**摻雜**的半導體——donor(n 型,如 Si:P)或 acceptor(p 型,如 Si:B)主導載子濃度;室溫下雜質近全游離,$n\approx N_D$(或 $p\approx N_A$),導電性由摻雜控制。

## ✅ 自我檢核：intrinsic $np=n_i^2$;extrinsic 仍守 $np=n_i^2$ 但多數載子由摻雜定 ✓。
## 信心：高

# 📘 第 13 題 — 磁性儲存的物理極限（3 pts）

## 📋 原題
> 解釋磁性媒體做資訊儲存的物理極限。

## 解答
**超順磁極限(superparamagnetic limit)**。一個位元 = 一顆(或一群)磁性晶粒的磁化方向。其熱穩定性由**磁各向異性能障** $K_uV$ 對抗熱擾動 $k_BT$ 決定,翻轉率 $\sim f_0e^{-K_uV/k_BT}$。要 10 年保存資料需
$$\frac{K_uV}{k_BT}\gtrsim40\text{–}60.$$
提高面密度 → 晶粒體積 $V$ 縮小 → $K_uV$ 下降 → 熱擾動隨機翻轉磁矩、**資料自發抹除**。這就是磁儲存的物理極限。**對策**:用高各向異性材料($K_u$ 大,如 FePt)、垂直記錄、熱輔助寫入(HAMR)以兼顧可寫性與穩定性。

## ✅ 自我檢核：極限本質 = $K_uV$ vs $k_BT$ 競爭 ✓。
## 信心：高

# 📗 第 14 題 — Langevin 函數推導（10 pts）★長推導

## 📋 原題
> $N$ 顆均勻分布、隨機取向的奈米磁體(各磁矩 $m$)置於外場 $H$ 中,每顆取向機率 $\propto e^{-U/k_BT}$(Boltzmann),證明總磁化
> $$M(H)=Nm\,L(\alpha),\quad \alpha=\frac{mH}{k_BT},\quad L(\alpha)=\coth\alpha-\frac1\alpha\ (\text{Langevin 函數}).$$
> 提示積分:$\displaystyle\int x^n e^{\alpha x}dx=\frac{x^n e^{\alpha x}}{\alpha}-\frac n\alpha\int x^{n-1}e^{\alpha x}dx.$

## 🎯 核心訊息
> 把磁矩在場中的能量 $U=-mH\cos\theta$ 丟進 Boltzmann,對所有取向做**統計平均** $\langle\cos\theta\rangle$;球面積分用 $x=\cos\theta$ 換元,提示積分(分部)算出分子 → 得 $\coth\alpha-1/\alpha$。

## 🔍 符號說明
<details>
<summary><b>▸ 為何 $U=-mH\cos\theta$、平均怎麼取</b></summary>

磁矩 $\mathbf m$ 在場 $\mathbf H$ 中位能 $U=-\mathbf m\cdot\mathbf H=-mH\cos\theta$($\theta$ 為夾角)。每顆磁體沿 $\mathbf H$ 的投影 $m\cos\theta$,以 Boltzmann 權重 $e^{-U/k_BT}=e^{\alpha\cos\theta}$ 對立體角 $d\Omega=2\pi\sin\theta\,d\theta$ 平均。換元 $x=\cos\theta$ 後就是一維積分。
</details>

## 解答

**Step 1 — 單顆平均磁矩。** 沿場方向投影 $m\cos\theta$,以 Boltzmann 權重對立體角平均($\alpha\equiv mH/k_BT$):
$$\langle m_z\rangle=m\,\frac{\displaystyle\int_0^\pi \cos\theta\,e^{\alpha\cos\theta}\,2\pi\sin\theta\,d\theta}{\displaystyle\int_0^\pi e^{\alpha\cos\theta}\,2\pi\sin\theta\,d\theta}.$$
**Step 2 — 換元 $x=\cos\theta$($dx=-\sin\theta\,d\theta$,$\theta:0\to\pi$ ⇒ $x:1\to-1$)。**
$$\langle m_z\rangle=m\,\frac{\displaystyle\int_{-1}^{1}x\,e^{\alpha x}\,dx}{\displaystyle\int_{-1}^{1}e^{\alpha x}\,dx}.$$
**Step 3 — 分母。**
$$\int_{-1}^1 e^{\alpha x}dx=\frac{e^\alpha-e^{-\alpha}}{\alpha}=\frac{2\sinh\alpha}{\alpha}.$$
**Step 4 — 分子(用提示積分,$n=1$)。**
$$\int x e^{\alpha x}dx=\frac{x e^{\alpha x}}{\alpha}-\frac1\alpha\int e^{\alpha x}dx=\frac{x e^{\alpha x}}{\alpha}-\frac{e^{\alpha x}}{\alpha^2}.$$
代上下限 $-1\to1$:
$$\int_{-1}^1 x e^{\alpha x}dx=\Big[\frac{x e^{\alpha x}}{\alpha}-\frac{e^{\alpha x}}{\alpha^2}\Big]_{-1}^{1}=\frac{e^\alpha+e^{-\alpha}}{\alpha}-\frac{e^\alpha-e^{-\alpha}}{\alpha^2}=\frac{2\cosh\alpha}{\alpha}-\frac{2\sinh\alpha}{\alpha^2}.$$
**Step 5 — 相除。**
$$\langle m_z\rangle=m\,\frac{\dfrac{2\cosh\alpha}{\alpha}-\dfrac{2\sinh\alpha}{\alpha^2}}{\dfrac{2\sinh\alpha}{\alpha}}=m\Big(\frac{\cosh\alpha}{\sinh\alpha}-\frac1\alpha\Big)=m\Big(\coth\alpha-\frac1\alpha\Big)=m\,L(\alpha).$$
**Step 6 — 總磁化(N 顆)。**
$$\boxed{M(H)=N\langle m_z\rangle=Nm\,L(\alpha),\qquad L(\alpha)=\coth\alpha-\frac1\alpha,\quad \alpha=\frac{mH}{k_BT}.}\ \blacksquare$$

**極限檢查**:
- 弱場 $\alpha\ll1$:$\coth\alpha\approx\tfrac1\alpha+\tfrac\alpha3$,$L\approx\tfrac\alpha3$ → $M\approx\dfrac{Nm^2H}{3k_BT}$(**Curie 定律** $\chi=Nm^2/3k_BT$)。
- 強場 $\alpha\gg1$:$\coth\alpha\to1$,$L\to1$ → $M\to Nm$(**飽和**)。

$$C=\frac{6\times10^{28}\times(9.27\times10^{-24})^2}{3\times1.38\times10^{-23}}=\frac{6\times10^{28}\times8.59\times10^{-47}}{4.14\times10^{-23}}=0.124\,\mathrm{K}.$$

**範例 D（量子 Brillouin → 古典 Langevin 極限）**：量子版 $M=Ng\mu_B J\,B_J(x)$，$x=g\mu_B JH/k_BT$，
$$B_J(x)=\frac{2J+1}{2J}\coth\frac{(2J+1)x}{2J}-\frac1{2J}\coth\frac{x}{2J}.$$
令 $J\to\infty$（古典極限）：$\dfrac{2J+1}{2J}\to1$、$\dfrac1{2J}\coth\dfrac{x}{2J}\to\dfrac1{2J}\cdot\dfrac{2J}{x}=\dfrac1x$，故 $B_J\to\coth x-\dfrac1x=L(x)$。Langevin 正是 Brillouin 的 $J\to\infty$ 古典極限。
</details>

# 📙 第 15 題 — STM / AFM / MFM 與量測位障高度（1+4 = 5 pts）

## 📋 原題
> (a) 解釋顯微技術縮寫:1) STM;2) AFM;3) MFM。(b) 要量測有效穿隧位障高度,該用下列哪種?從每個括號挑正確答案:(I, V, Z) vs. (I, V, Z) spectroscopy,Z feedback(ON, OFF),為什麼?

## 解答
### (a) 縮寫
1. **STM** = Scanning Tunneling Microscopy(掃描穿隧顯微術)。
2. **AFM** = Atomic Force Microscopy(原子力顯微術)。
3. **MFM** = Magnetic Force Microscopy(磁力顯微術)。

### (b) 量測位障高度
$$\boxed{(I)\ \text{vs.}\ (Z)\ \text{spectroscopy,Z feedback}\ \mathbf{OFF}.}$$
**為什麼**:穿隧電流隨針尖–樣品距離 $z$ 指數衰減
$$I\propto e^{-2\kappa z},\qquad \kappa=\frac{\sqrt{2m\phi}}{\hbar},$$
$\phi$ 為有效位障高度。取對數斜率即得
$$\phi=\frac{\hbar^2}{8m}\Big(\frac{d\ln I}{dz}\Big)^2.$$
故要**掃 $z$、記錄 $I(z)$**(即 $I$–$Z$ 譜),且必須**關閉 Z 回饋**(否則回饋會自動調 $z$ 維持定電流,$z$ 無法當自變量掃描)。由 $I$–$z$ 曲線的對數斜率算出 $\phi$。

## ✅ 自我檢核：$\phi\propto(d\ln I/dz)^2$,需 feedback OFF 才能自由變 $z$ ✓。
## 信心：高

# 📒 第 17 題 — 多層膜 X 光反射率「每第三峰消失」（20 pts）★長推導

## 📋 原題
> 由 $N$ 個週期、每週期厚 $D$ 的雙層(bilayer)疊成的多層膜:材料 1(密度 $\rho_1$、厚 $D_1$)+ 材料 2(密度 $\rho_2$、厚 $D_2$),如圖(a)。圖(b)為 Mo($D_1/D=1/3$)/Si($D_2/D=2/3$)多層膜的模擬 X 光反射率,其中**每第三個反射峰(箭頭標)消失**。用數學證明每第三峰消失。

## 🎯 核心訊息
> 多層膜 = 「超晶格週期 $D$(定布拉格峰位置 $q_m=2\pi m/D$)」× 「一個週期內的密度輪廓(定每個峰的振幅)」。**單週期 form factor $\propto\sin(\pi m D_1/D)$**;當 $D_1/D=1/3$,$m=3,6,9,\dots$ 時 form factor $=0$ → 每第三峰消失。

## ⚠️ 原圖判讀
![2013 Q17 多層膜反射率](figs/固態_2013_Q17_多層膜反射率.png)

- **圖(a)**:由下而上 substrate($\rho_s$)上疊 $N$ 個雙層;每雙層內 $\rho_1$(厚 $\Delta_1=D_1$)+ $\rho_2$(厚 $\Delta_2=D_2$),週期 $\Delta=D=D_1+D_2$。
- **圖(b)**:反射率(對數縱軸)對入射角。低角有總反射平台,之後一系列超晶格 Bragg 峰;肉眼可見峰呈「兩個亮、一個缺」的節奏——即第 3、6、9… 階峰被壓掉。本證明就是要算出這個 form-factor 零點。

## 🔍 符號說明
<details>
<summary><b>▸ 超晶格 Bragg 峰 = 「晶格和」× 「單胞 form factor」</b></summary>

把密度 $\rho(z)$ 看成以 $D$ 為週期的一維函數,展成 Fourier 級數:$\rho(z)=\sum_m F_m e^{i q_m z}$,$q_m=2\pi m/D$。反射率峰出現在動量轉移 $q=q_m$(超晶格 Bragg),**峰振幅 $\propto|F_m|$**;$F_m$ 由單一週期內的密度輪廓決定。$F_m=0$ 的階就看不到峰——這與晶體「結構因子消光」完全同構,只是這裡 basis 是「一層 $\rho_1$ + 一層 $\rho_2$」。
</details>

## 解答

**Step 1 — 單週期內的密度輪廓。** 設一個週期 $0\le z<D$:
$$\rho(z)=\begin{cases}\rho_1 & 0\le z<D_1\\ \rho_2 & D_1\le z<D\end{cases}\qquad(D=D_1+D_2).$$

**Step 2 — 第 $m$ 階 Fourier 係數(= form factor)。** $q_m=2\pi m/D$,
$$F_m=\frac1D\int_0^D\rho(z)\,e^{i q_m z}\,dz=\frac1D\Big[\rho_1\!\int_0^{D_1}\!e^{iq_m z}dz+\rho_2\!\int_{D_1}^{D}\!e^{iq_m z}dz\Big].$$

**Step 3 — 算兩段積分($m\ne0$)。** 用 $e^{iq_m D}=e^{i2\pi m}=1$:
$$\int_0^{D_1}e^{iq_m z}dz=\frac{e^{iq_m D_1}-1}{iq_m},\qquad \int_{D_1}^{D}e^{iq_m z}dz=\frac{1-e^{iq_m D_1}}{iq_m}.$$

**Step 4 — 合併(對比 $\rho_1-\rho_2$ 浮現)。**
$$F_m=\frac1{D\,iq_m}\Big[\rho_1(e^{iq_m D_1}-1)+\rho_2(1-e^{iq_m D_1})\Big]=\frac{(\rho_1-\rho_2)}{D\,iq_m}\big(e^{iq_m D_1}-1\big).$$
> **小結**:只有**密度對比** $\Delta\rho=\rho_1-\rho_2$ 才散射(均勻層不貢獻峰)——合理。

**Step 5 — 取模,得 form factor 大小。** $|e^{i\phi}-1|=2|\sin(\phi/2)|$,且 $q_m D_1=\dfrac{2\pi m}{D}D_1=2\pi m\dfrac{D_1}{D}$:
$$|F_m|=\frac{|\rho_1-\rho_2|}{D\,q_m}\cdot2\Big|\sin\frac{q_m D_1}{2}\Big|=\frac{|\rho_1-\rho_2|}{D\,q_m}\cdot2\Big|\sin\!\Big(\pi m\frac{D_1}{D}\Big)\Big|.$$
$$\boxed{|F_m|\ \propto\ \Big|\sin\!\Big(\pi m\,\frac{D_1}{D}\Big)\Big|.}$$

**Step 6 — 代 $D_1/D=1/3$,找零點。**
$$|F_m|\propto\Big|\sin\frac{\pi m}{3}\Big|=0\quad\Longleftrightarrow\quad \frac{m}{3}\in\mathbb Z\quad\Longleftrightarrow\quad m=3,6,9,\dots$$
$$\boxed{\text{故每第三個反射峰}(m=3,6,9,\dots)\text{ 的 form factor 為零,峰消失。}\ \blacksquare}$$

## ✅ 自我檢核
- $\rho_1=\rho_2$ 時 $F_m=0$ 全部 → 無對比無繞射 ✓。
- $D_1/D=1/3$ → 零點 $m=3,6,9$ → **每三峰消一** ✓(與圖(b)箭頭一致)。
- form factor 是「單矩形脈衝寬 $D_1$」的 $\mathrm{sinc}$ 型零點,物理上等同單狹縫繞射的暗紋條件 $D_1\cdot q=2\pi\times$整數 ✓。

## 🔀 變化的可能情況
- **$D_1/D=1/n$** → 每第 $n$ 峰消失(本題 $n=3$ 的推廣)。
- **三成分超晶格**或**漸變界面**:form factor 改由多段積分/含粗糙度 Debye–Waller 因子。
- 與晶體「結構因子消光」(第 3 題 bcc/fcc)是同一招:週期內子結構造成特定階消光。

<details>

**範例 A（D₁/D=1/2，每第二峰消失）**：$|F_m|\propto|\sin(\pi m/2)|$。$m=2,4,6,\dots$ 時 $\sin(\pi m/2)=0$ → 消失；$m=1,3,5$ 時 $|\sin|=1$ → 最強。這正是「對稱方波（占空比 50%）無偶次諧波」的同一數學。

**範例 B（D₁/D=1/4，每第四峰消失）**：$|F_m|\propto|\sin(\pi m/4)|$。零點在 $\pi m/4=\ell\pi\Rightarrow m=4,8,12,\dots$。故消失階為 4 的倍數——一般規律 $D_1/D=1/n\Rightarrow$ 每第 $n$ 峰消失。

**範例 C（用另一層 D₂/D=2/3 驗證一致）**：以 Si 層算，$|F_m|\propto|\sin(\pi m\cdot\tfrac23)|=|\sin(2\pi m/3)|$。零點 $2\pi m/3=\ell\pi\Rightarrow m=\tfrac{3\ell}2$ 為整數 $\Rightarrow m=3,6,9,\dots$ — 與 D₁ 觀點完全相同（因 $\sin(2\pi m/3)$ 與 $\sin(\pi m/3)$ 的零點集合一致）。兩層觀點自洽。

**範例 D（算第一峰的角位置）**：峰位 $q_m=\dfrac{2\pi m}{D}$。設週期 $D=7\,\mathrm{nm}=70\,\text{Å}$，X 光 $\lambda=1.54\,\text{Å}$，由 $q=\dfrac{4\pi}\lambda\sin\theta=q_m$：
$$\sin\theta_m=\frac{q_m\lambda}{4\pi}=\frac{2\pi m\lambda}{4\pi D}=\frac{m\lambda}{2D}=\frac{m\times1.54}{2\times70}=0.011\,m.$$
第一峰 $m=1$：$\theta_1=0.63^\circ$；第二峰 $m=2$：$\theta_2=1.26^\circ$；第三峰 $m=3$ 本應在 $1.89^\circ$ 但 **消失**（form factor 零）。峰等間距出現、每第三個缺。
</details>

  #toc a.active { background: #e8f0f9; color: #1a4d7c; border-left-color: #1a4d7c; font-weight: 600; }
  @media (min-width: 1280px) {
    #toc { transform: none; box-shadow: none; }
    #toc-toggle { display: none; }
    body { margin-left: 290px; }
  }
  @media print { #toc, #toc-toggle { display: none !important; } body { margin-left: auto !important; } }
</style>
<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
