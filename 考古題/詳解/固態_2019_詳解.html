# 固態物理導論 2019 資格考 — 教學版逐題詳解（從普物起建 · 代數不跳步）

> **這份卷的性格**：107 學年（=2019）closed-book，**8 個小題**分四區
> （Crystal structure / Diffraction / Phonons / Electrons），多為**觀念 + 估算**，
> 文字描述為主、幾乎不靠圖。真正會展成長推導的只有 **Q6（單原子鏈聲子，30%）**；
> 其餘是短答／一個小計算。寫法對齊既有模板（`📋原題 → 🎯核心訊息 →(必要時)前情提要/符號說明 →
> 解答 Step → ✅自我檢核 → 🔀變化 → 信心`）。共用觀念見 [`_共用觀念與公式.html`](_共用觀念與公式.html)，本檔只引用、不重抄。

## 🧭 全卷約定
- 2D 用 $\hat e_x$（右）、$\hat e_y$（上）；倒晶格 $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$。
- 自由電子 / 無限井 $E=\hbar^2k^2/2m$；$\hbar=h/2\pi$。
- 單原子鏈：質量 $m$、彈簧常數 $C$、間距 $a$、位移 $u_n$。
- 配分：1(5) · 2(10) · 3(10+5) · 4(10) · 5(10) · 6(10+10+10) · 7(10+5) · 8(5)，共 100%。閉書，符號依 Kittel。

# 📘 第 1 題 — 晶體 vs 液體（Crystal structure · 5%）

## 📋 原題
> What properties make a crystal different from a liquid? (5%)

## 🎯 核心訊息
> 一句話：**晶體有「長程週期序」，液體只有「短程序」**——其餘所有差別（繞射尖峰、各向異性、剛性、熔點）都是這條的後果。

## 解答

晶體與液體的根本差異，是**對稱性與序（order）的層級**：

| 性質 | 晶體（crystal） | 液體（liquid） |
|---|---|---|
| 序 | **長程週期序**（translational + orientational order） | 只有**短程序**（最近鄰大致有序，遠處隨機） |
| 對稱性 | 連續平移/轉動對稱**破缺**，只剩離散晶格對稱 | 保有**完整連續**平移與轉動對稱（統計上均勻、各向同性） |
| 繞射 | 給**離散 Bragg 尖峰**（sharp spots） | 給**寬而散的暈環**（diffuse halo），無尖峰 |
| 各向異性 | **各向異性**（彈性、光學、導電隨方向不同） | **各向同性** |
| 力學 | 有**有限剪切模數**、能抗剪、會解理（cleave）→ 剛性固體 | 靜態剪切模數為 0，會**流動** |
| 相變 | 有**明確熔點**（一階相變、潛熱） | 升溫只是連續變稠/變稀，無結構相變點 |

> **小結**：只要記住「晶體 = 原子排成可無限平移複製的格子」，上表每一格都能當場推出來。

## ✅ 自我檢核
「sharp Bragg peaks ⇔ 長程週期」是繞射的傅立葉鐵律：週期 → 倒空間 δ 函數尖峰；無週期 → 連續寬譜。✓

## 🔀 變化的可能情況
- 常延伸問「**準晶（quasicrystal）**」：有 sharp 繞射尖峰但**無週期**（有長程序、非週期）——介於兩者之間。
- 也可問「玻璃（amorphous）vs 晶體」：玻璃像「凍住的液體」，仍只有短程序、無 Bragg 尖峰。

## 信心：**高**（標準觀念，Kittel Ch1）。

# 📗 第 2 題 — 畫晶格（Crystal structure · 10%）

## 📋 原題
> Draw the lattice for a crystal with the three-atom basis $A=(0,1),\ B=(1,1),\ C=(0,0)$ and the lattice vectors $\mathbf r=(2,1),\ \mathbf s=(1,3)$. Draw in units of cm for an area of $6\times6$ cm and label the atoms A, B, C. (10%)

## 🎯 核心訊息
> **晶體 = 格子（lattice）× 花樣（basis）**。先用 $\mathbf r,\mathbf s$ 撒出格點 $\mathbf R=m\mathbf r+n\mathbf s$，再在「每一個格點」掛上同一組三顆原子（A、B、C 的相對位移固定）。

## 解答

**Step 1 — 算格點座標。**
格點集合
$$\mathbf R=m\,\mathbf r+n\,\mathbf s=m(2,1)+n(1,3)=(2m+n,\ m+3n),\quad m,n\in\mathbb Z.$$
在 $6\times6$ cm 內（含邊界附近）的格點：
$$(0,0),\ (2,1),\ (4,2),\ (6,3),\ (1,3),\ (3,4),\ (5,5),\ (0,5),\ (2,6),\ (5,0),\dots$$

**Step 2 — 在每個格點掛 basis。**
三顆原子相對**同一格點**的位移固定：
$$C\ \text{在}\ \mathbf R+(0,0),\quad A\ \text{在}\ \mathbf R+(0,1),\quad B\ \text{在}\ \mathbf R+(1,1).$$
（題目把 C 取在 $(0,0)$，等於把格點本身畫成 C；A 在其正上方 1 cm，B 在右上 $(1,1)$。）
例如格點 $(0,0)$：$C(0,0),A(0,1),B(1,1)$；格點 $(2,1)$：$C(2,1),A(2,2),B(3,2)$；格點 $(1,3)$：$C(1,3),A(1,4),B(2,4)$。

**Step 3 — 算原胞與密度（自我驗證用）。**
原胞面積
$$|\mathbf r\times\mathbf s|=|2\cdot3-1\cdot1|=\boxed{5\ \text{cm}^2},$$
每個原胞含 **3 顆原子**（=basis 數）→ 面密度 $3/5\ \text{cm}^{-2}=0.6\ \text{atoms/cm}^2$。

**Step 4 — 畫出來。** 下圖：綠=C（即格點）、紅=A、藍=B；黃色平行四邊形是一個原胞（邊為 $\mathbf r,\mathbf s$），虛線是 $6\times6$ 框。

![2019 Q2 lattice](figs/固態_2019_Q2_lattice.png)

> **判讀／自評**：圖中每個綠點（C）就是一個格點 $\mathbf R$；其正上方紅點（A）、右上藍點（B）構成該格點的三原子基元。整個圖 = 同一個「ABC 花樣」沿 $\mathbf r,\mathbf s$ 平移複製。

**範例 A（撒格點：給 $(m,n)$ 求座標）**：本題 $\mathbf R=m(2,1)+n(1,3)=(2m+n,\ m+3n)$。逐一代入：

$(m,n)=(0,0)\Rightarrow(2\cdot0+0,\ 0+3\cdot0)=(0,0)$；

$(m,n)=(1,0)\Rightarrow(2\cdot1+0,\ 1+3\cdot0)=(2,1)$；

$(m,n)=(0,1)\Rightarrow(2\cdot0+1,\ 0+3\cdot1)=(1,3)$；

$(m,n)=(1,1)\Rightarrow(2\cdot1+1,\ 1+3\cdot1)=(3,4)$；

$(m,n)=(2,1)\Rightarrow(2\cdot2+1,\ 2+3\cdot1)=(5,5)$。每個都落在 $6\times6$ 框內 ✓。

**範例 B（原胞面積 = 2×2 行列式）**：把 $\mathbf r=(2,1),\ \mathbf s=(1,3)$ 排成矩陣 $A=\begin{pmatrix}2&1\\1&3\end{pmatrix}$（每列一個向量）。面積

$$|\mathbf r\times\mathbf s|=|\det A|=|\,2\cdot3-1\cdot1\,|=|6-1|=5\ \text{cm}^2.$$

換一組基底驗證不變：取 $\mathbf r'=\mathbf r+\mathbf s=(3,4),\ \mathbf s'=\mathbf s=(1,3)$，$\det\begin{pmatrix}3&4\\1&3\end{pmatrix}=3\cdot3-4\cdot1=9-4=5$ ✓——同一晶格、同一面積，因為換基底矩陣 $\det=1$。

**範例 C（判某點屬於哪個格點 / 是不是同一個 basis）**：問 $(5,5)$ 是不是格點。解 $2m+n=5,\ m+3n=5$：由第一式 $n=5-2m$，代入第二式 $m+3(5-2m)=5\Rightarrow m+15-6m=5\Rightarrow-5m=-10\Rightarrow m=2$，$n=5-4=1$。$m=2,n=1\in\mathbb Z$ → **是格點** $(m,n)=(2,1)$ ✓。再問 A、B 相對位移 $(1,1)$ 是不是格點：解 $2m+n=1,\ m+3n=1$，得 $m=\tfrac{2}{5},\ n=\tfrac{1}{5}\notin\mathbb Z$ → **不是格點** → A、B 確實只是同一 basis 內的兩顆，不是兩個獨立格點 ✓。

**範例 D（面密度與計數）**：一個原胞面積 5 cm²、含 3 顆原子（basis 數）。$6\times6=36\ \text{cm}^2$ 內約有 $36/5=7.2$ 個原胞 → 約 $7.2\times3\approx21.6$，即 21~22 顆原子（邊界顆數依切法微調）。面密度 $=3/5=0.6\ \text{atoms/cm}^2$。
</details>

## ✅ 自我檢核
- 面積行列式 $|2\cdot3-1\cdot1|=5>0$ ✓（$\mathbf r,\mathbf s$ 線性獨立，是合法 primitive vectors）。
- 任兩個同名原子（如兩顆 C）之間位移必為某 $\mathbf R$ ✓；A、B、C 彼此位移 $(0,1),(1,1)$ **不是** $\mathbf R$（不能寫成 $m(2,1)+n(1,3)$ 的整數組合）→ 三顆確實同屬一個 basis，basis = 3 ✓。

## 🔀 變化的可能情況
- 常改成「**求倒晶格 $\mathbf b_1,\mathbf b_2$**」：$\mathbf b_i=2\pi(A^{-1})^{\mathsf T}$，$A=\begin{pmatrix}2&1\\1&3\end{pmatrix}$（見 2025 Q2 同型矩陣法）。
- 或「**數一個原胞內有幾顆原子**」（答 3）、「**畫 Wigner–Seitz cell**」。
- 歷年同型：2024 認 Bravais＋畫 primitive cell；2025 Q1 兩套子晶格疊加判 basis。

## 信心：**高**（格點＋basis 的標準作圖；座標已逐點核對）。

# 📙 第 3 題 — 能量–距離關係（Crystal structure · 10%+5%）

## 📋 原題
> Atoms in a crystal exhibit the energy–distance relation
> $$E(r)=\frac{16\,\text{eV}}{\text{nm}}\left(r^2-2r-7\sqrt{r}\right)\quad(r\text{ in nm}).$$
> **(a)** How much energy does it take to remove an atom from rest position? (10%)
> **(b)** Can this formula predict thermal expansion? Why / why not? (5%)

## 🎯 核心訊息
> **「靜止位置」= 位能極小 $r_0$（$dE/dr=0$）；「移走」= 把它送到自由參考點 $E=0$。** 移走所需能量 = 井深 $|E(r_0)|$。能否描述熱膨脹，只看井**對稱不對稱**：對稱拋物線不行，非對稱（含三次以上項）才行。

## 🔍 符號說明
<details>
<summary><b>▸ 平衡位置 $r_0$、井深、與「非簡諧 ⇒ 熱膨脹」</b></summary>

### 你普物學過的
彈簧位能 $\tfrac12k x^2$ 的底就是平衡點；力 $=-dE/dr$，平衡 ⟺ 力為零 ⟺ $dE/dr=0$。

### 為什麼要這個
鍵能曲線的**極小**＝原子靜止處（rest position）；極小相對「分離開（$E=0$）」的落差＝把原子拔走要的能量（cohesive / binding energy）。井的**形狀**（對稱與否）則決定熱膨脹。

### 定義
- 平衡：$\left.\dfrac{dE}{dr}\right|_{r_0}=0$ 且 $\dfrac{d^2E}{dr^2}\Big|_{r_0}>0$（極小）。
- 移走能量 $=E(\text{free})-E(r_0)=0-E(r_0)=|E(r_0)|$（取 $E=0$ 為「原子已分離」的參考）。
- 把井在 $r_0$ 展開 $E\approx E_0+\tfrac12\kappa(r-r_0)^2+b(r-r_0)^3+\dots$；**$b\neq0$（非簡諧）才有熱膨脹**，平均位移 $\langle r-r_0\rangle\simeq -\dfrac{3b}{\kappa^2}k_BT$。

**範例 1（熱身）**：$E=\tfrac12k(r-r_0)^2$ → 純簡諧 → $\langle r\rangle=r_0$ 與 $T$ 無關 → **無**熱膨脹。
**範例 2（中階）**：Lennard–Jones $4\varepsilon[(\sigma/r)^{12}-(\sigma/r)^6]$ → 井不對稱（左陡右緩）→ 升溫 $\langle r\rangle$ 增 → 膨脹。
**範例 3（本題）**：$E\propto r^2-2r-7\sqrt r$ 非拋物線 → 不對稱 → 可描述熱膨脹（見 (b)）。
</details>

## 解答

### (a) 移走一個原子要多少能量

**Step 1 — 找靜止位置 $r_0$（令一階導為零）。**
$$\frac{dE}{dr}=\frac{16\,\text{eV}}{\text{nm}}\left(2r-2-\tfrac{7}{2}r^{-1/2}\right)=0
\ \Longrightarrow\ 2r-2-\frac{7}{2\sqrt r}=0.$$
這條方程沒有漂亮解析根，數值解：
$$2(2.18)-2-\frac{3.5}{\sqrt{2.18}}=4.36-2-2.371\approx-0.01,\qquad
2(2.19)-2-\frac{3.5}{\sqrt{2.19}}\approx+0.015,$$
夾出 $\boxed{r_0\approx2.18\ \text{nm}}$。
二階導 $\dfrac{d^2E}{dr^2}=\dfrac{16\,\text{eV}}{\text{nm}}\big(2+\tfrac74 r^{-3/2}\big)>0$ 處處成立 → 此點為**唯一極小** ✓。

**Step 2 — 算極小處能量 $E(r_0)$。**
$$r_0^2-2r_0-7\sqrt{r_0}=2.18^2-2(2.18)-7\sqrt{2.18}=4.77-4.36-10.34=-9.94,$$
$$E(r_0)=16\times(-9.94)\ \text{eV}\approx-159\ \text{eV}.$$

**Step 3 — 移走 = 抬到自由參考 $E=0$。**
曲線在 $r\to0$ 與 $r\approx5.1$ nm 各通過一次 $E=0$（解 $r^2-2r-7\sqrt r=0$，即 $\sqrt r(\,r^{3/2}-2\sqrt r-7\,)=0$，非零根 $r\approx5.1$）；$E=0$ 即「原子分離、不再束縛」的能階。故把原子由 $r_0$ 移走所需能量
$$\Delta E=0-E(r_0)=|E(r_0)|\approx\boxed{1.6\times10^{2}\ \text{eV}\ (\approx159\ \text{eV}).}$$
> **小結**：步驟是固定的——**$dE/dr=0$ 定 $r_0$ → 代回得井底 → 與 $E=0$ 的落差就是 binding energy**。（這個 159 eV 數值大得不像真實鍵能，但它純由題目給的係數 16 與括號決定，照算即可。）

下圖示意這個位能井：底在 $r_0$（靜止位置），井底到 $E=0$ 的落差就是「移走一顆原子」要的能量；井**左陡右緩**（非對稱）正是 (b) 能描述熱膨脹的原因。

**範例 A（Lennard–Jones 找平衡距離）**：$E(r)=4\varepsilon\big[(\sigma/r)^{12}-(\sigma/r)^{6}\big]$。求 $r_0$：

$$\frac{dE}{dr}=4\varepsilon\Big[-12\,\sigma^{12}r^{-13}+6\,\sigma^{6}r^{-7}\Big]=0.$$

兩邊除以 $4\varepsilon\cdot6\,r^{-13}$（非零）：$-2\sigma^{12}+\sigma^{6}r^{6}=0\Rightarrow r^{6}=2\sigma^{6}\Rightarrow r_0=2^{1/6}\sigma\approx1.122\,\sigma$。代回求井深：$(\sigma/r_0)^6=\tfrac12$，故 $E(r_0)=4\varepsilon[(\tfrac12)^2-\tfrac12]=4\varepsilon(\tfrac14-\tfrac12)=4\varepsilon(-\tfrac14)=-\varepsilon$ → 結合能 $=\varepsilon$。

**範例 B（本題逐步代入井深）**：$E(r)=16(r^2-2r-7\sqrt r)$ eV，$r_0\approx2.18$。

$r_0^2=2.18^2=4.7524$；

$2r_0=2\times2.18=4.36$；

$7\sqrt{r_0}=7\sqrt{2.18}=7\times1.4765=10.335$。

括號 $=4.7524-4.36-10.335=-9.943$。

$E(r_0)=16\times(-9.943)=-159.1$ eV → 移走能量 $\Delta E=|E(r_0)|\approx159$ eV。

**範例 C（判一個井能不能描述熱膨脹：看三階導）**：純簡諧 $E=\tfrac12\kappa(r-r_0)^2$，$E'''=0$ → 對稱拋物線 → $\langle r\rangle=r_0$ 與 $T$ 無關 → **不能**。本題 $E=16(r^2-2r-7r^{1/2})$：

$$E'=16\big(2r-2-\tfrac72 r^{-1/2}\big),\quad E''=16\big(2+\tfrac74 r^{-3/2}\big),\quad E'''=16\big(-\tfrac{21}{8}r^{-5/2}\big)\ne0$$

→ 非零三階導 → 非簡諧 → **能**描述熱膨脹。平均位移 $\langle r-r_0\rangle\simeq-\dfrac{3b}{\kappa^2}k_BT$，其中 $b=\tfrac16E'''(r_0)<0$，故 $\langle r\rangle>r_0$ 且隨 $T$ 增 → 膨脹。

**範例 D（彈簧常數 = 井底曲率）**：把井在 $r_0$ 二階展開 $E\approx E_0+\tfrac12\kappa(r-r_0)^2$，則 $\kappa=E''(r_0)$。本題 $\kappa=16\big(2+\tfrac74(2.18)^{-3/2}\big)=16\big(2+\tfrac74\times0.3106\big)=16(2+0.5436)=16\times2.544\approx40.7$（eV/nm²）。這個 $\kappa$ 可串到聲子聲速 $v_s=a\sqrt{\kappa/m}$（見 Q6）。
</details>

### (b) 能否預測熱膨脹？

**可以。** 理由：熱膨脹來自位能井的**非簡諧（非對稱）**。本題 $E(r)$ 不是對稱拋物線——把它在 $r_0$ 展開，三階項
$$\frac{d^3E}{dr^3}=\frac{16\,\text{eV}}{\text{nm}}\left(-\tfrac{21}{8}r^{-5/2}\right)<0,$$
非零 → 井**左陡右緩**（小 $r$ 側排斥硬、大 $r$ 側吸引軟）。升溫使振幅變大時，原子在較軟的「大 $r$」側停留時間較長，時間平均位置
$$\langle r\rangle\simeq r_0-\frac{3b}{\kappa^2}k_BT\quad(b=\tfrac16E'''(r_0)<0)\ \Rightarrow\ \langle r\rangle>r_0\ \text{且隨 }T\text{ 增}$$
→ 平均鍵長隨溫度增加 → **晶體膨脹**。
（反例：若 $E$ 是純 $\tfrac12\kappa(r-r_0)^2$，振動對稱、$\langle r\rangle=r_0$ 不隨 $T$ 變，就**無法**預測熱膨脹。）

## ✅ 自我檢核
- 量綱／合理性：$r_0\approx2.18$ nm 落在曲線唯一極小，$E''>0$ ✓。
- 取 $E=0$ 為自由參考是 cohesive energy 的標準定義；井深為正 → 「拔走」要吸能（$\Delta E>0$）合理 ✓。
- (b)：$E'''\neq0$ ⇒ 非簡諧 ⇒ 有熱膨脹，與「簡諧近似無熱膨脹」的課本結論一致 ✓。

## 🔀 變化的可能情況
- 常改成 **Lennard–Jones / Morse** 給定，求平衡距離與結合能（見 2016 Q3 的 $R_0,\ U_0$ 完整極小化）。
- 或反問「**為何簡諧近似下無熱膨脹**」「**熱膨脹係數 $\alpha\propto$ 非簡諧項**」。
- 或加問「彈簧常數 $\kappa=E''(r_0)$ 與聲速 $v=a\sqrt{\kappa/m}$」串到聲子（Q6）。

## 信心：**中高**
（方法（$dE/dr=0$、井深、非簡諧⇒膨脹）完全標準、數值已獨立重算；唯一不確定是題目係數的量綱寫得鬆（$16\,\text{eV/nm}$ 乘上量綱不一致的括號），我採「括號以 nm 為單位的數值、整體乘 $16$ eV」的讀法，得 $r_0\approx2.18$ nm、$\Delta E\approx159$ eV。若閱卷者要求 $E=0$ 以外的參考點，數值會改、但方法不變。）

# 📕 第 4 題 — 電子雙狹縫（Diffraction · 10%）

## 📋 原題
> Electrons can be selectively transmitted through two closely spaced slits（double-slit）。Assuming electrons behave **particle-like** or **wave-like**, how would the electron distribution on a screen behind the double slit look? (10%)

## 🎯 核心訊息
> **粒子像 → 兩坨（兩條亮帶相加，無干涉）；波像 → 干涉條紋（明暗相間）。** 真實電子給的是後者（de Broglie 波），這就是波粒二象性的判決實驗。

## 解答

**(1) 若電子是「粒子」（古典子彈圖像）。**
每個電子只能穿過其中**一條**狹縫，兩縫機率獨立相加。螢幕分布 = 兩個單縫分布之**和**：在兩條狹縫正後方各出現**一坨**（兩條亮帶），中間沒有條紋。
$$P_{\text{particle}}(y)=P_1(y)+P_2(y)\quad(\text{無交叉項、無干涉}).$$

**(2) 若電子是「波」（de Broglie，$\lambda=h/p$）。**
電子以波的形式**同時**通過兩縫，兩路振幅**先相加再取模平方**：
$$P_{\text{wave}}(y)=|\psi_1+\psi_2|^2=P_1+P_2+\underbrace{2\sqrt{P_1P_2}\cos\delta}_{\text{干涉項}}.$$
螢幕出現**明暗相間的干涉條紋**：亮紋條件 $d\sin\theta=n\lambda$，條紋間距 $\Delta y\approx\dfrac{\lambda L}{d}$（$d$=縫距、$L$=縫到屏距離），整體再被單縫繞射包絡調制。

**(3) 真實結果。** 即使一次只放**一個**電子，長時間累積仍堆出**干涉條紋**——電子是波（機率幅疊加），且「哪一縫」資訊一旦被測量，條紋消失。故答案是**波像**：明暗相間條紋。

$$\boxed{\text{粒子像：兩條亮帶相加、無條紋；\ 波像：}\ \Delta y\approx\lambda L/d\ \text{的干涉條紋（實驗為此）}.}$$

## ✅ 自我檢核
$\Delta y=\lambda L/d$ 量綱 ✓；$d\to0$（縫極近）→ 條紋變寬、易觀察，符合題目「closely spaced」設定 ✓。

## 🔀 變化的可能情況
- 量化：給電子動能算 $\lambda=h/\sqrt{2mE}$，再算條紋間距（常見估算延伸）。
- 「which-path / 退相干」：放偵測器知道走哪縫 → 干涉消失（互補原理）。
- 換中子、原子、甚至大分子（C₆₀）都觀測到干涉。

## 信心：**高**（波粒二象標準題）。

# 📒 第 5 題 — 繞射峰移向大角（Diffraction · 10%）

## 📋 原題
> X-ray diffraction：an intensity maximum **shifts to larger angles** after modification of a crystal. Explain the origin of this change and give **two** potential reasons. (10%)

## 🎯 核心訊息
> Bragg $2d\sin\theta=n\lambda$，$\lambda$ 固定。**峰移向大 $\theta$ ⟺ $\sin\theta$ 變大 ⟺ 面間距 $d$ 變小**（晶格收縮）。兩個讓 $d$ 變小的合理原因即可。

## 解答

**起因（origin）。** 由 Bragg 條件
$$2d\sin\theta=n\lambda\quad(\lambda\ \text{固定})\ \Longrightarrow\ \sin\theta=\frac{n\lambda}{2d}.$$
峰角 $\theta$ 變大 ⇒ $\sin\theta$ 變大 ⇒ **繞射面間距 $d$ 變小**——也就是晶格（沿該方向）**收縮**了。所有「modification → 峰右移」的物理，都歸結成「$d$ 減小」。

**兩個可能原因（任選兩個）：**

1. **物理收縮：降溫或加壓。** 晶體**冷卻**（熱收縮，晶格常數隨 $T$ 降而減小）或施加**外壓 / 應力**，使晶格常數 $a$ 變小 → $d=a/\sqrt{h^2+k^2+l^2}$ 變小 → 峰右移。

2. **成分改變：摻入較小的原子。** 以**較小半徑**的原子做置換固溶（合金化 / 摻雜，Vegard's law），平均晶格常數縮小 → $d$ 變小。
   （等價的第三選項：**相變到更緻密的結構**，堆積更密 → $d$ 變小。）

$$\boxed{\text{峰右移 } \Leftrightarrow d\downarrow（晶格收縮）；\ 兩因：①\,降溫/加壓\ ②\,換較小原子/更緻密相}.$$

下圖示意：$\lambda$ 固定下，$d$ 變小 → $\sin\theta=n\lambda/2d$ 變大 → 整個繞射峰往**大角**搬。

$$\frac{\Delta d}{d}+\frac{\cos\theta}{\sin\theta}\,\Delta\theta=0\ \Longrightarrow\ \boxed{\frac{\Delta d}{d}=-\cot\theta\;\Delta\theta.}$$

$$\frac{d_2}{d_1}=\frac{\sin\theta_1}{\sin\theta_2}=\frac{\sin20^\circ}{\sin20.5^\circ}=\frac{0.3420}{0.3502}=0.9766.$$

$d$ 縮了約 2.3%，與「峰右移」一致 ✓。

**範例 C（晶格常數變化 → 哪一面峰移多少）**：立方晶 $d_{hkl}=\dfrac{a}{\sqrt{h^2+k^2+l^2}}$。(100) 面 $d_{100}=a$；若 $a$ 由 $0.400$ nm 降溫縮到 $0.396$ nm（縮 1%），$\lambda=0.154$ nm（Cu Kα）：

原始 $\sin\theta_1=\dfrac{\lambda}{2d_1}=\dfrac{0.154}{2\times0.400}=0.1925\Rightarrow\theta_1=11.10^\circ$；

收縮 $\sin\theta_2=\dfrac{0.154}{2\times0.396}=0.1944\Rightarrow\theta_2=11.21^\circ$。

$\Delta\theta=+0.11^\circ$（右移）✓。所有 (hkl) 都隨 $a$ 同比例縮 → 全部峰右移。

**範例 D（判左移還是右移：升溫 vs 降溫）**：升溫膨脹 $a\uparrow\Rightarrow d\uparrow\Rightarrow\sin\theta=n\lambda/2d\downarrow\Rightarrow\theta\downarrow$ → 峰**左移**。降溫 / 加壓 / 摻小原子 $\Rightarrow d\downarrow\Rightarrow\theta\uparrow$ → 峰**右移**（本題）。記法：$\theta$ 與 $d$ 反向。
</details>

## ✅ 自我檢核
- $\lambda$ 沒變（同一 X 光源），所以只能是 $d$ 在動 ✓。
- 反向檢查：若改成峰**左移**（小角），則 $d$ 變大（升溫膨脹 / 換較大原子），邏輯自洽 ✓。

## 🔀 變化的可能情況
- 改問「峰**變寬**」：晶粒變小（Scherrer 展寬）或微應變增加，與「移位」不同機制。
- 改問「峰**強度**改變」：那是**結構因子 $S_{\mathbf G}$ / 成分 / 溫度因子（Debye–Waller）**，不是峰位置。
- 量化：給 $\Delta\theta$ 反推 $\Delta d/d=-\cot\theta\,\Delta\theta$。

## 信心：**高**（Bragg 微分標準題）。

# 📓 第 6 題 — 單原子鏈聲子（Phonons · 10%+10%+10%）　★本卷重頭推導

## 📋 原題
> 1D chain of **identical masses** connected by **identical springs**.
> **(a)** amplitude ratio and phase between neighboring masses? (10%)
> **(b)** speed of a phonon in this example? (10%)
> **(c)** sketch the relation between propagation speed and oscillation frequency. (10%)

## 🎯 核心訊息
> 一條色散關係 $\omega=2\sqrt{C/m}\,|\sin(ka/2)|$ 全包：**鄰居等振幅、相位差 $ka$**(a)；**聲子速度 = 群速 $v_g=d\omega/dk=a\sqrt{C/m}\cos(ka/2)$**(b)；**速度隨頻率增而降，到 $\omega_{\max}$ 歸零**(c)。

## 📚 前情提要：從牛頓第二定律串到色散關係
### 階段 1（普物）：耦合彈簧
第 $n$ 顆質量只受左右兩彈簧的力，位移 $u_n$。胡克定律：$F_n=C(u_{n+1}-u_n)-C(u_n-u_{n-1})$。
> **留存**：這就是「離散版的波動方程」，鄰居差分取代了二階空間微分。

### 階段 2（試平面波）
週期晶格 ⇒ 試 $u_n=A\,e^{i(kna-\omega t)}$（Bloch 在 1D 的版本）。代入運動方程，所有 $n$ 的方程塌成**一條** $\omega(k)$。
> **留存**：$na$ 是第 $n$ 顆的平衡位置；相鄰只差相位 $e^{ika}$。

### 階段 3（色散關係）
解出 $\omega(k)=2\sqrt{C/m}\,|\sin(ka/2)|$：低 $k$ 線性（聲學支、像聲波），高 $k$ 到布里淵區邊界 $k=\pi/a$ 飽和於 $\omega_{\max}=2\sqrt{C/m}$。
> **留存**：相速 $\omega/k$、群速 $d\omega/dk$ 都從這條長出來；群速才是「聲子跑多快」。

## 🔍 符號說明
<details>
<summary><b>▸ 相速 vs 群速；為何「聲子速度」取群速</b></summary>

### 你普物學過的
波 $y=A\cos(kx-\omega t)$ 的波形以**相速** $v_p=\omega/k$ 前進；但「一包波」（wave packet）攜帶能量/訊號的速度是**群速** $v_g=d\omega/dk$。

### 為什麼要這個
聲子是**一份振動量子**＝局域化的波包，能量輸運速度 = 群速。色散非線性時 $v_p\neq v_g$。

### 定義
$v_p=\dfrac{\omega}{k}$（單一波前），$v_g=\dfrac{d\omega}{dk}$（波包/能量）。長波極限 $k\to0$ 兩者同 → 聲速 $v_s$。

**範例 1（熱身）**：無色散弦 $\omega=v k$ → $v_p=v_g=v$（常數）。
**範例 2（中階）**：本鏈長波 $\omega\approx a\sqrt{C/m}\,k$ → $v_p=v_g=a\sqrt{C/m}=v_s$。
**範例 3（本題）**：區邊界 $k=\pi/a$ → $v_g=0$（駐波）但 $v_p=\dfrac{2\sqrt{C/m}}{\pi/a}\neq0$ → 必須用群速才對。
</details>

## 解答

**Step 0 — 運動方程與色散關係（(a)(b)(c) 共用）。**
第 $n$ 顆質量：
$$m\ddot u_n=C(u_{n+1}-u_n)+C(u_{n-1}-u_n)=C(u_{n+1}+u_{n-1}-2u_n).$$
代入 $u_n=A\,e^{i(kna-\omega t)}$：左邊 $=-m\omega^2 u_n$，右邊 $=C\big(e^{ika}+e^{-ika}-2\big)u_n=C(2\cos ka-2)u_n$。用 $2\cos ka-2=-4\sin^2(ka/2)$：
$$-m\omega^2=-4C\sin^2\!\frac{ka}{2}\ \Longrightarrow\ \boxed{\omega(k)=2\sqrt{\frac{C}{m}}\,\Big|\sin\frac{ka}{2}\Big|.}$$
> **小結**：一個試波 + 一行三角恆等式，就把無限多顆耦合方程壓成一條 $\omega(k)$。

下圖畫出這條色散關係 $\omega(k)$：低 $k$ 線性（聲學支、像聲波），到布里淵區邊界 $k=\pi/a$ 飽和於 $\omega_{\max}=2\sqrt{C/m}$，斜率（=群速）在邊界歸零。

<details>
<summary><b>📝 更多範例（點開）：代試波、求群速/相速、區邊界與長波極限</b></summary>

**範例 A（代試波得色散，每步展開）**：運動方程 $m\ddot u_n=C(u_{n+1}+u_{n-1}-2u_n)$，試 $u_n=A\,e^{i(kna-\omega t)}$。

左邊：$\ddot u_n=(-i\omega)^2 u_n=-\omega^2 u_n$ → $m\ddot u_n=-m\omega^2 u_n$。

右邊三項各除以 $u_n=Ae^{i(kna-\omega t)}$：

$\dfrac{u_{n+1}}{u_n}=e^{ik a}$，$\dfrac{u_{n-1}}{u_n}=e^{-ika}$，$\dfrac{u_n}{u_n}=1$。

所以右邊 $=C\big(e^{ika}+e^{-ika}-2\big)u_n=C(2\cos ka-2)u_n$。

用半角恆等式 $2\cos ka-2=-2(1-\cos ka)=-4\sin^2\tfrac{ka}{2}$：

$$-m\omega^2=-4C\sin^2\tfrac{ka}{2}\Rightarrow\omega=2\sqrt{\tfrac{C}{m}}\big|\sin\tfrac{ka}{2}\big|.$$

**範例 B（求群速，逐步微分）**：$\omega=2\sqrt{C/m}\,\sin\tfrac{ka}{2}$（取 $k>0$ 段）。

$$v_g=\frac{d\omega}{dk}=2\sqrt{\frac{C}{m}}\cdot\frac{d}{dk}\sin\frac{ka}{2}=2\sqrt{\frac{C}{m}}\cdot\cos\frac{ka}{2}\cdot\frac{a}{2}=a\sqrt{\frac{C}{m}}\cos\frac{ka}{2}.$$

代 $k\to0$：$\cos0=1\Rightarrow v_g=a\sqrt{C/m}=v_s$（聲速）。

代 $k=\pi/a$：$\cos\tfrac{\pi}{2}=0\Rightarrow v_g=0$（駐波，能量不傳）。

**範例 C（相速並與群速比較）**：相速 $v_p=\dfrac{\omega}{k}=\dfrac{2\sqrt{C/m}\sin(ka/2)}{k}=a\sqrt{\dfrac{C}{m}}\cdot\dfrac{\sin(ka/2)}{ka/2}$。

長波 $k\to0$：$\dfrac{\sin x}{x}\to1\Rightarrow v_p\to a\sqrt{C/m}=v_s=v_g$（兩者相等）。

區邊界 $k=\pi/a$：$v_p=a\sqrt{C/m}\cdot\dfrac{\sin(\pi/2)}{\pi/2}=a\sqrt{C/m}\cdot\dfrac{1}{\pi/2}=\dfrac{2}{\pi}a\sqrt{C/m}\ne0$，但 $v_g=0$ → 此處 $v_p\ne v_g$，故「聲子速度」必須取群速。

**範例 D（鄰居振幅比與相位）**：$\dfrac{u_{n+1}}{u_n}=\dfrac{Ae^{i((n+1)ka-\omega t)}}{Ae^{i(nka-\omega t)}}=e^{ika}$。振幅比 $|e^{ika}|=1$（等振幅）；相位差 $\arg e^{ika}=ka$。代 $k=\pi/a$：相位差 $=\pi$ → 鄰居反相（一上一下）。代 $k\to0$：相位差 $\to0$ → 鄰居幾乎同相（整段一起晃，像聲波）。
</details>

### (a) 鄰居間的振幅比與相位

由解 $u_n=A\,e^{i(kna-\omega t)}$，相鄰兩顆之比
$$\frac{u_{n+1}}{u_n}=\frac{A\,e^{i((n+1)ka-\omega t)}}{A\,e^{i(nka-\omega t)}}=e^{ika}.$$
- **振幅比**：$\left|\dfrac{u_{n+1}}{u_n}\right|=|e^{ika}|=\boxed{1}$——所有質量**振幅相同**（單原子鏈每顆等價）。
- **相位差**：$\arg\dfrac{u_{n+1}}{u_n}=\boxed{ka}$——鄰居間固定落後/超前 $ka$。
  - 長波 $k\to0$：$ka\to0$，鄰居**幾乎同相**（整段一起晃，像聲波）。
  - 區邊界 $k=\pi/a$：相位差 $=\pi$，鄰居**反相**（一上一下，駐波）。
> **小結**：等振幅、相位差 $=ka$，是「平面波在離散格點上」的直接讀數。

### (b) 聲子的速度

聲子＝波包，速度取**群速**：
$$v_g=\frac{d\omega}{dk}=2\sqrt{\frac{C}{m}}\cdot\frac{a}{2}\cos\frac{ka}{2}=\boxed{a\sqrt{\frac{C}{m}}\,\cos\frac{ka}{2}.}$$
- **長波極限**（$k\to0$，即一般說「聲子/聲波的速度」）：$\cos\to1$，
  $$\boxed{v_s=a\sqrt{\frac{C}{m}}}\quad(\text{此時 }v_g=v_p=\omega/k,\ \text{即聲速}).$$
- **區邊界** $k=\pi/a$：$\cos(\pi/2)=0\Rightarrow v_g=0$ → 駐波，不傳播能量。

> **小結**：「這條鏈的聲子速度」= 群速 $a\sqrt{C/m}\cos(ka/2)$；其長波（聲學）值就是聲速 $v_s=a\sqrt{C/m}$，隨 $k$ 增而減、到區邊界歸零。

### (c) 速度 vs 頻率 的草圖

把 (a)(b) 兩式中的 $k$ 消掉。令 $\omega_{\max}=2\sqrt{C/m}$，則 $\sin(ka/2)=\omega/\omega_{\max}$，$\cos(ka/2)=\sqrt{1-(\omega/\omega_{\max})^2}$，代入 $v_g$：
$$\boxed{v_g=a\sqrt{\frac{C}{m}}\sqrt{1-\Big(\frac{\omega}{\omega_{\max}}\Big)^2}=v_s\sqrt{1-\Big(\frac{\omega}{\omega_{\max}}\Big)^2}.}$$
這是一條**四分之一橢圓（quarter-ellipse）**：$\omega=0$ 時 $v_g=v_s$（最大）；$\omega$ 增加時 $v_g$ **單調下降**；$\omega\to\omega_{\max}=2\sqrt{C/m}$ 時 $v_g\to0$。

![2019 Q6c 群速 vs 頻率](figs/固態_2019_Q6c_vg.png)

> **判讀**：縱軸 $v_g/v_s$、橫軸 $\omega/\omega_{\max}$；曲線從左上 $(0,1)$ 降到右下 $(1,0)$，凹向原點。**低頻聲子跑得快（接近聲速），高頻聲子越跑越慢，到截止頻率成駐波。**

## ✅ 自我檢核
- 量綱：$a\sqrt{C/m}$ 中 $\sqrt{C/m}$ 是頻率（$1/\text{s}$），乘 $a$（長度）→ 速度 ✓。
- 極限：$k\to0$ 給線性色散 $\omega\approx v_s k$、$v_g=v_s$（聲速），與連續彈性介質一致 ✓。
- 區邊界 $v_g=0$、鄰居反相（駐波）三項彼此自洽 ✓。
- $(v_g/v_s)^2+(\omega/\omega_{\max})^2=1$ → 確為四分之一橢圓 ✓。

## 🔀 變化的可能情況
- **雙原子鏈**：開出 optical / acoustic 兩支，區邊界有頻率間隙（常見進階題）。
- 改問**相速** $v_p=\omega/k=v_s\dfrac{\sin(ka/2)}{ka/2}$，或 **DOS** $g(\omega)$（區邊界 $v_g\to0$ → van Hove 發散）。
- 加問「**長波 $\Rightarrow$ 連續彈性波、聲速 $v_s=\sqrt{Y/\rho}$**」把離散接回連續。

## 信心：**高**（單原子鏈為 Kittel Ch4 標準推導，色散/群速/草圖皆完整重算）。

# 📔 第 7 題 — 一維量子井（Electrons · 10%+5%）

## 📋 原題
> 1D quantum well（無限井）。
> **(a)** 1 nm 寬的井，電子由第 2 態落到第 1 態放紅光 $E=1.9$ eV。電子由第 3 態落到第 1 態放出多少能量？(10%)
> **(b)** 若井寬加倍，發光能量如何變化？(5%)

## 🎯 核心訊息
> 無限井 $E_n=n^2E_1$（$E_1=\dfrac{\pi^2\hbar^2}{2mL^2}$）。**用能階比就夠**：$3E_1=1.9$ eV 定出 $E_1$，再算 $8E_1$。寬度進來只影響整體尺度（$\propto1/L^2$）。

## 解答

**Step 0 — 能階公式。** 一維無限深井（寬 $L$）：
$$E_n=\frac{n^2\pi^2\hbar^2}{2mL^2}=n^2E_1,\qquad E_1=\frac{\pi^2\hbar^2}{2mL^2}.$$
躍遷放光 $=\Delta E=(n_i^2-n_f^2)E_1$。

### (a) 第 3 → 第 1 的放光能量

**Step 1 — 用 $2\to1$ 定出 $E_1$。**
$$E_2-E_1=(2^2-1^2)E_1=3E_1=1.9\ \text{eV}\ \Longrightarrow\ E_1=\frac{1.9}{3}\approx0.633\ \text{eV}.$$
**Step 2 — 算 $3\to1$。**
$$E_3-E_1=(3^2-1^2)E_1=8E_1=8\times0.633\ \text{eV}=\boxed{5.07\ \text{eV}\ (\approx5.1\ \text{eV}).}$$
也可直接用比：$\dfrac{E_3-E_1}{E_2-E_1}=\dfrac{8}{3}\Rightarrow (E_3-E_1)=\dfrac83\times1.9=5.07$ eV。

下圖畫出能階 $E_n=n^2E_1$（間距越往上越疏，$1:4:9$）與兩條躍遷：$2\to1$ 放 $3E_1=1.9$ eV，$3\to1$ 放 $8E_1=5.07$ eV。

**範例 A（任意躍遷用能階比）**：$E_n=n^2E_1$，躍遷 $\Delta E_{n_i\to n_f}=(n_i^2-n_f^2)E_1$。已知 $2\to1$ 為 $3E_1=1.9$ eV → $E_1=\tfrac{1.9}{3}=0.6333$ eV。

$3\to2$：$(9-4)E_1=5E_1=5\times0.6333=3.17$ eV；

$4\to1$：$(16-1)E_1=15E_1=15\times0.6333=9.50$ eV；

$3\to1$：$(9-1)E_1=8E_1=8\times0.6333=5.07$ eV ✓（本題）。

**範例 B（井寬加倍：能量 $\times1/4$）**：$E_n=\dfrac{n^2\pi^2\hbar^2}{2mL^2}\propto\dfrac{1}{L^2}$。$L\to2L$：每個 $E_n$、每個 $\Delta E$ 都 $\times\dfrac{1}{(2)^2}=\dfrac14$。

原 $3\to1$ 的 $5.07$ eV → $\dfrac{5.07}{4}=1.27$ eV；原紅光 $1.9$ eV → $\dfrac{1.9}{4}=0.475$ eV（落到紅外）。寬井 → 能階密 → 紅移。

**範例 C（井寬縮一半：能量 $\times4$）**：$L\to L/2$：$\Delta E\times\dfrac{1}{(1/2)^2}=\times4$。原 $1.9$ eV → $7.6$ eV（紫外）。窄井 → 能階疏 → 藍移。

**範例 D（能量 ↔ 波長）**：用 $\lambda=\dfrac{hc}{\Delta E}=\dfrac{1240\ \text{eV·nm}}{\Delta E[\text{eV}]}$。

$\Delta E=1.9$ eV → $\lambda=\dfrac{1240}{1.9}=653$ nm（紅光 ✓）；

$\Delta E=5.07$ eV → $\lambda=\dfrac{1240}{5.07}=245$ nm（紫外）；

加寬後 $\Delta E=0.475$ eV → $\lambda=\dfrac{1240}{0.475}=2611$ nm（近紅外）。能量越小波長越長，全自洽 ✓。
</details>

### (b) 井寬加倍，發光能量怎麼變

$E_n\propto\dfrac{1}{L^2}$，所有能階與所有躍遷能量同比例縮放。$L\to2L$：
$$\Delta E\to\frac{\Delta E}{2^2}=\frac{\Delta E}{4}.$$
$$\boxed{\text{發光能量變為原來的 }\tfrac14（紅移）。}$$
例如原本的紅光 $1.9$ eV → $0.475$ eV（落到紅外）。

## ✅ 自我檢核
- 比例自洽：$E_3-E_1=8E_1$、$E_2-E_1=3E_1$，比 $8/3\approx2.67$ → $5.07/1.9=2.67$ ✓。
- (b) 量綱：$E\propto L^{-2}$，加倍→ $\times1/4$ ✓；越寬的井能階越密、發光越低能，物理合理 ✓。

## 🔀 變化的可能情況
- 改問「**波長**」：$\lambda=hc/\Delta E$（$1240\ \text{eV·nm}/\Delta E$）。
- 給 $L$、$m$ 直接算 $E_1$（用 $\hbar^2/2m=0.0381$ eV·nm²）。

## 信心：**高**（無限井標準題；比例法不依賴 $L$，已雙重檢核）。

# 📚 第 8 題 — 能隙加倍，電子平均能量（Electrons · 5%）

## 📋 原題
> How would the **mean energy of electrons** change if the band-gap in a crystal was somehow doubled? (5%)

## 🎯 核心訊息
> **絕大多數電子在（填滿的）價帶**，價帶能階不因能隙加倍而動；被影響的只有「被熱激發跨越能隙」那極少數電子。故平均能量**幾乎不變**（只微幅下降）。

## 解答

**Step 1 — 誰決定平均能量。** 電子的平均能量由**佔據態**決定，而佔據態的壓倒性多數在**填滿的價帶**。能隙是價帶之上的**空能量區間**；把能隙加倍＝把（幾乎空的）導帶整體往上推，**並不改動價帶已填能階的能量**。

**Step 2 — 被影響的只有熱激發載子。** 唯一受能隙影響的是被熱激發到導帶的電子，其數目
$$n\propto e^{-E_g/2k_BT}.$$
能隙加倍 $E_g\to2E_g$ → 這個指數**急遽變小**，被推到高能導帶的電子變得更少。

**Step 3 — 淨效果。** 高能導帶電子本就佔比 $\sim e^{-E_g/2k_BT}\ll1$；加倍能隙讓它們更少 → 移走了一丁點高能貢獻。
$$\boxed{\text{平均電子能量}\ \textbf{幾乎不變}（僅因熱激發載子變少而微幅下降，量級 }\sim e^{-E_g/2k_BT}）。}$$
（注意：被激發的那少數電子「每顆」其實坐得更高了 $\sim E_g$，但顆數以指數壓過，整體平均仍由不動的價帶主導。）

## ✅ 自我檢核
- 取 $T=0$ 極限：無熱激發，價帶全滿、導帶全空 → 平均能量**完全**不受 $E_g$ 影響 ✓。
- 室溫半導體 $E_g\sim1$ eV $\gg k_BT\approx0.026$ eV → $e^{-E_g/2k_BT}$ 本就極小，修正可忽略 ✓。

## 🔀 變化的可能情況
- 若問的是「**載子濃度 / 本徵載子 $n_i$**」：$n_i\propto e^{-E_g/2k_BT}$ → 加倍能隙使 $n_i$ 指數下降（這才是 $E_g$ 的主要效應）。
- 若問「**導電率**」：$\sigma=ne\mu$ 隨 $n$ 指數下降 → 更像絕緣體。
- 若問「**單顆導帶電子的熱動能**」：非簡併 Boltzmann 下仍 $\sim\tfrac12k_BT$（每自由度），與 $E_g$ 無關。

## 信心：**中**
（題目「mean energy of electrons」措辭含糊，可能指「全體電子平均能量」或「導帶載子平均能量」。我採最穩健的「全體電子」讀法：由填滿價帶主導 → 幾乎不變。若閱卷者指的是**載子數 / 導電率**，則答「指數下降」。兩種讀法的物理我都已列出。）

<script>
function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>

<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
