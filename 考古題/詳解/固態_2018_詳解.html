# 固態物理導論 2018 資格考 — 教學版逐題詳解（從普物起建 · 代數不跳步）

> **這份年份的性格**：5 大題、偏「觀念＋推導」。沒有讀圖題（全卷純文字），但每題的「為什麼」都能展成嚴格推導：Q1 把 band gap 從自由電子一路推到 $E_g=2|U_G|$；Q3 把 Laue 條件、BZ 邊界、bcc 消光串成一條；**Q4 Landau level（20%）是本卷重頭戲**，會用「軌道磁通量子化」（題目提示）與薛丁格解兩條路都推出 $E_n=(n+\tfrac12)\hbar\omega_c$；Q5 用 $E=\hbar v_F|k|$ 與 photon 類比證 massless。寫法同其他年（每題 `📋原題 → 🎯核心訊息 →(必要)前情提要 → 🔍符號說明 → 解答 Step → ✅自我檢核 → 🔀變化 → 信心`）。共用觀念見 [`_共用觀念與公式.html`](_共用觀念與公式.html)。

## 🧭 全卷約定
- **配分**：1(20%)、2(15%)、3(35% = 10+10+15)、4(20%)、5(10%)，合計 100%。
- 電子電荷取 $-e$（$e>0$）；自由電子 $E=\hbar^2k^2/2m$，含自旋簡併 2。
- 倒晶格 $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$；繞射用 $\Delta\mathbf k=\mathbf k'-\mathbf k$。
- 迴旋頻率 $\omega_c=eB/m$；**正常金屬磁通量子 $\Phi_0=h/e$**（與超導的 $h/2e$ 不同，後者因 Cooper pair 帶 $2e$）。
- 符號依 Kittel；$\hbar=h/2\pi$。

# 📘 第 1 題 — 能隙的起源與大小（20%）

## 📋 原題
> **(a)** 用自由電子的簡單模型，解釋晶體結構如何造成 band gap 的存在。(10%)
> **(b)** 說明此能隙如何由晶體中某個位能高度（potential height）決定。(10%)

## 🎯 核心訊息
> 自由電子 $E=\hbar^2k^2/2m$ 連續、沒有 gap。一旦加上**週期位能**，在布里淵區邊界 $k=\pm\pi/a$ 兩個簡併平面波 $e^{\pm i\pi x/a}$ 被位能的 Fourier 分量 $U_G$（$G=2\pi/a$）耦合，混成 $\cos/\sin$ **駐波**，電子密度一個堆在離子上、一個堆在離子間 → 位能不同 → 裂出 gap。定量上 **$\boxed{E_g=2|U_G|}$**：能隙大小 = 位能在該 $G$ 的 Fourier 振幅的兩倍，而 $U_G$ 正比於位能高度。

## 📚 前情提要：從自由電子串到 gap
### 階段 1（普物）：自由電子是連續拋物線
金屬電子近似自由：$E(k)=\hbar^2k^2/2m$，$k$ 連續、能量連續 → **沒有禁帶**。波函數是行進平面波 $e^{ikx}$。
### 階段 2（晶體進場）：位能變成週期函數
真實晶體裡離子排成晶格，電子感到的位能 $U(x)=U(x+a)$ 是週期的，可做 Fourier 展開 $U(x)=\sum_G U_G e^{iGx}$，$G=2\pi n/a$。**只要 $U\neq0$，連續譜就會在 BZ 邊界被撕開。**
> **留存**：gap 不是「材料本性」憑空冒出，而是「週期位能 + 邊界簡併」的必然產物；$U\to0$ 時 gap 連續消失，回到自由電子。

## 🔍 符號說明
<details>
<summary><b>▸ 簡併微擾／central equation／Fourier 分量 $U_G$</b></summary>

### 你普物學過的
兩個能量相同的態，只要有一點耦合 $V$，就會「排斥」分裂成 $\bar E\pm|V|$（avoided crossing）。

### 為什麼要這個
BZ 邊界上 $e^{+i\pi x/a}$ 與 $e^{-i\pi x/a}$ 能量恰好相同（簡併），位能把它們耦合 → 用 **2×2 簡併微擾**就能算出 gap。

### 定義
週期位能 $U(x)=\sum_G U_G e^{iGx}$，$U_G=\dfrac1a\displaystyle\int_0^a U(x)e^{-iGx}\,dx$。把 Bloch 展開代入薛丁格方程得 **central equation**
$$\Big(\tfrac{\hbar^2k^2}{2m}-E\Big)c_k+\sum_G U_G\,c_{k-G}=0.$$

**範例 1（熱身）**：兩態 $\begin{psmallmatrix}\lambda&V\\V^*&\lambda\end{psmallmatrix}$ 本徵值 $\lambda\pm|V|$，分裂 $2|V|$。
**範例 2（中階）**：方形位能壘高 $V_0$、寬 $b$、週期 $a$：$U_G=\dfrac{V_0}{a}\displaystyle\int_0^b e^{-iGx}dx\propto V_0$ → gap $\propto V_0$。
**範例 3（本題）**：$k=\pi/a$，取 $G=2\pi/a$，兩態 $c_{\pi/a},c_{-\pi/a}$，secular 行列式給 $E_\pm=\bar\lambda\pm|U_G|$。
</details>

## 解答

### (a) gap 的起源（自由電子 + 週期位能；定性但完整）

**Step 1 — 邊界上的簡併。**
自由電子在 $k=+\pi/a$ 與 $k=-\pi/a$ 的能量相同：
$$E\big(\tfrac\pi a\big)=E\big(-\tfrac\pi a\big)=\frac{\hbar^2}{2m}\Big(\frac\pi a\Big)^2.$$
這兩個平面波 $e^{+i\pi x/a},\,e^{-i\pi x/a}$ **能量簡併**，且差一個倒晶格向量 $G=2\pi/a$。

**Step 2 — Bragg 反射 → 駐波。**
位能的 Fourier 分量 $U_G$（$G=2\pi/a$）把這兩個行進波耦合（$+\pi/a\xrightarrow{+G}-\pi/a$ 散射）。在邊界，入射波被**Bragg 反射**（$k=\pi/a\Leftrightarrow 2d\sin\theta=\lambda$），正反向等權疊加 → 不再是行進波，而是兩個**駐波**：
$$\psi_+\propto\cos\frac{\pi x}{a},\qquad \psi_-\propto\sin\frac{\pi x}{a}.$$

**Step 3 — 兩駐波位能不同 → 開隙。**
取離子（正電）位於 $x=0,a,2a,\dots$，位能在離子處最低。則
- $|\psi_+|^2\propto\cos^2(\pi x/a)$：電子密度**堆在離子上** → 位能能量**低** → 下能帶頂端。
- $|\psi_-|^2\propto\sin^2(\pi x/a)$：電子密度**堆在離子之間** → 位能能量**高** → 上能帶底端。

兩者動能相同、位能差造成能量差 → 在 $k=\pi/a$ 處原本相接的兩支被撐開一條**禁帶（gap）**。
> **小結**：gap 的根源是「**週期晶格 → 邊界 Bragg 反射 → 駐波分裂**」。沒有週期性（$U_G=0$）就沒有 gap。

### (b) gap 由位能高度決定（定量：$E_g=2|U_G|$）

**Step 1 — 邊界附近只留兩個耦合分量。**
取 $k$ 在 $\pi/a$ 附近，central equation 只保留 $c_k$ 與 $c_{k-G}$（$G=2\pi/a$，故 $k-G\approx-\pi/a$）。記
$$\lambda_1=\frac{\hbar^2k^2}{2m},\qquad \lambda_2=\frac{\hbar^2(k-G)^2}{2m}.$$
兩條耦合方程：
$$(\lambda_1-E)c_k+U_G\,c_{k-G}=0,\qquad (\lambda_2-E)c_{k-G}+U_G^{*}\,c_k=0.$$

**Step 2 — secular 行列式。**
有非零解要求
$$\begin{vmatrix}\lambda_1-E & U_G\\[2pt] U_G^{*} & \lambda_2-E\end{vmatrix}=0
\;\Rightarrow\; (\lambda_1-E)(\lambda_2-E)=|U_G|^2.$$

**Step 3 — 恰在邊界 $k=\pi/a$（$\lambda_1=\lambda_2\equiv\lambda$）。**
$$(\lambda-E)^2=|U_G|^2\;\Rightarrow\; E_\pm=\lambda\pm|U_G|.$$
兩個帶邊：
$$\boxed{E_g=E_+-E_-=2|U_G|.}$$

**Step 4 — 連到「位能高度」。**
$U_G$ 是位能 $U(x)$ 在 $G=2\pi/a$ 的 Fourier 係數
$$U_G=\frac1a\int_0^a U(x)\,e^{-iGx}\,dx,$$
**正比於位能的高度/深度**。例如方形位能壘高 $V_0$、寬 $b$：$U_G=\dfrac{V_0}{a}\dfrac{e^{-iGb}-1}{-iG}$，$|U_G|\propto V_0$，故
$$\boxed{E_g=2|U_G|\propto V_0.}$$
> **小結**：能隙 = 位能該諧波振幅的兩倍。位能愈「高/深」、其 $G$ 諧波愈強，gap 愈大；$V_0\to0$ 則 $E_g\to0$ 回到自由電子。這與 Kronig–Penney 弱勢結果 gap $\propto P\propto V_0$ 完全一致。

<summary><b>📝 更多範例（點開）：算 $U_G$、求 $E_g$、判 gap 隨參數的變化</b></summary>

**範例 A（方形位能壘求 $|U_G|$ 與 $E_g$）**：設一維週期位能在每個原胞 $[0,a)$ 內為高度 $V_0$、寬 $b$ 的方壘（$0\le x<b$ 處 $U=V_0$，其餘為 0）。取 $G=2\pi/a$，傅立葉係數
$$U_G=\frac1a\int_0^a U(x)e^{-iGx}\,dx=\frac{V_0}{a}\int_0^b e^{-iGx}\,dx.$$
逐步積分：$\displaystyle\int_0^b e^{-iGx}dx=\Big[\frac{e^{-iGx}}{-iG}\Big]_0^b=\frac{e^{-iGb}-1}{-iG}=\frac{1-e^{-iGb}}{iG}.$
故 $U_G=\dfrac{V_0}{a}\cdot\dfrac{1-e^{-iGb}}{iG}$。取模長：$|1-e^{-iGb}|=2\big|\sin\tfrac{Gb}{2}\big|$，所以
$$|U_G|=\frac{V_0}{aG}\cdot 2\Big|\sin\frac{Gb}{2}\Big|=\frac{2V_0}{aG}\Big|\sin\frac{Gb}{2}\Big|.$$
能隙 $E_g=2|U_G|=\dfrac{4V_0}{aG}\big|\sin\tfrac{Gb}{2}\big|$，確實 $\propto V_0$（位能高度），且 $V_0\to0\Rightarrow E_g\to0$ ✓。

**範例 B（高階 gap 比較大小）**：第 $n$ 個 gap 開在 $k=n\pi/a$，由 $G_n=2\pi n/a$ 的諧波決定，$E_g^{(n)}=2|U_{G_n}|$。沿用範例 A 的方壘（取 $b=a/2$，半滿）：$G_n b=\dfrac{2\pi n}{a}\cdot\dfrac a2=\pi n$，故 $\big|\sin\tfrac{G_n b}{2}\big|=\big|\sin\tfrac{\pi n}{2}\big|$。
- $n=1$：$\sin\tfrac\pi2=1$，$|U_{G_1}|=\dfrac{2V_0}{a\,G_1}=\dfrac{2V_0}{a}\cdot\dfrac{a}{2\pi}=\dfrac{V_0}{\pi}$ → $E_g^{(1)}=\dfrac{2V_0}{\pi}$。
- $n=2$：$\sin\pi=0$ → $|U_{G_2}|=0$ → $E_g^{(2)}=0$（此特定 $b=a/2$ 下第二 gap 消失！）。
- $n=3$：$\sin\tfrac{3\pi}{2}=-1$，$|U_{G_3}|=\dfrac{2V_0}{a\,G_3}=\dfrac{2V_0}{a}\cdot\dfrac{a}{6\pi}=\dfrac{V_0}{3\pi}$ → $E_g^{(3)}=\dfrac{2V_0}{3\pi}=\tfrac13 E_g^{(1)}$。
結論：諧波振幅隨 $n$ 變小（這裡 $\propto 1/n$），高階 gap 一般更窄；甚至可因 $\sin$ 為零而出現「缺失的 gap」——這就是結構因子式的消光（連到第 3 題）。

**範例 C（給 $|U_G|$ 反求帶邊能量）**：邊界 $k=\pi/a$ 自由電子能量 $\lambda=\dfrac{\hbar^2}{2m}\big(\tfrac\pi a\big)^2$。設 $|U_G|=0.5$ eV、$\lambda=4$ eV。由 Step 3 的 $E_\pm=\lambda\pm|U_G|$：
$$E_-=4-0.5=3.5\ \text{eV}\ (\text{下帶頂}),\qquad E_+=4+0.5=4.5\ \text{eV}\ (\text{上帶底}),$$
$$E_g=E_+-E_-=4.5-3.5=1.0\ \text{eV}=2|U_G|\ ✓.$$
若位能加深一倍（$|U_G|=1.0$ eV）：$E_-=3$、$E_+=5$、$E_g=2.0$ eV——gap 隨位能高度線性放大，與 $E_g=2|U_G|$ 完全一致。

</details>

## ✅ 自我檢核
- $U_G\to0\Rightarrow E_g\to0$（回自由電子）✓。
- 量綱：$[U_G]=$ 能量，$E_g=2|U_G|$ 量綱對 ✓。
- 物理圖像自洽：駐波 $\cos$ 密度在離子上能量低、$\sin$ 在離子間能量高，差 $=2|U_G|$ ✓（Kittel Ch7 標準結果）。

## 🔀 變化的可能情況
- 常改問「**高階 gap**」：第 $n$ 個 gap 在 $k=n\pi/a$，大小 $=2|U_{nG}|$（高諧波更弱 → 高階 gap 更小）。
- 或要求**完整 Kronig–Penney** $\delta$-勢推 gap（見 2016 第 4 題：$E_g=2\hbar^2P/ma^2$）。
- 或問「金屬 vs 絕緣體」：gap 與費米能相對位置決定。

## 信心：**高**（簡併微擾／central equation 標準推導，Kittel Ch7）。

# 📗 第 2 題 — 聲子能帶 vs 電子能帶：k 與動量的差異（15%）

## 📋 原題
> 固體中聲子的能帶結構與電子的能帶有「相似但不同」的特徵。請以**布里淵區中的動量（momentum）或 $\mathbf k$ 向量**為角度，指出並解釋兩者的差異。(15%)

## 🎯 核心訊息
> **相似**：兩者都有色散關係（$\omega(\mathbf k)$ vs $E(\mathbf k)$）、都在倒空間呈週期、$\hbar\mathbf k$ 都是**晶體動量**（不是真動量、只在 mod $\mathbf G$ 下守恆，可限於第一 BZ）。
> **關鍵不同**：聲子的位移場**只定義在離散原子位置上**，$k$ 與 $k+G$ 給出**完全相同**的原子運動（aliasing）→ 第一 BZ 之外沒有新資訊 → **分支數有限 = $3p$**（$p$=原胞原子數）。電子波函數 $\psi=e^{ikx}u_k(x)$ 是**連續函數**，$k$ 與 $k+G$ 是不同函數 → 折回 BZ 需用能帶指標 $n=1,2,3,\dots$ → **能帶無限多**。

## 🔍 符號說明
<details>
<summary><b>▸ 晶體動量、分支數、與「離散取樣 → aliasing」</b></summary>

### 你普物學過的
取樣定理：只在離散點上取樣一個波，$k$ 與 $k+\tfrac{2\pi}{\Delta x}$ 看起來一模一樣（混疊 aliasing）。

### 為什麼要這個
聲子是「原子位移波」，原子只在格點 → 天生離散取樣 → 第一 BZ 已含全部資訊；電子波函數住在連續空間 → 無此限制。

### 定義
- 聲子（單原子鏈）位移 $u_n=A\,e^{i(kna-\omega t)}$，只對整數 $n$ 有定義。
- 電子 Bloch 態 $\psi_k(x)=e^{ikx}u_k(x)$，對所有連續 $x$ 有定義。
- 原胞含 $p$ 個原子 → 聲子分支 $3p$（3 acoustic + $3p{-}3$ optical）。

**範例 1（熱身）**：1D 單原子鏈，$p=1$ → **1 條 acoustic 分支**，$\omega(k)=2\sqrt{C/M}\,|\sin(ka/2)|$，週期 $2\pi/a$。
**範例 2（中階）**：1D 雙原子鏈，$p=2$ → **1 acoustic + 1 optical**（共 2 分支）。
**範例 3（本題）**：3D、原胞 $p$ 原子 → 聲子 $3p$ 條（有限）；電子 → 無限多能帶。
</details>

## 解答

### Step 1 — 先說「相似」的部分（兩者共通）
1. 兩者都有**色散關係**：聲子 $\omega(\mathbf k)$、電子 $E(\mathbf k)$，在倒空間都以 $\mathbf G$ 為週期 $\big(\omega(\mathbf k{+}\mathbf G)=\omega(\mathbf k)\big)$。
2. 兩者的 $\hbar\mathbf k$ 都是**晶體動量**，不是真實機械動量；散射時只守恆到 **mod $\hbar\mathbf G$**（Umklapp 過程可吸收 $\hbar\mathbf G$）。
3. 因此兩者的 $\mathbf k$ 都可**限制在第一布里淵區**內標記。

### Step 2 — 關鍵差異①：分支數有限（聲子）vs 無限（電子）
聲子的位移只定義在離散格點 $x=na$。把 $k\to k+G$（$G=2\pi/a$）代入：
$$e^{i(k+G)na}=e^{ikna}\,\underbrace{e^{iGna}}_{=\,e^{i2\pi n}=1}=e^{ikna}.$$
**$k$ 與 $k+G$ 給出完全相同的原子位移**——第一 BZ 之外是冗餘（aliasing）。所以每個偏振只有第一 BZ 內的 $k$ 是獨立的，分支數受原胞自由度鎖死為
$$\boxed{\text{聲子分支數}=3p\ (\text{有限})=3\,\text{acoustic}+(3p-3)\,\text{optical}.}$$
反觀電子：$\psi_k(x)=e^{ikx}u_k(x)$ 是**連續** $x$ 的函數，$e^{iGx}\neq1$（一般 $x$），故 $\psi_{k+G}\neq\psi_k$。把所有 $k$ 折回第一 BZ 時，原本 $k+G,k+2G,\dots$ 的態變成同一 $k$ 上的**不同能帶** $n=1,2,3,\dots$：
$$\boxed{\text{電子能帶數}=\infty\ (\text{reduced-zone scheme})。}$$

### Step 3 — 關鍵差異②：能量上界與 $k\to0$ 行為
- **聲子**：$\omega(\mathbf k)$ 有**上界**（Debye 截止 $\omega_D$）；acoustic 分支在 $\mathbf k\to0$ 時 $\omega\to0$（線性 $\omega=v_s|k|$，是平移對稱破缺的 Goldstone 模，長波即聲速）。
- **電子**：$E(\mathbf k)$ **無上界**（往上無限多帶）；在 $\mathbf k\to0$ 一般是**有限能量**的拋物線底（$E\approx E_0+\hbar^2k^2/2m^*$）。

### Step 4 — 關鍵差異③：統計（附帶，影響佔據而非 $k$ 本身）
聲子是**玻色子**（每模可佔任意多個，無 Pauli 限制）；電子是**費米子**（每態至多 2 個、填到費米面）。這決定熱佔據 $n(\omega)=1/(e^{\hbar\omega/k_BT}-1)$ vs $f(E)=1/(e^{(E-\mu)/k_BT}+1)$，但兩者的 $\mathbf k$ 都一樣限在 BZ。
> **小結**：一句話——**都活在第一 BZ、$\hbar k$ 都是晶體動量；但聲子因「離散取樣」只有 $3p$ 條有界分支，電子因「連續波函數」有無限多無界能帶**。

**範例 A（數聲子分支數 $3p$）**：規則「每原胞 $p$ 個原子 → $3p$ 條聲子分支，其中 3 條 acoustic、$3p-3$ 條 optical」。

- NaCl（rock-salt，原胞 $p=2$）：同樣 $3p=6$ → 3 acoustic + 3 optical。
- 鑽石的 $p=2$、石英 SiO₂ 原胞 $p=9$：$3p=27$ 條 → 3 acoustic + 24 optical。
口訣：acoustic 永遠 3 條（對應原胞整體的 3 個剛體平移方向），其餘全是 optical。

**範例 B（聲子總模數 vs 電子總態數）**：取 $N$ 個原胞、每胞 $p$ 原子。
- 聲子：每胞 $3p$ 自由度，$N$ 胞共 $3pN$ 個振動模 → 每條分支在第一 BZ 內含 $N$ 個 $k$ 點（$\frac{3pN}{3p}=N$）。Debye 模型即用「總模數 $=3pN$」定截止頻率。
- 電子：每條能帶在第一 BZ 內也含 $N$ 個 $k$ 點，乘自旋 2 → 每帶 $2N$ 個態。要填 $Z$ 個價電子/胞，共 $ZN$ 電子 → 填滿 $\frac{ZN}{2N}=\frac Z2$ 條帶。$Z$ 為偶數時剛好填滿整數條帶（可能絕緣體），奇數時半滿（金屬）。對比看出：聲子「模數」鎖死在 $3pN$，電子「態數」可隨能帶指標無限往上加。

**範例 C（aliasing：$k$ 與 $k+G$ 給相同原子運動）**：單原子鏈位移 $u_n=A\,e^{i(kna-\omega t)}$。把 $k\to k+G$（$G=2\pi/a$）：
$$u_n'=A\,e^{i((k+G)na-\omega t)}=A\,e^{i(kna-\omega t)}\,e^{iG na}=u_n\cdot e^{i(2\pi/a)\,na}=u_n\cdot e^{i2\pi n}.$$
因 $n$ 為整數，$e^{i2\pi n}=1$，故 $u_n'=u_n$ 對**所有原子完全相同** → $k$ 與 $k+G$ 描述同一振動。數值驗證：取 $a=1$、$k=\tfrac{\pi}{2}$ 與 $k'=k+2\pi=\tfrac{5\pi}{2}$，在 $n=3$ 處相位差 $=(k'-k)\cdot3=2\pi\times3=6\pi$，$e^{i6\pi}=1$ → 同一位移 ✓。這就是為何第一 BZ 之外是冗餘，分支數封頂 $3p$。

## ✅ 自我檢核
- 1D 單原子鏈確實只有 1 條 acoustic 分支、週期 $2\pi/a$、最高頻在 $k=\pi/a$ ✓。
- aliasing 推導：$e^{iG na}=1$ 因 $Ga=2\pi$ ✓。
- 電子 reduced-zone 無限帶、聲子 $3p$ 有限分支，為 Kittel Ch4（聲子）/Ch7（電子）標準對照 ✓。

## 🔀 變化的可能情況
- 常改問「**為何聲子有 acoustic/optical、電子沒有這種分類**」：因聲子 $\mathbf k\to0$ 必有 3 條 $\omega\to0$（剛體平移），電子無此約束。
- 或問「**總態數**」：聲子總模數 $=3pN$（$N$ 原胞）；電子每帶 $2N$ 個態。
- 或要求畫「1D 雙原子鏈」的兩分支與 gap（在 $k=\pi/a$ optical-acoustic gap）。

## 信心：**高**（核心是「離散取樣→分支數 $3p$ 有限」與「晶體動量限 BZ」，Kittel/Ashcroft–Mermin 標準論點；題目開放，已涵蓋分支數、能量界、$k\to0$、統計四面向）。

# 📙 第 3 題 — 繞射條件、BZ 邊界、結構因子與 bcc 消光（35%）

## 📋 原題
> **(a)** 證明 $\Delta\mathbf k=\mathbf G$ 是晶體的 X 光繞射條件。(10%)
> **(b)** 證明 $\Delta\mathbf k=\mathbf G$ 同時也是 $\mathbf k$ 空間中**布里淵區邊界**上的條件。（提示：用倒晶格的 Wigner–Seitz cell 來建構 BZ。）(10%)
> **(c)** 但若考慮晶格的對稱性，$\Delta\mathbf k=\mathbf G$ 並不保證繞射峰存在。請用原子形狀因子 $f_j$、$\mathbf G$ 向量與基元，導出結構因子 $S_{\mathbf G}$；並證明 **bcc 晶格的 (100)、(111) 或 (300) 峰不存在**。(15%)

## 🎯 核心訊息
> 一條主線：**(a) Laue $\Delta\mathbf k=\mathbf G$**（倒晶格決定峰**位置**）→ **(b)** 把它改寫成 $\mathbf k\cdot\hat{\mathbf G}=G/2$，正是倒晶格 $\mathbf G$ 的**中垂面** = BZ 邊界（WS cell）→ **(c)** basis 透過**結構因子** $S_{\mathbf G}=\sum_j f_j e^{i\mathbf G\cdot\mathbf r_j}$ 決定峰**強度**；bcc 體心原子與角原子在 $h{+}k{+}l$ 為奇時**反相相消** → (100)(111)(300) 全消光。

## 📚 前情提要：從雙狹縫到 Laue
### 階段 1（普物）：雙狹縫，路徑差 = 整數波長才亮。
晶體繞射是其三維版：每個原子是散射源，散射波相位差決定建設/破壞性干涉。
### 階段 2（傅立葉）：實空間週期 $a$ ↔ 倒空間 $2\pi/a$。
電子密度 $n(\mathbf r)$ 週期 → $n(\mathbf r)=\sum_G n_G e^{i\mathbf G\cdot\mathbf r}$，只有「動量轉移 = 倒晶格向量」的傅立葉分量能建設性干涉。
> **留存**：峰**位置**只看 lattice（倒晶格）；峰**強度/消光**才看 basis（結構因子）。這正是 (a)(b) vs (c) 的分工。

## 🔍 符號說明
<details>
<summary><b>▸ Laue 條件、中垂面=BZ 邊界、結構因子</b></summary>

### 你普物學過的
建設性干涉：相位差 = $2\pi\times$ 整數。

### 為什麼要這個
(a) 要把它寫成 $\Delta\mathbf k=\mathbf G$；(b) 要看出 $\mathbf k\cdot\hat G=G/2$ 是「$\mathbf G$ 中垂面」；(c) 要用 $S_{\mathbf G}$ 算消光。

### 定義
散射振幅 $F=\displaystyle\int n(\mathbf r)\,e^{-i\Delta\mathbf k\cdot\mathbf r}\,d^3r$，$\Delta\mathbf k=\mathbf k'-\mathbf k$，彈性 $|\mathbf k'|=|\mathbf k|$。
結構因子 $S_{\mathbf G}=\sum_j f_j\,e^{i\mathbf G\cdot\mathbf r_j}$，$\mathbf r_j$ 為基元內原子座標。

**範例 1（熱身）**：單原子簡單立方，basis 1 → $S_{\mathbf G}=f$（所有 $hkl$ 都在）。
**範例 2（中階）**：fcc（4 原子 basis）→ $S=4f$（$hkl$ 全奇或全偶），否則 0。
**範例 3（本題）**：bcc（2 原子 basis $(000),(\tfrac12\tfrac12\tfrac12)$）→ $S=f[1+(-1)^{h+k+l}]$。
</details>

## 解答

### (a) 繞射條件 $\Delta\mathbf k=\mathbf G$（完整推導）

**Step 1 — 散射振幅。**
入射平面波 $e^{i\mathbf k\cdot\mathbf r}$、出射 $e^{i\mathbf k'\cdot\mathbf r}$，電子密度 $n(\mathbf r)$ 為散射源。第一 Born 近似下總散射振幅
$$F=\int n(\mathbf r)\,e^{i(\mathbf k-\mathbf k')\cdot\mathbf r}\,d^3r=\int n(\mathbf r)\,e^{-i\Delta\mathbf k\cdot\mathbf r}\,d^3r,\qquad \Delta\mathbf k\equiv\mathbf k'-\mathbf k.$$

**Step 2 — 用週期性展開 $n$。**
晶體 $n(\mathbf r)=n(\mathbf r+\mathbf R)$，故 $n(\mathbf r)=\sum_{\mathbf G}n_{\mathbf G}\,e^{i\mathbf G\cdot\mathbf r}$（$\mathbf G$=倒晶格向量）。代入：
$$F=\sum_{\mathbf G}n_{\mathbf G}\int e^{i(\mathbf G-\Delta\mathbf k)\cdot\mathbf r}\,d^3r.$$

**Step 3 — 積分只在 $\Delta\mathbf k=\mathbf G$ 不為零。**
$\displaystyle\int e^{i(\mathbf G-\Delta\mathbf k)\cdot\mathbf r}\,d^3r=V\,\delta_{\mathbf G,\Delta\mathbf k}$（無限晶體為 $\delta$ 函數）。故 $F\neq0$ 要求
$$\boxed{\Delta\mathbf k=\mathbf k'-\mathbf k=\mathbf G.}\qquad(\text{Laue 條件})$$

**Step 4 — 彈性 → 等價形。**
由 $|\mathbf k'|=|\mathbf k|$ 與 $\mathbf k'=\mathbf k+\mathbf G$：
$$|\mathbf k+\mathbf G|^2=|\mathbf k|^2\;\Rightarrow\;2\mathbf k\cdot\mathbf G+G^2=0\;\Rightarrow\;\boxed{2\mathbf k\cdot\mathbf G=-G^2}\;\Leftrightarrow\;2\mathbf k\cdot(-\mathbf G)=G^2.$$
（$\mathbf G$ 與 $-\mathbf G$ 都是倒晶格向量，故常寫成 $2\mathbf k\cdot\mathbf G=G^2$。）
> **小結**：繞射 = 「動量轉移 $\Delta\mathbf k$ 剛好是一個倒晶格向量」。等價 Bragg：$|\mathbf G|=2\pi n/d$、$|\Delta\mathbf k|=2k\sin\theta$ → $2d\sin\theta=n\lambda$。

### (b) $\Delta\mathbf k=\mathbf G$ ⟺ BZ 邊界（Wigner–Seitz of reciprocal lattice）

**Step 1 — 改寫 Laue 條件。**
由 (a) 的 $2\mathbf k\cdot\mathbf G=G^2$ 兩邊除以 $2|\mathbf G|$：
$$\mathbf k\cdot\frac{\mathbf G}{|\mathbf G|}=\frac{|\mathbf G|}{2}\;\Longrightarrow\;\boxed{\mathbf k\cdot\hat{\mathbf G}=\frac{G}{2}.}$$
**Step 2 — 幾何意義：$\mathbf G$ 的中垂面。**
$\mathbf k\cdot\hat{\mathbf G}=G/2$ 表示「$\mathbf k$ 在 $\hat{\mathbf G}$ 方向的投影 = $G/2$」。這正是**通過 $\mathbf G/2$、垂直於 $\mathbf G$ 的平面**（亦即連接原點與倒晶格點 $\mathbf G$ 的線段之**垂直平分面**）。

**Step 3 — 中垂面 = BZ 邊界（WS 建構）。**
倒晶格的 **Wigner–Seitz cell（= 第一布里淵區）** 的造法：以原點為中心，對每個倒晶格點 $\mathbf G$ 作原點–$\mathbf G$ 連線的**垂直平分面**，這些面圍出的區域就是 BZ。
- BZ 邊界上的點 $\mathbf k$ 恰好滿足 $\mathbf k\cdot\hat{\mathbf G}=G/2$（Step 1 的條件）。
故
$$\boxed{\Delta\mathbf k=\mathbf G\ (\text{繞射}) \iff \mathbf k\ \text{落在 BZ 邊界（最短 }\mathbf G\text{ 的中垂面）}.}$$
> **小結**：繞射條件與 BZ 邊界是**同一個方程** $\mathbf k\cdot\hat G=G/2$ 的兩種讀法——一個講「波被晶面反射」，一個講「$\mathbf k$ 觸到能帶邊界」。這也是為何 gap 開在 BZ 邊界（第 1 題）。

### (c) 結構因子與 bcc (100)/(111)/(300) 消光

**Step 1 — 把 basis 放進振幅。**
一個原胞內有若干原子在 $\mathbf r_j$，各帶原子形狀因子 $f_j$。在 $\Delta\mathbf k=\mathbf G$ 已滿足的前提下，**胞內各原子的相位疊加**給出結構因子：
$$S_{\mathbf G}=\sum_j f_j\,e^{i\mathbf G\cdot\mathbf r_j}.$$
寫 $\mathbf G=h\mathbf b_1+k\mathbf b_2+l\mathbf b_3$、$\mathbf r_j=x_j\mathbf a_1+y_j\mathbf a_2+z_j\mathbf a_3$，用 $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$：
$$\mathbf G\cdot\mathbf r_j=2\pi(hx_j+ky_j+lz_j)\;\Rightarrow\;\boxed{S_{hkl}=\sum_j f_j\,e^{\,i2\pi(hx_j+ky_j+lz_j)}.}$$
（峰存在 ⟺ $S_{hkl}\neq0$；$S_{hkl}=0$ 即「消光」。）

**Step 2 — bcc 在慣用立方座標下的 basis。**
用**慣用立方胞**描述 bcc：等價於簡單立方晶格 + **2 原子基元**
$$\mathbf r_1=(0,0,0),\qquad \mathbf r_2=\big(\tfrac12,\tfrac12,\tfrac12\big),$$
同種原子 $f_1=f_2=f$。

**Step 3 — 代入算 $S_{hkl}$。**
$$S_{hkl}=f\Big[e^{i2\pi(0)}+e^{i2\pi(\frac h2+\frac k2+\frac l2)}\Big]=f\Big[1+e^{i\pi(h+k+l)}\Big].$$
用 $e^{i\pi(h+k+l)}=(e^{i\pi})^{h+k+l}=(-1)^{h+k+l}$：
$$\boxed{S_{hkl}=f\big[1+(-1)^{h+k+l}\big]=\begin{cases}2f,& h+k+l\ \text{偶}\\[2pt]0,& h+k+l\ \text{奇}\end{cases}}$$

**Step 4 — 檢驗 (100)、(111)、(300)。**
- **(100)**：$h+k+l=1+0+0=1$（奇）→ $S=0$ → **消光，峰不存在** ✓
- **(111)**：$h+k+l=1+1+1=3$（奇）→ $S=0$ → **消光** ✓
- **(300)**：$h+k+l=3+0+0=3$（奇）→ $S=0$ → **消光** ✓
$$\boxed{\text{bcc 的 (100)、(111)、(300) 因 }h+k+l\text{ 為奇而全部消光。}}$$
> **小結**：物理上，體心原子 $(\tfrac12\tfrac12\tfrac12)$ 相對角原子多走相位 $\pi(h+k+l)$；當 $h+k+l$ 為奇，兩者**恰好反相（相差 $\pi$）相消**。等價說法：bcc 的真實倒晶格是 fcc，$h+k+l$ 為奇的立方指標點根本不是 bcc 的倒晶格點，本就不會繞射。

$$S_{hkl}=f_A\cdot e^{i2\pi(0)}+f_B\cdot e^{i\pi(h+k+l)}=f_A+f_B(-1)^{h+k+l}=\begin{cases}f_A+f_B,& h+k+l\ \text{偶}\\ f_A-f_B,& h+k+l\ \text{奇}\end{cases}$$

- (a) $\Delta k\to0$（$\mathbf G=0$）給前向散射（非繞射峰）；非零 $\mathbf G$ 才是繞射峰 ✓。
- (b) $\mathbf k\cdot\hat G=G/2\le|\mathbf k|$ → 需 $|\mathbf k|\ge G/2$ 才碰得到邊界，與「波長夠短才繞射」一致 ✓。
- (c) bcc **允許**的最低幾個峰：(110)、(200)、(211)…（$h+k+l$ 偶）；**禁止**：(100)(111)(300)(210)…（奇）。與實驗 powder pattern 一致 ✓。

## 🔀 變化的可能情況
- 常把 (c) 換成 **fcc 消光**（混合奇偶消光，(100)(110) 不見、(111)(200) 見）或 **diamond**（(200) 消光）。
- 或問 (b) 的反向：「為何 gap 開在 BZ 邊界」——同一條件 $\mathbf k\cdot\hat G=G/2$。
- 或要求由 $S_{hkl}$ 反推 **lattice type**（給消光規則認晶格）。
- **歷年同型**：2016 第 1 題 bcc/fcc/diamond 全套結構因子；2025 第 2 題消光。

# 📕 第 4 題 — Landau levels（磁場下費米面）★本卷重頭戲（20%）

## 📋 原題
> 請**定性並盡量定量**地解釋：在磁場 $\mathbf B$ 下，費米面上 Landau level 的存在。（提示：電子的軌道、以及該軌道在實空間所包含的磁通量是量子化的。）(20%)

## 🎯 核心訊息
> 磁場讓電子在垂直 $B$ 的平面內做**迴旋（cyclotron）圓周運動**；量子化後，原本連續的橫向能量塌縮成離散、高度簡併的 **Landau levels**
> $$\boxed{E_n=\Big(n+\tfrac12\Big)\hbar\omega_c+\frac{\hbar^2k_z^2}{2m},\quad \omega_c=\frac{eB}{m}.}$$
> 題目提示的「軌道磁通量子化」是半古典路徑：實空間軌道包住的磁通 $\Phi=(n+\gamma)\Phi_0$，$\Phi_0=h/e$。在費米面上，這些 level 凝聚成 **Landau 管**，隨 $B$ 掃過費米面 → de Haas–van Alphen 振盪。

## 📚 前情提要：從迴旋運動到量子化
### 階段 1（普物）：磁場中的圓周運動
帶電 $-e$ 粒子在 $\mathbf B$ 中受 Lorentz 力，做半徑 $r$、角頻率 $\omega_c$ 的圓周。力平衡 $mv^2/r=evB$ → $r=mv/eB$、$\omega_c=v/r=eB/m$。
### 階段 2（舊量子論）：軌道要「裝得下整數個波」
Bohr–Sommerfeld：$\oint p\,dq=(n+\gamma)h$。把它用在迴旋軌道，就把連續能量切成離散 Landau levels。
> **留存**：能量量子化的兩條等價路：① 解薛丁格方程 → 諧振子；② 半古典軌道量子化 → 磁通量子化。兩者都給 $(n+\tfrac12)\hbar\omega_c$。

## 🔍 符號說明
<details>
<summary><b>▸ 諧振子、正則動量、磁通量子 $\Phi_0=h/e$</b></summary>

### 你普物學過的
量子諧振子 $E_n=(n+\tfrac12)\hbar\omega$；磁通 $\Phi=\int\mathbf B\cdot d\mathbf S$。

### 為什麼要這個
Landau 問題在 Landau gauge 下**就是一個諧振子**；半古典路要用正則動量 $\mathbf p=m\mathbf v-e\mathbf A$ 與 Stokes 把線積分換成磁通。

### 定義
正則動量 $\mathbf p=m\mathbf v+q\mathbf A$（$q=-e$）；$\oint\mathbf A\cdot d\mathbf r=\int(\nabla\times\mathbf A)\cdot d\mathbf S=\Phi$；磁通量子 $\Phi_0=h/e$。

**範例 1（熱身）**：1D 諧振子 $H=\tfrac{p^2}{2m}+\tfrac12m\omega^2x^2$ → $E_n=(n+\tfrac12)\hbar\omega$。
**範例 2（中階）**：Bohr–Sommerfeld 對無限井 $\oint p\,dx=2pL=nh$ → $E_n=n^2h^2/8mL^2$。
**範例 3（本題）**：迴旋軌道 $\oint\mathbf p\cdot d\mathbf r=(n+\gamma)h$ → 磁通 $\Phi=(n+\gamma)\Phi_0$ → $E_n=(n+\tfrac12)\hbar\omega_c$。
</details>

## 解答

### Part A — 定性圖像（Landau level 是什麼）
無磁場時，垂直平面內電子能量 $\tfrac{\hbar^2(k_x^2+k_y^2)}{2m}$ 連續。加上 $\mathbf B=B\hat z$ 後：
1. Lorentz 力使電子在 $xy$ 平面繞**迴旋圓**（頻率 $\omega_c=eB/m$），沿 $z$ 仍自由。
2. 圓周運動量子化 → 橫向能量變成**離散等間距**的 Landau levels，間距 $\hbar\omega_c$。
3. 原本均勻分布在 $k_x k_y$ 平面的態，**塌縮**到一條條離散能級上 → 每個 level **高度簡併**（簡併度 = 穿過樣品的磁通量子數，見 Part C）。
4. 在費米面上：3D 時態凝聚成沿 $k_z$ 的同心 **Landau 管**；$B$ 增大時管子脹大、依序掃過費米面 → 物理量對 $1/B$ 週期振盪（de Haas–van Alphen / Shubnikov–de Haas）。

### Part B — 定量推導 ①：解薛丁格方程（Landau gauge）

**Step 1 — Hamiltonian。** 電荷 $-e$，最小耦合 $\mathbf p\to\mathbf p+e\mathbf A$：
$$H=\frac{1}{2m}\big(\mathbf p+e\mathbf A\big)^2,\qquad \mathbf B=B\hat z.$$
**Step 2 — 選規範。** Landau gauge $\mathbf A=(0,\,Bx,\,0)$（驗證 $\nabla\times\mathbf A=B\hat z$ ✓）：
$$H=\frac{1}{2m}\Big[p_x^2+(p_y+eBx)^2+p_z^2\Big].$$
**Step 3 — 分離變數。** $p_y,p_z$ 與 $H$ 對易 → 取 $\psi=e^{i(k_yy+k_zz)}\phi(x)$，$p_y\to\hbar k_y$、$p_z\to\hbar k_z$：
$$H\phi=\Big[\frac{p_x^2}{2m}+\frac{1}{2m}(\hbar k_y+eBx)^2+\frac{\hbar^2k_z^2}{2m}\Big]\phi.$$
**Step 4 — 認出諧振子。** 把中間項整理：
$$\frac{1}{2m}(eB)^2\Big(x+\frac{\hbar k_y}{eB}\Big)^2=\frac12 m\omega_c^2\,(x-x_0)^2,\quad \omega_c=\frac{eB}{m},\ x_0=-\frac{\hbar k_y}{eB}.$$
這是**中心在 $x_0$、頻率 $\omega_c$ 的 1D 諧振子**（外加沿 $z$ 的自由動能）。
**Step 5 — 寫能譜。**
$$\boxed{E_{n,k_z}=\Big(n+\tfrac12\Big)\hbar\omega_c+\frac{\hbar^2k_z^2}{2m},\qquad n=0,1,2,\dots}$$
2D（或固定 $k_z$）時即 $E_n=(n+\tfrac12)\hbar\omega_c$。
> **小結**：磁場把橫向自由度變成諧振子，這就是 Landau level 的來源；level 不依賴 $k_y$ → 巨大簡併。

### Part C — 定量推導 ②：軌道磁通量子化（題目提示的路）

**Step 1 — Bohr–Sommerfeld。** 對閉合迴旋軌道，正則動量環積分量子化：
$$\oint \mathbf p\cdot d\mathbf r=(n+\gamma)h,\qquad \mathbf p=m\mathbf v-e\mathbf A\ (q=-e).$$
**Step 2 — 拆成兩段。**
$$\oint \mathbf p\cdot d\mathbf r=\underbrace{\oint m\mathbf v\cdot d\mathbf r}_{\text{動力學}}-e\underbrace{\oint\mathbf A\cdot d\mathbf r}_{=\,\Phi}.$$
其中 $\oint\mathbf A\cdot d\mathbf r=\int(\nabla\times\mathbf A)\cdot d\mathbf S=\int\mathbf B\cdot d\mathbf S=\Phi$（軌道包住的磁通，Stokes 定理）。
**Step 3 — 動力學項。** 圓軌道 $\oint m\mathbf v\cdot d\mathbf r=mv\cdot(2\pi r)$；由力平衡 $mv=eBr$，且 $\Phi=B\pi r^2$：
$$\oint m\mathbf v\cdot d\mathbf r=(eBr)(2\pi r)=2eB\pi r^2=2e\Phi.$$
**Step 4 — 合併 → 磁通量子化。**
$$\oint\mathbf p\cdot d\mathbf r=2e\Phi-e\Phi=e\Phi=(n+\gamma)h\;\Rightarrow\;\boxed{\Phi=(n+\gamma)\frac{h}{e}=(n+\gamma)\,\Phi_0,\quad \Phi_0=\frac he.}$$
這正是提示說的「軌道所含磁通量子化」（注意是 $h/e$，非超導的 $h/2e$）。
**Step 5 — 由 $\Phi$ 回推能量。** $\Phi=B\pi r_n^2=(n+\gamma)\tfrac he$ →
$$r_n^2=(n+\gamma)\frac{h}{\pi eB}=(n+\gamma)\frac{2\hbar}{eB}\quad(\,h=2\pi\hbar\,).$$
能量 $E=\tfrac12mv^2=\tfrac12m\big(\tfrac{eBr_n}{m}\big)^2=\dfrac{e^2B^2r_n^2}{2m}$，代入 $r_n^2$：
$$E_n=\frac{e^2B^2}{2m}\cdot(n+\gamma)\frac{2\hbar}{eB}=(n+\gamma)\frac{eB\hbar}{m}=(n+\gamma)\hbar\omega_c.$$
取 WKB 的 $\gamma=\tfrac12$（Maslov 指標）：
$$\boxed{E_n=\Big(n+\tfrac12\Big)\hbar\omega_c.}\quad(\text{與 Part B 完全一致})$$
> **小結**：兩條獨立路（薛丁格解／半古典磁通量子化）給同一答案，互相驗證。

### Part D — 簡併度（每個 Landau level 裝幾個態）
2D 面積 $A=L_xL_y$。軌道中心 $x_0=-\hbar k_y/eB$，$k_y=2\pi n_y/L_y$ 離散，$x_0$ 須落在 $[0,L_x]$。相鄰 $x_0$ 間距
$$\Delta x_0=\frac{\hbar}{eB}\Delta k_y=\frac{\hbar}{eB}\frac{2\pi}{L_y}.$$
可容納數目
$$D=\frac{L_x}{\Delta x_0}=\frac{L_xL_y\,eB}{2\pi\hbar}=\frac{eB\,A}{h}=\frac{\Phi_{\text{tot}}}{\Phi_0}.$$
$$\boxed{D=\frac{eBA}{h}=\frac{\text{樣品總磁通}}{\Phi_0}\;(\text{= 穿過樣品的磁通量子數}).}$$
> **小結**：簡併度 = 樣品裡塞進幾個磁通量子；$B$ 愈大、每個 level 容量愈大、level 數愈少。

### Part E — 連回費米面（Onsager / dHvA）
半古典下，$k$ 空間軌道（等能線）所圍**面積**量子化（Onsager）：
$$A_n=(n+\gamma)\frac{2\pi eB}{\hbar}.$$
$B$ 增大時 $A_n$ 等比放大，依序與費米面極值截面 $A_{\text{ext}}$ 相切；每次相切，磁化率/電阻出現一次振盪，對 $1/B$ 呈週期
$$\Delta\!\Big(\frac1B\Big)=\frac{2\pi e}{\hbar\,A_{\text{ext}}}.$$
量這週期即得費米面極值截面 → **de Haas–van Alphen** 正是「Landau level 在費米面上」的可觀測後果。

即每個 level 可裝約 $2.4\times10^{10}$ 個態（每 $\text{cm}^2$）。等價檢查：單位面積簡併度 $\dfrac{eB}{h}=\dfrac{(1.60\times10^{-19})(1)}{6.63\times10^{-34}}=2.41\times10^{14}\ \text{m}^{-2}=2.41\times10^{10}\ \text{cm}^{-2}$ ✓。把 $B$ 加倍 → 每 level 容量加倍、填滿的 level 數減半，這正是量子霍爾「填充因子 $\nu$ 隨 $1/B$ 變」的來源。

$$A_{\text{ext}}=\frac{1.005\times10^{-18}}{2.11\times10^{-37}}=4.76\times10^{18}\ \text{m}^{-2}.$$

# 📒 第 5 題 — Dirac point 線性色散 ⇒ massless（10%）

## 📋 原題
> 舉一個固態系統為例，其能帶色散在所謂 **Dirac points** 附近（費米能附近）為**線性**；並證明這種線性色散的能帶電子可視為**無質量粒子**，與光子類比。(10%)

## 🎯 核心訊息
> 例子：**石墨烯（graphene）**。在六角 BZ 角落 K、K′（Dirac points），色散為 $\boxed{E=\pm\hbar v_F|\mathbf q|}$（$v_F\approx10^6$ m/s，$\mathbf q$ 由 Dirac 點量起）。這與光子 $E=\hbar c|\mathbf k|$ **同形**（$v_F\leftrightarrow c$）；對照相對論 $E=\sqrt{(pc)^2+(mc^2)^2}$，**線性且無 gap ⟺ 靜止質量 $m=0$**。等效質量也驗證：迴旋質量 $m_c=E/v_F^2\to0$（Dirac 點）、曲率質量 $\to\infty$，都說明它不是普通有質量粒子，而由 **2D 無質量 Dirac 方程** $H=v_F\,\boldsymbol\sigma\cdot\mathbf p$ 描述。

## 📚 前情提要：光子為何無質量
相對論能量–動量關係 $E^2=(pc)^2+(mc^2)^2$。光子 $m=0\Rightarrow E=pc$（線性、無 gap）。**反過來：任何線性、過原點無 gap 的色散，都對應 $m=0$。** 石墨烯把這條搬到固態，只是「光速」換成費米速度 $v_F$。
> **留存**：「線性色散 + 無 gap」是 massless 的招牌。

## 🔍 符號說明
<details>
<summary><b>▸ 群速、等效質量（曲率/迴旋）、相對論色散</b></summary>

### 你普物學過的
$E=pc$（光子）；$E=p^2/2m$（非相對論，有質量）。

### 為什麼要這個
要用三種「質量」定義檢查線性色散：曲率質量 $1/m^*=\hbar^{-2}d^2E/dk^2$、迴旋質量 $m_c=\tfrac{\hbar^2}{2\pi}\partial A/\partial E$、以及相對論 rest mass。

### 定義
群速 $v_g=\hbar^{-1}dE/dk$；曲率質量 $\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dk^2}$；迴旋質量 $m_c=\dfrac{\hbar^2}{2\pi}\dfrac{\partial A(E)}{\partial E}$。

**範例 1（熱身）**：拋物線 $E=\hbar^2k^2/2m$ → $v_g=\hbar k/m$、$m^*=m$（常數）。
**範例 2（中階）**：能帶頂 $d^2E/dk^2<0$ → $m^*<0$ → 用電洞描述。
**範例 3（本題）**：線性 $E=\hbar v_F|q|$ → $v_g=v_F$（常數！）、$d^2E/dq^2=0$（曲率質量發散）、$m_c=E/v_F^2\to0$。
</details>

## 解答

### Step 1 — 舉例與線性色散
**石墨烯**：碳原子排成蜂巢晶格（三角 Bravais + 2 原子 basis）。緊束縛計算給出能帶在六角 BZ 的角點 **K、K′（Dirac points）** 相接，且費米能恰落在接觸點。展開到一階：
$$\boxed{E(\mathbf q)=\pm\hbar v_F\,|\mathbf q|,\qquad \mathbf q=\mathbf k-\mathbf K,\quad v_F\approx1\times10^6\ \text{m/s}.}$$
$+$ 為導帶（電子）、$-$ 為價帶（電洞），兩個錐面在 $E=0$ 尖點相觸 → **Dirac cone**。

### Step 2 — 與光子類比（核心證明）
光子：$E=\hbar c|\mathbf k|=c\,p$（$p=\hbar k$），**線性、無質量**。
石墨烯：$E=\hbar v_F|\mathbf q|=v_F\,p$（$p=\hbar q$ 為從 Dirac 點量起的晶體動量）。
**兩式同形，只把 $c\to v_F$。** 再對照相對論
$$E=\sqrt{(pc)^2+(mc^2)^2}\ \xrightarrow{\ c\to v_F\ }\ E=\sqrt{(pv_F)^2+(mv_F^2)^2}.$$
石墨烯實測色散**嚴格線性、在 Dirac 點無 gap**，要讓上式退化成 $E=v_F p$，必須
$$mv_F^2=0\;\Rightarrow\;\boxed{m=0\ (\text{靜止質量為零，massless})。}$$
反證：若 $m\neq0$，會在 $q=0$ 開一條 gap $E_g=2mv_F^2$，與「兩錐相觸無 gap」矛盾。

### Step 3 — 等效質量檢核（兩種定義都指向「非普通質量」）
**(i) 曲率質量發散。** $\dfrac{d^2E}{dq^2}=0$（線性）→ $\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dq^2}=0$ → $m^*\to\infty$。拋物線型的「曲率質量」對線性色散**失效**，說明它不是一般有效質量粒子。
**(ii) 迴旋（動力學）質量 → 0。** $k$ 空間等能圓面積 $A(E)=\pi q^2=\pi\big(\tfrac{E}{\hbar v_F}\big)^2$，
$$m_c=\frac{\hbar^2}{2\pi}\frac{\partial A}{\partial E}=\frac{\hbar^2}{2\pi}\cdot\frac{2\pi E}{\hbar^2 v_F^2}=\frac{E}{v_F^2}.$$
這正是 $E=m_c v_F^2$（$E=mc^2$ 的固態版）：載子的質量純由能量提供，**在 Dirac 點 $E\to0$ 時 $m_c\to0$** → 靜止質量為零。
> **小結**：群速恆為 $v_F$（與能量無關，像光速恆為 $c$）、靜止質量為零 → 石墨烯 Dirac 電子是「速度 $v_F$ 的光」。其嚴格描述是 **2D 無質量 Dirac/Weyl 方程** $H=v_F\,\boldsymbol\sigma\cdot\mathbf p$，本徵能 $E=\pm v_F|\mathbf p|$。

與 $q$（即與能量）**完全無關**——不論電子能量多高，速度都是 $v_F\approx10^6$ m/s。對比普通拋物線 $E=\hbar^2q^2/2m$：$v_g=\hbar^{-1}\cdot\hbar^2q/m=\hbar q/m$ 隨 $q$ 線性增大。「速度恆定」正是「像光子」的核心——光子 $v_g=\hbar^{-1}d(\hbar c k)/dk=c$ 同理恆為 $c$。

$$A(E)=\pi q^2=\pi\Big(\frac{E}{\hbar v_F}\Big)^2=\frac{\pi E^2}{\hbar^2 v_F^2}.$$
對 $E$ 微分：$\dfrac{\partial A}{\partial E}=\dfrac{\pi}{\hbar^2 v_F^2}\cdot 2E=\dfrac{2\pi E}{\hbar^2 v_F^2}$。代入迴旋質量定義
$$m_c=\frac{\hbar^2}{2\pi}\frac{\partial A}{\partial E}=\frac{\hbar^2}{2\pi}\cdot\frac{2\pi E}{\hbar^2 v_F^2}=\frac{E}{v_F^2}.$$
這就是 $E=m_c v_F^2$（$E=mc^2$ 的固態版）。數值：費米能 $E_F=0.1$ eV $=1.6\times10^{-20}$ J、$v_F=10^6$ m/s：$m_c=\dfrac{1.6\times10^{-20}}{(10^6)^2}=1.6\times10^{-32}$ kg $\approx0.018\,m_e$——很輕，且 $E\to0$ 時 $m_c\to0$（靜止質量為零）✓。

$$E_n=\text{sgn}(n)\,v_F\sqrt{2e\hbar B\,|n|},\qquad n=0,\pm1,\pm2,\dots$$
逐項看：
- $n=0$：$E_0=0$——**Dirac 點上必有一條零能級**（普通拋物線型沒有，這是石墨烯反常量子霍爾的關鍵）。
- $n=1$：$E_1=v_F\sqrt{2e\hbar B}$；$n=2$：$E_2=v_F\sqrt{4e\hbar B}=\sqrt2\,E_1$——間距 $\propto\sqrt n$ 遞減，與普通 Landau level 的等間距 $\hbar\omega_c$ 截然不同。

function renderMarkdownWithMath(md) {
  const mathBlocks = [];
  function escapeHtmlChars(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, m => {
    let clean = m.replace(/\n\s*>\s*/g, '\n');
    mathBlocks.push(escapeHtmlChars(clean));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  md = md.replace(/\$([^\$\n]+?)\$/g, m => {
    mathBlocks.push(escapeHtmlChars(m));
    return '@@MATHBLK' + (mathBlocks.length-1) + '@@';
  });
  let html = marked.parse(md);
  html = html.replace(/@@MATHBLK(\d+)@@/g, (_, i) => mathBlocks[parseInt(i,10)]);
  return html;
}
window.addEventListener('DOMContentLoaded', () => {
  const md = document.getElementById('md-source').textContent;
  document.getElementById('content').innerHTML = renderMarkdownWithMath(md);
  document.getElementById('content').style.display = '';
  const loading = document.getElementById('loading');
  document.querySelectorAll('details').forEach(d => {
    d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.rendered) {
        d.dataset.rendered = '1';
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([d]);
      }
    });
  });
  function typeset() {
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([document.getElementById('content')])
        .then(() => { loading.style.display = 'none'; })
        .catch(e => { loading.textContent = 'MathJax error: ' + e; });
    } else setTimeout(typeset, 300);
  }
  typeset();
});
</script>
<!-- toc-sidebar -->
<button id="toc-toggle" type="button" aria-label="開關目錄">☰ 目錄</button>
<nav id="toc" aria-label="本頁目錄"></nav>
<style>
  #toc-toggle { position: fixed; top: 12px; left: 12px; z-index: 1001; background: #1a4d7c; color: #fff;
    border: none; border-radius: 6px; padding: 6px 11px; font-size: 0.9em; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25); opacity: 0.9; }
  #toc-toggle:hover { opacity: 1; }
  #toc { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; overflow-y: auto; box-sizing: border-box;
    background: #f4f8fc; border-right: 1px solid #c5d5e5; padding: 3.4em 0.7em 2em; z-index: 1000;
    transform: translateX(-100%); transition: transform 0.2s ease; font-size: 0.9em; }
  #toc.open { transform: translateX(0); box-shadow: 2px 0 14px rgba(0,0,0,0.15); }
  #toc .toc-title { font-weight: 700; color: #1a4d7c; font-size: 1.0em; margin: 0 0 0.5em; padding: 0 0.4em; }
  #toc a { display: block; text-decoration: none; color: #34506b; padding: 3px 0.5em; border-radius: 4px;
    line-height: 1.4; border-left: 2px solid transparent; }
  #toc a:hover { background: #e3eef8; color: #1a4d7c; }
  #toc a.h3 { padding-left: 1.5em; font-size: 0.92em; color: #5d728a; }
  #toc a.h4 { padding-left: 2.7em; font-size: 0.86em; color: #6f8197; }
  #toc a.active { background: #e8f0f9; color: #1a4d7c; border-left-color: #1a4d7c; font-weight: 600; }
  @media (min-width: 1280px) {
    #toc { transform: none; box-shadow: none; }
    #toc-toggle { display: none; }
    body { margin-left: 290px; }
  }
  @media print { #toc, #toc-toggle { display: none !important; } body { margin-left: auto !important; } }
</style>
<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
