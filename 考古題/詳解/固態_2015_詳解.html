# 📘 第 1 題 — Bragg 與 von Laue 繞射的等價（6 pts）

## 📋 原題
> What are Bragg and von Laue formulations of x-ray diffraction by a crystal? Demonstrate the equivalence of the Bragg and von Laue formulations.

## 🎯 核心訊息
> 兩種說法描述**同一件事**：X 光被晶體建設性散射。**Bragg** 把它看成「晶面像鏡子反射、相鄰面路徑差 $=n\lambda$」；**von Laue** 把它看成「動量轉移 $\Delta\mathbf k$ 必須等於某倒晶格向量 $\mathbf G$」。只要代入 $|\mathbf G|=2\pi n/d$ 與彈性散射幾何，兩式互推 → 等價。

## 解答

### Step 1 — 寫下兩種敘述
- **Bragg**：晶體視為一族間距 $d$ 的平行晶面，X 光在相鄰面的鏡反射路徑差 $2d\sin\theta$；建設性干涉要求
$$\boxed{2d\sin\theta=n\lambda}\qquad(n\in\mathbb Z),$$
$\theta$ 為**掠射角**（入射線與晶面夾角）。
- **von Laue**：散射為**彈性**，$|\mathbf k'|=|\mathbf k|=k=\dfrac{2\pi}\lambda$；建設性干涉要求動量轉移等於倒晶格向量
$$\boxed{\Delta\mathbf k=\mathbf k'-\mathbf k=\mathbf G},\qquad \mathbf G=h\mathbf b_1+k\mathbf b_2+l\mathbf b_3.$$

### Step 2 — 由 von Laue 推 Bragg
彈性 $|\mathbf k|=|\mathbf k'|$，畫等腰三角形：$\mathbf k\to\mathbf k'$ 夾角 $2\theta$，則
$$|\Delta\mathbf k|=2k\sin\theta=\frac{4\pi}\lambda\sin\theta.$$
倒晶格向量大小與面間距的關係（標準結果）：對應 $(hkl)$ 面族的最短 $\mathbf G$ 滿足
$$|\mathbf G|=\frac{2\pi}{d_{hkl}},\quad\text{一般地 } |\mathbf G_n|=\frac{2\pi n}{d}\ (\mathbf G_n=n\mathbf G_{\min}).$$
代入 $|\Delta\mathbf k|=|\mathbf G_n|$：
$$\frac{4\pi}\lambda\sin\theta=\frac{2\pi n}{d}\ \Longrightarrow\ 2d\sin\theta=n\lambda.\qquad\blacksquare$$
> **小結**：「$\Delta\mathbf k=\mathbf G$」這一條，配上彈性幾何 $|\Delta\mathbf k|=2k\sin\theta$ 和 $|\mathbf G|=2\pi n/d$，就**逐字變成** Bragg。

### Step 3 — 物理意義對應
- $\mathbf G\perp$ 晶面（倒晶格向量恆垂直其對應晶面）⇒ von Laue 的「$\Delta\mathbf k=\mathbf G$」幾何上正是「對該晶面做鏡反射」⇒ 與 Bragg 的鏡面圖像一致。
- $\mathbf G$ 的「第 $n$ 諧波」$n\mathbf G_{\min}$ ↔ Bragg 的 $n$ 階繞射。
$$\boxed{\text{兩式描述同一倒晶格條件；峰位置相同。}}$$

**範例 A（單晶 Bragg 反算面間距）**：Cu Kα，$\lambda=1.54$ Å，某 $(hkl)$ 面在 $\theta=22^\circ$ 出現一階峰（$n=1$）。由 $2d\sin\theta=n\lambda$：$d=\dfrac{n\lambda}{2\sin\theta}=\dfrac{1\times1.54}{2\sin22^\circ}$。$\sin22^\circ=0.3746$，分母 $=2\times0.3746=0.7492$，故 $d=\dfrac{1.54}{0.7492}=2.056$ Å。檢核：若是 fcc 的 $(111)$ 面、$d_{111}=a/\sqrt3$，則 $a=\sqrt3\,d=1.732\times2.056=3.56$ Å，與 Cu 的 $a\approx3.61$ Å 同量級 ✓。

**範例 B（最大可繞射階數）**：同 $\lambda=1.54$ Å，$d=2.056$ Å。$\sin\theta=\dfrac{n\lambda}{2d}\le1\Rightarrow n\le\dfrac{2d}\lambda=\dfrac{2\times2.056}{1.54}=2.670$。$n$ 取整數 → $n_{\max}=2$。逐一驗：$n=2$ 給 $\sin\theta=\dfrac{2\times1.54}{2\times2.056}=\dfrac{3.08}{4.112}=0.749\Rightarrow\theta=48.5^\circ$（合法）；$n=3$ 給 $\sin\theta=1.124>1$（不存在）。故只看得到一、二階。

**範例 C（von Laue 端反推同一峰）**：用動量空間驗範例 A。$k=\dfrac{2\pi}\lambda=\dfrac{2\pi}{1.54}=4.080$ Å$^{-1}$。一階繞射 $|\mathbf G|=\dfrac{2\pi}d=\dfrac{2\pi}{2.056}=3.056$ Å$^{-1}$。彈性散射 $|\Delta\mathbf k|=2k\sin\theta=2\times4.080\times\sin22^\circ=2\times4.080\times0.3746=3.057$ Å$^{-1}$。兩者相等（差在四捨五入）✓ → von Laue 條件 $\Delta\mathbf k=\mathbf G$ 與 Bragg 同一峰，逐位互印證。
</details>

## ✅ 自我檢核
- 量綱：$2d\sin\theta$ 與 $n\lambda$ 同為長度 ✓；$\Delta k$ 與 $G$ 同為 $[\text{長度}]^{-1}$ ✓。
- 極限：$\lambda>2d_{\max}$ 時 $\sin\theta>1$ 無解 ⇒ 不繞射，對應 von Laue「最短 $|\mathbf G|>2k$」✓。

## 🔀 變化的可能情況
- 常接著問「**Ewald 球**作圖」：半徑 $k$ 的球，球面通過倒晶格點即滿足繞射。
- 或問「為何峰**強度**不同」→ 那是**結構因子** $S_\mathbf G$（basis 造成的消光），與峰**位置**（倒晶格）分開。2016 Q1 即把這兩件事一起考。

## 信心：**高**（標準等價證明，Kittel Ch2）。

# 📗 第 2 題 — 晶體結構與倒晶格（24 pts）　★本卷結構重頭戲

## 📋 原題
> (a) primitive cell 是什麼？[1]　(b) Wigner–Seitz primitive cell 是什麼？[1]
> (c) 寫下 2D 的五種 Bravais lattice（可用軸＋角度的圖描述）[3]；證明它們的 WS cell 不是六邊形就是矩形 [1]。
> (d) Fig.1 為 fcc。以 $\mathbf a=a\hat x,\mathbf b=a\hat y,\mathbf c=a\hat z$ 為基底時 (100)(110)(111) 如上定義；若改用 Fig.1 的 $\mathbf a',\mathbf b',\mathbf c'$ 為新基底，這三個面的新指標各為何？[3]
> (e) 把 $\mathbf a',\mathbf b',\mathbf c'$ 改名為 $\mathbf a_1,\mathbf a_2,\mathbf a_3$，用 $\hat x,\hat y,\hat z$ 寫出它們 [1]。
> (f) 構造對應倒晶格 $\mathbf b_1,\mathbf b_2,\mathbf b_3$（需計算）[2]。　(g) fcc 的 packing fraction？[2]
> (h) fcc 在倒空間的晶格結構為何？[2]
> (i) Fig.2 為 hcp。選適當 primitive vectors，證明其倒晶格亦為 **simple hexagonal**，晶格常數 $2\pi/c$ 與 $4\pi/\sqrt3 a$，且相對實晶格繞 c 軸轉 $30^\circ$ [2]。
> (j) $c/a$ 為何值時，實晶格與倒晶格的此比值相同？[2] 理想 $c/a$ 為何？[2] 若 $c/a$ 取理想值，它在倒晶格中是多少？[2]

## 🎯 核心訊息
> 三條主線：①**換基底**只改「指標的表示」、不改「平面本身」——用 $h'_j=\frac1{2\pi}\mathbf G\cdot\mathbf a_j$ 一行算完 (d)。②**fcc 的倒晶格＝bcc**，由 $\mathbf b_i=2\pi\frac{\mathbf a_j\times\mathbf a_k}{V}$ 推出。③ hcp 底層 Bravais＝simple hexagonal，其倒晶格**仍是 simple hexagonal**（轉 $30^\circ$），由此導出 $c/a$ 各問。

## 📚 前情提要：fcc 的 primitive vectors 怎麼來
fcc＝simple cubic（角點）＋6 個面心。**primitive cell 只含 1 個格點**，故體積 $=a^3/4$（每立方邊 $a$ 含 4 個 fcc 格點）。標準取法：從一個角點連到 3 個**最近面心**，得三個長度 $a/\sqrt2$、互成 $60^\circ$ 的向量。Fig.1 畫的正是這 3 個向量 $\mathbf a',\mathbf b',\mathbf c'$。
> **留存**：fcc 的「真正重複單元」是這個菱面體（rhombohedron），不是立方；立方只是看對稱用的 conventional cell。

## ⚠️ 原圖與讀法（Fig.1 / Fig.2）
![2015 Fig.1 fcc 與新基底 a',b',c'](figs/固態_2015_Q2_fcc.png)

- 座標：$\hat z$ 向上、$\hat y$ 向右、$\hat x$ 向左下（前方）。立方邊長 $a$。
- 三個粗箭頭由共同格點出發指向三個最近面心：**$\mathbf a'$ 朝下、$\mathbf b'$ 朝右上、$\mathbf c'$ 朝左上**。對照等角投影（$\hat z\!\to\!$上、$\hat y\!\to\!$右下、$\hat x\!\to\!$左下）逐一判讀：
  - 朝下 ＝ $\tfrac a2(\hat x+\hat y)$（落在底面）→ $\mathbf a'$
  - 朝右上 ＝ $\tfrac a2(\hat y+\hat z)$ → $\mathbf b'$
  - 朝左上 ＝ $\tfrac a2(\hat z+\hat x)$ → $\mathbf c'$

![2015 Fig.2 hcp 慣用胞](figs/固態_2015_Q2_hcp.png)

## 🔍 符號說明
<details>
<summary><b>▸ 換基底時 Miller 指標怎麼變：$h'_j=\frac1{2\pi}\mathbf G\cdot\mathbf a_j$</b></summary>

### 你學過的
Miller 指標 $(hkl)$ ＝「平面在三條軸上截距的倒數、化成最小整數」。

### 為什麼要這個
同一個物理平面，換一組基底 $\{\mathbf a_j\}$ 後**指標會變**（平面沒變、座標尺變了）。要一個不靠畫圖的算法。

### 定義
平面的法向用倒晶格向量表示 $\mathbf G$。在基底 $\{\mathbf a_j\}$ 下，新指標
$$h'_j=\frac1{2\pi}\,\mathbf G\cdot\mathbf a_j\quad(\text{再化成最小整數}).$$
（因新倒基 $\mathbf b'_j$ 滿足 $\mathbf b'_i\cdot\mathbf a_j=2\pi\delta_{ij}$，把 $\mathbf G=\sum h'_i\mathbf b'_i$ 點 $\mathbf a_j$ 即得。）

**範例 1（熱身）**：立方基底 $\mathbf a_j=a\hat e_j$，平面法向 $\mathbf G=\frac{2\pi}a(1,0,0)$ → $h'_1=\frac1{2\pi}\cdot\frac{2\pi}a\cdot a=1$，得回 $(100)$。
**範例 2（中階）**：若 $\mathbf a_1=a(\hat x+\hat y)$，同一 $\mathbf G=\frac{2\pi}a\hat x$ → $h'_1=\frac1{2\pi}\cdot\frac{2\pi}a\cdot a(\hat x+\hat y)\cdot\hat x=1$。
**範例 3（本題 (d)）**：fcc primitive 基底，$\mathbf G_{100}=\frac{2\pi}a\hat x$，$\mathbf a_1=\frac a2(\hat x+\hat y)$ → $h'_1=\frac12$，三軸合起來化整數。
</details>

<details>
<summary><b>▸ 倒晶格三式 + 體積；simple hexagonal 的 primitive vectors</b></summary>

### 定義（3D 倒晶格）
$$\mathbf b_1=2\pi\frac{\mathbf a_2\times\mathbf a_3}{V},\ \mathbf b_2=2\pi\frac{\mathbf a_3\times\mathbf a_1}{V},\ \mathbf b_3=2\pi\frac{\mathbf a_1\times\mathbf a_2}{V},\quad V=\mathbf a_1\cdot(\mathbf a_2\times\mathbf a_3).$$

### simple hexagonal（hcp 的底層 Bravais）
$$\mathbf a_1=a\hat x,\quad \mathbf a_2=a\!\left(-\tfrac12\hat x+\tfrac{\sqrt3}2\hat y\right),\quad \mathbf a_3=c\hat z,\quad V=\tfrac{\sqrt3}2a^2c.$$

**範例**：fcc primitive 三向量代入上式 → 得 bcc（立方邊 $4\pi/a$）；hcp 代入 → 得 simple hexagonal（轉 $30^\circ$）。本題 (f)(i) 即用。
</details>

## 解答

### (a) primitive cell
含**恰一個格點**的最小重複胞，平移它能不重疊地鋪滿全空間；體積（2D 面積）$=|\mathbf a_1\cdot(\mathbf a_2\times\mathbf a_3)|$。形狀不唯一（平行六面體可任選），但體積唯一。

### (b) Wigner–Seitz primitive cell
以某一格點為中心，作它到**所有鄰格點連線的垂直平分面（2D 為中垂線）**，這些面圍出的最小區域即 WS cell。它是**唯一**的 primitive cell，且**完整保有該格點的點群對稱**。

### (c) 2D 五種 Bravais lattice ＋ WS cell 形狀
五種（用邊長 $a_1,a_2$ 與夾角 $\gamma$ 描述）：
1. **Oblique（斜方）**：$a_1\ne a_2,\ \gamma\ne90^\circ$。
2. **Square（正方）**：$a_1=a_2,\ \gamma=90^\circ$。
3. **Rectangular（矩形）**：$a_1\ne a_2,\ \gamma=90^\circ$。
4. **Centered rectangular（中心矩形）**：矩形＋面心。
5. **Hexagonal（六方）**：$a_1=a_2,\ \gamma=120^\circ$。

**WS cell 只能是六邊形或矩形（含正方）：** WS cell 由中垂線圍成，邊數 ＝「決定邊界的最近／次近鄰方向數」。
- 一般位置（oblique、hexagonal、centered rect.）最近鄰有 6 個方向 → 中垂線圍成**六邊形**。
- 當對稱使某對鄰點退到「邊長為零」（square、rectangular，僅 4 個有效中垂線）→ 六邊形退化為**矩形/正方**。
$$\boxed{\text{2D WS cell }\in\{\text{六邊形, 矩形(含正方)}\}.}$$
> **小結**：六邊形是「一般」情形，矩形是「兩條邊縮成零」的特例；不可能出現五邊或八邊（中垂線對稱成對）。

### (d) (100)(110)(111) 在新基底下的指標
由 Fig.1 讀得（見上）並改名（接 (e)）：
$$\mathbf a_1=\tfrac a2(\hat x+\hat y),\quad \mathbf a_2=\tfrac a2(\hat y+\hat z),\quad \mathbf a_3=\tfrac a2(\hat z+\hat x).$$
用 $h'_j=\frac1{2\pi}\mathbf G\cdot\mathbf a_j$，其中立方面 $(hkl)$ 的 $\mathbf G=\frac{2\pi}a(h,k,l)$，故 $h'_j=\frac12\,(h,k,l)\cdot(\mathbf a_j\,\text{的}\,\tfrac a2\,\text{係數向量})$。把 $\mathbf a_1,\mathbf a_2,\mathbf a_3$ 的方向係數記為 $(1,1,0),(0,1,1),(1,0,1)$：

**(100)：$(h,k,l)=(1,0,0)$。**
$$h'_1\propto(1,1,0)\!\cdot\!(1,0,0)=1,\ h'_2\propto(0,1,1)\!\cdot\!(1,0,0)=0,\ h'_3\propto(1,0,1)\!\cdot\!(1,0,0)=1\Rightarrow \boxed{(101)}.$$
**(110)：$(1,1,0)$。**
$$h'_1\propto(1,1,0)\!\cdot\!(1,1,0)=2,\ h'_2\propto(0,1,1)\!\cdot\!(1,1,0)=1,\ h'_3\propto(1,0,1)\!\cdot\!(1,1,0)=1\Rightarrow \boxed{(211)}.$$
**(111)：$(1,1,1)$。**
$$h'_1\propto(1,1,0)\!\cdot\!(1,1,1)=2,\ h'_2\propto2,\ h'_3\propto2\Rightarrow \boxed{(111)}.$$
> **小結**：(111) 在 fcc primitive 基底下仍是 $(111)$（三向量對稱）；(100)→$(101)$、(110)→$(211)$（會隨 Fig.1 標號做置換，方法不變）。

### (e) $\mathbf a_1,\mathbf a_2,\mathbf a_3$ 的向量形式
$$\boxed{\mathbf a_1=\tfrac a2(\hat x+\hat y),\quad \mathbf a_2=\tfrac a2(\hat y+\hat z),\quad \mathbf a_3=\tfrac a2(\hat z+\hat x).}$$

### (f) 對應倒晶格 $\mathbf b_1,\mathbf b_2,\mathbf b_3$（完整計算）
**Step 1 — 體積。** 以 $a/2$ 為單位寫 $\mathbf a_1=(1,1,0),\mathbf a_2=(0,1,1),\mathbf a_3=(1,0,1)$：
$$\mathbf a_2\times\mathbf a_3=\tfrac{a^2}4(0,1,1)\times(1,0,1)=\tfrac{a^2}4(1,1,-1),$$
$$V=\mathbf a_1\cdot(\mathbf a_2\times\mathbf a_3)=\tfrac a2(1,1,0)\cdot\tfrac{a^2}4(1,1,-1)=\tfrac{a^3}8(1+1+0)=\frac{a^3}4.$$
**Step 2 — 三個 $\mathbf b_i$。**
$$\mathbf b_1=2\pi\frac{\mathbf a_2\times\mathbf a_3}{V}=2\pi\frac{\tfrac{a^2}4(1,1,-1)}{a^3/4}=\frac{2\pi}a(\hat x+\hat y-\hat z).$$
$$\mathbf a_3\times\mathbf a_1=\tfrac{a^2}4(1,0,1)\times(1,1,0)=\tfrac{a^2}4(-1,1,1)\Rightarrow \mathbf b_2=\frac{2\pi}a(-\hat x+\hat y+\hat z).$$
$$\mathbf a_1\times\mathbf a_2=\tfrac{a^2}4(1,1,0)\times(0,1,1)=\tfrac{a^2}4(1,-1,1)\Rightarrow \mathbf b_3=\frac{2\pi}a(\hat x-\hat y+\hat z).$$
$$\boxed{\mathbf b_1=\tfrac{2\pi}a(\hat x+\hat y-\hat z),\ \mathbf b_2=\tfrac{2\pi}a(-\hat x+\hat y+\hat z),\ \mathbf b_3=\tfrac{2\pi}a(\hat x-\hat y+\hat z).}$$
**驗證** $\mathbf a_i\cdot\mathbf b_j=2\pi\delta_{ij}$：$\mathbf a_1\cdot\mathbf b_1=\tfrac a2(1,1,0)\cdot\tfrac{2\pi}a(1,1,-1)=\pi(2)=2\pi$ ✓；$\mathbf a_1\cdot\mathbf b_2=\pi(-1+1)=0$ ✓。
> **小結**：這三個 $\mathbf b_i$ 正是**立方邊 $4\pi/a$ 的 bcc** primitive vectors → 預告 (h)。

### (g) fcc 的 packing fraction
每立方含 **4** 個原子；原子沿**面對角線**相切，$4r=a\sqrt2\Rightarrow r=\tfrac{\sqrt2}4a$。
$$f=\frac{4\cdot\tfrac43\pi r^3}{a^3}=\frac{16\pi}{3a^3}\Big(\tfrac{\sqrt2}4a\Big)^3=\frac{16\pi}{3}\cdot\frac{2\sqrt2}{64}=\frac{\pi\sqrt2}{6}=\frac{\pi}{3\sqrt2}\approx\boxed{0.74.}$$

### (h) fcc 的倒空間結構
由 (f)，三個 $\mathbf b_i$ ＝ bcc primitive vectors（立方邊 $4\pi/a$）：
$$\boxed{\text{fcc 的倒晶格 ＝ bcc（reciprocal of fcc is bcc）。}}$$

### (i) hcp 的倒晶格仍是 simple hexagonal（完整）
hcp 的底層 Bravais ＝ **simple hexagonal**。取
$$\mathbf a_1=a\hat x,\quad \mathbf a_2=a\!\left(-\tfrac12\hat x+\tfrac{\sqrt3}2\hat y\right),\quad \mathbf a_3=c\hat z,\quad V=\tfrac{\sqrt3}2a^2c.$$
**Step 1 — $\mathbf b_3$（c 軸）。** $\mathbf a_1\times\mathbf a_2=a^2\tfrac{\sqrt3}2\hat z$，
$$\mathbf b_3=2\pi\frac{a^2\tfrac{\sqrt3}2\hat z}{\tfrac{\sqrt3}2a^2c}=\frac{2\pi}c\hat z\Rightarrow |\mathbf b_3|=\frac{2\pi}c.$$
**Step 2 — $\mathbf b_1$。** $\mathbf a_2\times\mathbf a_3=a c\big(\tfrac{\sqrt3}2,\tfrac12,0\big)$，
$$\mathbf b_1=2\pi\frac{ac(\tfrac{\sqrt3}2,\tfrac12,0)}{\tfrac{\sqrt3}2a^2c}=\frac{2\pi}a\Big(1,\tfrac1{\sqrt3},0\Big),\quad |\mathbf b_1|=\frac{2\pi}a\sqrt{1+\tfrac13}=\frac{2\pi}a\cdot\frac2{\sqrt3}=\frac{4\pi}{\sqrt3\,a}.$$
**Step 3 — $\mathbf b_2$。** $\mathbf a_3\times\mathbf a_1=ac\,\hat y$，
$$\mathbf b_2=2\pi\frac{ac\,\hat y}{\tfrac{\sqrt3}2a^2c}=\frac{4\pi}{\sqrt3\,a}\hat y,\quad |\mathbf b_2|=\frac{4\pi}{\sqrt3\,a}.$$
**Step 4 — 認結構。** $|\mathbf b_1|=|\mathbf b_2|=\dfrac{4\pi}{\sqrt3 a}$，夾角 $\cos\theta=\dfrac{\mathbf b_1\cdot\mathbf b_2}{|\mathbf b_1||\mathbf b_2|}=\dfrac{(2\pi/a)^2\cdot\tfrac2{\sqrt3}\cdot\tfrac1{\sqrt3}}{(2\pi/a)^2\tfrac43}=\dfrac{2/3}{4/3}=\tfrac12\Rightarrow\theta=60^\circ$ → **simple hexagonal**（六方可用 $60^\circ$ 基底描述），c 軸常數 $\tfrac{2\pi}c$、底面常數 $\tfrac{4\pi}{\sqrt3 a}$。
**Step 5 — 轉 $30^\circ$。** $\mathbf a_1$ 沿 $0^\circ$（$\hat x$）；$\mathbf b_1\propto(1,\tfrac1{\sqrt3})$ 的方位角 $=\arctan\tfrac{1/\sqrt3}{1}=30^\circ$。故倒晶格相對實晶格**繞 c 軸轉 $30^\circ$**。$\blacksquare$
$$\boxed{\text{hcp 倒晶格 ＝ simple hexagonal，}\ c^*=\tfrac{2\pi}c,\ a^*=\tfrac{4\pi}{\sqrt3 a},\ \text{轉 }30^\circ.}$$

### (j) $c/a$ 三問
記實晶格 $(c/a)_{\rm d}=\dfrac ca$。倒晶格的對應比值
$$\Big(\frac ca\Big)_{\rm r}=\frac{c^*}{a^*}=\frac{2\pi/c}{4\pi/(\sqrt3 a)}=\frac{\sqrt3\,a}{2c}=\frac{\sqrt3}{2}\cdot\frac1{(c/a)_{\rm d}}.$$
> 立刻看出一條不變量：$(c/a)_{\rm d}\cdot(c/a)_{\rm r}=\dfrac{\sqrt3}2$。

**① 兩者相等：** 令 $\gamma=c/a$，$\dfrac{\sqrt3}2\dfrac1\gamma=\gamma\Rightarrow\gamma^2=\dfrac{\sqrt3}2\Rightarrow$
$$\boxed{\frac ca=\sqrt{\frac{\sqrt3}{2}}\approx0.93.}$$

**② 理想 $c/a$（close-packed 幾何，完整）：** 第二層球落在第一層三球的凹洞，正上方水平距各球 $\dfrac a{\sqrt3}$，層間垂直距 $\dfrac c2$，相切要求中心距 $=a$：
$$\Big(\frac a{\sqrt3}\Big)^2+\Big(\frac c2\Big)^2=a^2\Rightarrow\frac{a^2}3+\frac{c^2}4=a^2\Rightarrow\frac{c^2}4=\frac23a^2\Rightarrow \boxed{\frac ca=\sqrt{\tfrac83}\approx1.633.}$$

**③ 理想 $c/a$ 在倒晶格中的值：**
$$\Big(\frac ca\Big)_{\rm r}=\frac{\sqrt3}2\cdot\frac1{\sqrt{8/3}}=\frac{\sqrt3}2\sqrt{\frac38}=\frac{3}{4\sqrt2}=\frac{3\sqrt2}8\approx\boxed{0.53.}$$
> **小結**：理想時實 $1.633$、倒 $0.530$，乘積 $=\tfrac{\sqrt3}2$ ✓（與不變量自洽）；相等點落在 $0.93$ 之間，合理。

# 📙 第 3 題 — 晶體鍵結（15 pts）

## 📋 原題
> (a)(b)(c)(d) 是四種晶體鍵結的示意圖（正核＋周圍負電子，電荷以數字標示）。請辨識每張圖的鍵結類型 [2]、詳細說明四種鍵結 [7]、各舉一材料系統 [2]。
> 再：由 Lennard–Jones，此模型預測 Ne, Ar, Kr, Xe 的 cohesive energy「應全相同」，為何實測沸點（熔點）卻不同？[2]
> 又：晶體結構可由 photon / neutron / electron 繞射研究，請描述並比較三者差異 [2]。

## 🎯 核心訊息
> 四張圖用**電荷標號**就能辨識：全中性閉殼球＝van der Waals；正負離子交替＝ionic；共用電子對連接的小正核＝covalent；正核泡在均勻電子海＝metallic。L-J 之所以「四惰性氣體同形」是因為以 $\sigma,\varepsilon$ 為單位時結果一樣，真正差異全在 $\varepsilon$。

## 解答

### (a)–(d) 辨識（依圖中電荷）
- **(a) van der Waals（凡得瓦）**：每球皆 **$18^{+}$ 核 ＋ $18^{-}$ 電子**（中性閉殼，Ar）。→ 材料：**Ar**（固態惰性氣體；亦 Ne、CH₄）。
- **(b) Ionic（離子鍵）**：交替的 **$19^{+}/18e$（K$^{+}$）** 與 **$17^{+}/18e$（Cl$^{-}$）**。→ 材料：**KCl**（亦 NaCl）。
- **(c) Covalent（共價鍵）**：**$6^{+}$ 核（C）**，相鄰核間有**共用電子對**橋接。→ 材料：**diamond（C）**（亦 Si、Ge）。
- **(d) Metallic（金屬鍵）**：**$19^{+}$ 核（K）**規則排列、浸在**均勻負電子海**中。→ 材料：**K 金屬**（亦 Na、Cu）。

### 四種鍵結的物理（7 分版）
- **van der Waals**：閉殼中性原子間的**瞬時偶極–感應偶極**吸引（London 力），$\propto -1/r^6$；近距離有泡利排斥 $\propto +1/r^{12}$。鍵弱、熔點低、絕緣。
- **Ionic**：電子由低電負度原子**整顆轉移**給高電負度原子，形成 $\pm$ 離子，靠 **Coulomb（Madelung）** 吸引結合，排斥來自閉殼重疊。鍵強、硬脆、熔點高、熔融才導電。
- **Covalent**：相鄰原子**共用價電子對**，形成方向性強的飽和鍵（如 sp³）。硬、熔點高、能隙大（半導體/絕緣）。
- **Metallic**：價電子**完全離域**成電子海，正離子實浸於其中；鍵無方向性。延展性好、導電導熱佳。

### L-J 為何四惰性氣體沸點不同
L-J 寫成 $U=2N\varepsilon\big[A_{12}(\sigma/R)^{12}-A_6(\sigma/R)^6\big]$，極小化得 $R_0\propto\sigma$、$|U_0|\propto\varepsilon$。**以各自 $\sigma,\varepsilon$ 為單位時四者「同形」**，但真實的 $\varepsilon$（隨極化率／van der Waals 強度）**Ne$<$Ar$<$Kr$<$Xe 遞增**，故結合能 $|U_0|\propto\varepsilon$ 遞增 → **沸點/熔點遞增**。
> 補充：最輕的 Ne **零點能**最大，進一步削弱其有效結合，使其熔沸點偏低更明顯。

### photon / neutron / electron 繞射比較
- **X-ray（photon）**：與**電子雲**作用，散射 $\propto Z$；對輕原子（H）不敏感；穿透中等、設備普及。
- **Neutron**：與**原子核**（短程核力）及**磁矩**作用 → 能定位輕原子、測磁結構；散射長度隨**同位素**跳動；需反應爐/散裂源。
- **Electron**：與**總靜電位**（核＋電子）作用，截面大 → 適合**薄膜/表面**，但多重散射強。
- 三者**峰位置相同**（同一倒晶格），**強度不同**（不同 form factor）。

## ✅ 自我檢核
- 電荷自洽：K$^{+}$＝$19^{+}/18e$（淨 $+1$）、Cl$^{-}$＝$17^{+}/18e$（淨 $-1$），(b) 為 KCl ✓；(a) 全中性 → vdW ✓。
- L-J 標準結果 $R_0\approx1.09\sigma$、$|U_0|\propto\varepsilon$ → 沸點序 Ne$<$Ar$<$Kr$<$Xe ✓（與實驗一致）。

- 或把 ionic 換成 **Madelung 常數/能量**推導（2023/2024）。

# 📕 第 4 題 — 低溫比熱 $C/T=\gamma+AT^2$（15 pts）

## 📋 原題
> 遠低於 Debye 與 Fermi 溫度時 $C/T=\gamma+AT^2$（電子＋聲子）。
> (a) 說明古典 Drude 模型為何**失敗**、Sommerfeld 理論為何**成功**給出正確電子比熱 [5]。
> (b) 用 Fermi–Dirac 分布的**定性**論證，導出電子比熱的 **T-linear** 依賴 [5]。
> (c) 用 k 空間中**允許被激發的聲子模**的定性論證，導出聲子比熱的 **Debye $T^3$ 律** [5]。

## 🎯 核心訊息
> 一句話：**Pauli 不相容讓「能被熱激發的電子」只剩費米面附近 $\sim k_BT/E_F$ 的一小撮 → $C_{\rm el}\propto T$**；**低溫只有 $\hbar\omega\lesssim k_BT$ 的長波聲子被激發，其數目 $\propto T^3$ → $C_{\rm ph}\propto T^3$**。兩者相加除以 $T$ 即 $C/T=\gamma+AT^2$。

## 📚 前情提要：為何 Drude 的 $\tfrac32 Nk_B$ 是災難
古典等分律給每個電子 $\tfrac32 k_B$ 比熱，$N\sim10^{23}$ 個自由電子應貢獻 $\tfrac32 Nk_B$，與離子的 $3Nk_B$ 同量級。但實驗上室溫金屬電子比熱僅 $\sim$ 離子的**百分之一**且 $\propto T$。問題出在「把電子當古典可自由吸熱的氣體」。
> **留存**：修正關鍵不是力學，是**統計**——電子是費米子。

## 解答

### (a) Drude 失敗 / Sommerfeld 成功
- **Drude**：電子服從古典 Maxwell–Boltzmann，等分律 → $C_{\rm el}=\tfrac32 Nk_B$（大、且與 $T$ 無關）。與實驗（小、且 $\propto T$）矛盾，也違反第三定律（$T\to0$ 應 $\to0$）。
- **Sommerfeld**：電子服從 **Fermi–Dirac ＋ Pauli**。$T\ll T_F$ 時，費米海深處的電子被**Pauli 封鎖**（上方無空位可跳），只有費米面 $\pm k_BT$ 內的電子能被激發 → 有效「活躍電子」比例 $\sim k_BT/E_F\ll1$。故 $C_{\rm el}\sim Nk_B\,(T/T_F)\propto T$ 且小，正確。

### (b) 電子比熱的 T-linear（定性，完整）
**Step 1 — 數活躍電子。** 費米面附近寬 $\sim k_BT$ 的能窗內、可被激發的電子數
$$N_{\rm act}\approx g(E_F)\,k_BT.$$
**Step 2 — 每個吸熱 $\sim k_BT$。** 多餘熱能
$$\Delta U=U(T)-U(0)\approx N_{\rm act}\cdot k_BT\approx g(E_F)(k_BT)^2.$$
**Step 3 — 微分。**
$$C_{\rm el}=\frac{d\,\Delta U}{dT}\approx 2g(E_F)k_B^2\,T\ \propto\ T.$$
**Step 4 — 補正確係數（Sommerfeld）。** 嚴格係數為 $\tfrac{\pi^2}3$，且 $g(E_F)=\dfrac{3N}{2E_F}=\dfrac{3N}{2k_BT_F}$：
$$C_{\rm el}=\frac{\pi^2}3 g(E_F)k_B^2T=\frac{\pi^2}3\cdot\frac{3N}{2k_BT_F}k_B^2T=\boxed{\frac{\pi^2}{2}Nk_B\frac{T}{T_F}=\gamma T,\quad \gamma=\frac{\pi^2}{2}\frac{Nk_B}{T_F}.}$$
> **小結**：$C_{\rm el}\propto T$ 的物理就是「活躍電子數 $\propto T$、每個吸 $\propto T$」兩個 $T$ 相乘再微分掉一個。

### (c) 聲子的 Debye $T^3$ 律（定性，完整）
**Step 1 — 哪些模被激發。** 低溫只有 $\hbar\omega\lesssim k_BT$ 的模有顯著占據。以 $\omega=vk$，被激發的模落在 k 空間半徑
$$k_T=\frac{\omega_T}{v}=\frac{k_BT}{\hbar v}$$
的球內。
**Step 2 — 數模。** 球內模數
$$N_{\rm exc}\propto k_T^3\propto T^3.$$
**Step 3 — 能量。** 每個激發模 $\sim k_BT$ → $U\approx k_BT\cdot N_{\rm exc}\propto T\cdot T^3=T^4$。
**Step 4 — 微分。** $C_{\rm ph}=dU/dT\propto T^3$。
**Step 5 — 補係數（完整積分）。** $U=\displaystyle\int_0^{\omega_D}\frac{\hbar\omega}{e^{\hbar\omega/k_BT}-1}g(\omega)d\omega$，$g(\omega)=\dfrac{3V\omega^2}{2\pi^2v^3}$；低溫上限 $\to\infty$，令 $x=\hbar\omega/k_BT$：
$$U=\frac{3V}{2\pi^2v^3}\frac{(k_BT)^4}{\hbar^3}\underbrace{\int_0^\infty\frac{x^3}{e^x-1}dx}_{=\pi^4/15}\Rightarrow C_{\rm ph}=\frac{dU}{dT}=\boxed{\frac{2\pi^2V k_B^4}{5\hbar^3v^3}\,T^3=AT^2\cdot T}$$
即標準 $C_{\rm ph}=\tfrac{12\pi^4}5 Nk_B(T/\Theta_D)^3\propto T^3$。
> **小結**：$T^3$ 的根是「k 空間球體積 $\propto T^3$」——三維幾何直接給出指數 3。

### 合併
$$C=\gamma T+\beta T^3\Rightarrow \frac CT=\gamma+\beta T^2\ (=\gamma+AT^2).$$
作 $C/T$ 對 $T^2$ 圖：截距 $\gamma$（電子）、斜率 $\beta=A$（聲子），可分離兩者。

# 📒 第 5 題 — Ohm 定律到 Wiedemann–Franz（20 pts）

## 📋 原題
> 自由電子氣模型中電子輸運服從 Ohm 定律。
> (a) 導出 Ohm 定律 $\mathbf J=\sigma\mathbf E$，$\sigma=ne^2\tau/m$，$\tau$ 為碰撞時間 [4]。
> (b) mobility $\mu=v_{\rm drift}/E$，證 $\sigma=ne\mu$、$\mu=e\tau/m$ [4]。
> (c) 熱導 $K$ 由 $j_U=-K\,dT/dx$ 定義，證 $K=\tfrac13 C v\,l$（$C$＝單位體積熱容、$v$＝平均速率、$l$＝平均自由程）[4]。
> (d) 由第 4 題的 $\gamma=\tfrac12\pi^2 Nk_B/T_F$，導出電子熱導 $K_{\rm el}=\dfrac{\pi^2 n k_B^2 T\,\tau}{3m}$ [4]。
> (e) 取電子熱導與電導之比，導出 **Wiedemann–Franz 律與 Lorenz number** [4]。

## 🎯 核心訊息
> 一條碰撞時間 $\tau$ 同時管電與熱：$\sigma=ne^2\tau/m$、$K_{\rm el}=\tfrac13 Cv_F^2\tau$。兩者相除 $\tau$ 消掉、$v_F^2$ 與 $C$ 的 $T_F$ 也消掉，只剩**普適常數** $L=K/(\sigma T)=\tfrac{\pi^2}3(k_B/e)^2$ → Wiedemann–Franz。

## 📚 前情提要：Drude 的運動方程
單電子受電場與「平均每 $\tau$ 撞一次」的阻尼：$m\dot{\mathbf v}=-e\mathbf E-m\mathbf v/\tau$。穩態 $\dot{\mathbf v}=0$ 給漂移速度——這是 (a)(b) 的起點。

## 🔍 符號說明
<details>
<summary><b>▸ drift velocity、$\sigma$、kinetic 熱導 $\tfrac13Cvl$</b></summary>

### 定義
- 穩態漂移 $\mathbf v_d=-\dfrac{e\tau}m\mathbf E$；電流密度 $\mathbf J=-ne\mathbf v_d$。
- 動理論熱導：粒子帶能量越過某面，$K=\tfrac13Cvl$（$\tfrac13$ 來自三維方向平均 $\langle v_x^2\rangle=\tfrac13v^2$）。

**範例 1（熱身）**：$\mathbf J=-ne\mathbf v_d=\dfrac{ne^2\tau}m\mathbf E$ → $\sigma=ne^2\tau/m$。
**範例 2（中階）**：$\mu=|v_d|/E=e\tau/m$ → $\sigma=ne\mu$。
**範例 3（本題）**：把 $C=\gamma T$（每體積）、$v=v_F$、$l=v_F\tau$ 代入 $K=\tfrac13Cvl$ 得 $K_{\rm el}$。
</details>

## 解答

### (a) Ohm 定律（完整）
**Step 1 — 運動方程。** $m\dfrac{d\mathbf v}{dt}=-e\mathbf E-\dfrac m\tau\mathbf v$。
**Step 2 — 穩態。** $\dfrac{d\mathbf v}{dt}=0\Rightarrow \mathbf v_d=-\dfrac{e\tau}m\mathbf E$。
**Step 3 — 電流密度。** $\mathbf J=n(-e)\mathbf v_d=\dfrac{ne^2\tau}m\mathbf E$。
$$\boxed{\mathbf J=\sigma\mathbf E,\qquad \sigma=\frac{ne^2\tau}m.}$$

### (b) Mobility
$\mu\equiv\dfrac{|\mathbf v_d|}E=\dfrac{e\tau/m\cdot E}E=\boxed{\dfrac{e\tau}m}$。又 $\sigma=\dfrac{ne^2\tau}m=ne\cdot\dfrac{e\tau}m=\boxed{ne\mu}$。

### (c) $K=\tfrac13 Cvl$（動理論，完整）
**Step 1 — 通量設定。** 粒子沿 $x$ 帶能量；在 $x$ 處越過單位面的粒子，上次碰撞發生在 $x\mp v_x\tau$，帶該處的平均能量 $\varepsilon(T)$。
**Step 2 — 淨能流。** 來自 $+x$ 與 $-x$ 兩側淨值
$$j_U=\tfrac12 n v_x\big[\varepsilon(x-l_x)-\varepsilon(x+l_x)\big]=-n v_x\,l_x\frac{d\varepsilon}{dx}=-nv_x^2\tau\frac{d\varepsilon}{dT}\frac{dT}{dx}.$$
**Step 3 — 三維方向平均。** $\langle v_x^2\rangle=\tfrac13 v^2$，且單位體積熱容 $C=n\dfrac{d\varepsilon}{dT}$：
$$j_U=-\tfrac13 v^2\tau\,C\frac{dT}{dx}=-\tfrac13 C v\,(v\tau)\frac{dT}{dx}=-\tfrac13 C v\,l\frac{dT}{dx}.$$
對照 $j_U=-K\,dT/dx$：
$$\boxed{K=\tfrac13 C v\,l.}$$

### (d) 電子熱導 $K_{\rm el}$（完整）
取 $v=v_F,\ l=v_F\tau$，每體積電子熱容 $C=\gamma T=\dfrac{\pi^2}2 nk_B\dfrac{T}{T_F}$（$n=N/V$）。
$$K_{\rm el}=\tfrac13 C v_F^2\tau=\tfrac13\cdot\frac{\pi^2}2 nk_B\frac{T}{T_F}\cdot v_F^2\tau.$$
用 $\tfrac12 mv_F^2=k_BT_F\Rightarrow v_F^2=\dfrac{2k_BT_F}m$：
$$K_{\rm el}=\frac{\pi^2}6 nk_B\frac{T}{T_F}\cdot\frac{2k_BT_F}m\,\tau=\boxed{\frac{\pi^2 n k_B^2 T\,\tau}{3m}.}$$
> **小結**：$T_F$ 在 $C$ 的分母、在 $v_F^2$ 的分子，剛好對消 → $K_{\rm el}$ 不含 $T_F$。

### (e) Wiedemann–Franz 律 ＋ Lorenz number
$$\frac{K_{\rm el}}{\sigma}=\frac{\dfrac{\pi^2 nk_B^2T\tau}{3m}}{\dfrac{ne^2\tau}m}=\frac{\pi^2 k_B^2 T}{3e^2}\Rightarrow \boxed{\frac{K_{\rm el}}{\sigma T}=\frac{\pi^2}{3}\Big(\frac{k_B}{e}\Big)^2\equiv L.}$$
$L$ 與材料、$n$、$\tau$、$T$ 皆無關（普適）：
$$\boxed{L=\frac{\pi^2}{3}\Big(\frac{k_B}{e}\Big)^2\approx2.45\times10^{-8}\ \mathrm{W\,\Omega\,K^{-2}}.}$$

# 📓 第 6 題 — Bloch 定理與 Kronig–Penney（20 pts）　★本卷能帶重頭戲

## 📋 原題
> Bloch 定理：週期位能下薛丁格方程的解可寫成 Bloch function。
> (a) Bloch function 的形式 [2]。　(b) 論證 Bloch function 確為週期位能薛丁格方程的解（即 Bloch 定理的證明）[10]。
> (c) 固體中能隙的來源 [2]。　(d) 半導體能隙皆與溫度有關，主要來源為何 [2]。
> (e) 下式為 $\delta$ 函數 Kronig–Penney 模型（週期 $a$）的解。若 $P\ll1$，求 $k=0$ 的最低能量 [2]；求 $k=\pi/a$ 的第一能隙 [2]。
> $$\frac{P}{Ka}\sin Ka+\cos Ka=\cos ka,\qquad \epsilon=\frac{\hbar^2K^2}{2m},\ k\ \text{在第一區}.$$

## 🎯 核心訊息
> Bloch 定理 ＝「**平移算符與 $H$ 對易 → 共同本徵態 → 本徵值是模 1 相位 $e^{i\mathbf k\cdot\mathbf R}$**」。能隙來自 BZ 邊界兩簡併平面波被週期位能混成駐波；KP 在 $P\ll1$ 下展開即得最低能與能隙的閉式。

## 📚 前情提要：為何主角是平移算符
週期位能 $V(\mathbf r+\mathbf R)=V(\mathbf r)$ ⇒ 平移 $\mathbf R$ 不改變 $H$ ⇒ 平移算符 $T_\mathbf R$ 與 $H$ 對易 ⇒ 可同時對角化。$T_\mathbf R$ 的本徵值因「平移不改機率」而為模 1，寫成 $e^{i\mathbf k\cdot\mathbf R}$。
> **留存**：Bloch 不是假設，是「平移對稱 → $\mathbf k$ 標籤」的必然。

## 🔍 符號說明
<details>
<summary><b>▸ 平移算符 $T_\mathbf R$、Bloch 形式、KP 色散展開</b></summary>

### 定義
- $T_\mathbf R f(\mathbf r)=f(\mathbf r+\mathbf R)$；$[T_\mathbf R,H]=0$。
- Bloch：$\psi_\mathbf k=e^{i\mathbf k\cdot\mathbf r}u_\mathbf k$，$u_\mathbf k(\mathbf r+\mathbf R)=u_\mathbf k(\mathbf r)$。
- KP（$\delta$ 勢）：$\dfrac P{Ka}\sin Ka+\cos Ka=\cos ka$。

**範例 1（熱身）**：$T_\mathbf R$ 本徵值 $c(\mathbf R)$ 滿足 $|c|=1$ 且 $c(\mathbf R)c(\mathbf R')=c(\mathbf R+\mathbf R')$ → $c=e^{i\mathbf k\cdot\mathbf R}$。
**範例 2（中階）**：$k$ 與 $k+G$ 給相同 $c(\mathbf R)$ → 可限第一 BZ。
**範例 3（本題 (e)）**：RHS$=1$（$k=0$）或 $-1$（$k=\pi/a$），對 $Ka$ 小量展開求 $E$。
</details>

## 解答

### (a) Bloch function 的形式
$$\boxed{\psi_\mathbf k(\mathbf r)=e^{i\mathbf k\cdot\mathbf r}u_\mathbf k(\mathbf r),\quad u_\mathbf k(\mathbf r+\mathbf R)=u_\mathbf k(\mathbf r);}$$
等價：$\psi_\mathbf k(\mathbf r+\mathbf R)=e^{i\mathbf k\cdot\mathbf R}\psi_\mathbf k(\mathbf r)$。

### (b) Bloch 定理證明（平移算符法，完整，10 分版）
**Step 1 — 定義平移算符並證對易。** $T_\mathbf R f(\mathbf r)=f(\mathbf r+\mathbf R)$。對 $H=-\dfrac{\hbar^2}{2m}\nabla^2+V(\mathbf r)$，動能項平移不變，且 $V(\mathbf r+\mathbf R)=V(\mathbf r)$，故
$$T_\mathbf R H\psi=H(\mathbf r+\mathbf R)\psi(\mathbf r+\mathbf R)=H(\mathbf r)\,T_\mathbf R\psi\Rightarrow [T_\mathbf R,H]=0.$$
**Step 2 — 平移群可交換。** $T_\mathbf R T_{\mathbf R'}=T_{\mathbf R+\mathbf R'}=T_{\mathbf R'}T_\mathbf R$。一族互相對易又與 $H$ 對易的算符 → 存在**共同本徵態** $\psi$。
**Step 3 — 本徵值模 1。** 設 $T_\mathbf R\psi=c(\mathbf R)\psi$。$T_\mathbf R$ 為么正（平移保內積）⇒ 歸一不變 ⇒ $|c(\mathbf R)|=1$。
**Step 4 — 乘法同態。** 由 Step 2，$c(\mathbf R)c(\mathbf R')=c(\mathbf R+\mathbf R')$。
**Step 5 — 解函數方程。** $|c|=1$ 且對加法為乘法同態 ⇒ 存在實向量 $\mathbf k$ 使
$$c(\mathbf R)=e^{i\mathbf k\cdot\mathbf R}\Rightarrow \psi(\mathbf r+\mathbf R)=e^{i\mathbf k\cdot\mathbf R}\psi(\mathbf r).$$
（具體：取三個 primitive $\mathbf a_i$，$c(\mathbf a_i)=e^{i2\pi x_i}$，令 $\mathbf k=\sum x_i\mathbf b_i$，則 $c(\mathbf R)=e^{i\mathbf k\cdot\mathbf R}$。）
**Step 6 — 化成 Bloch 形。** 定義 $u_\mathbf k(\mathbf r)\equiv e^{-i\mathbf k\cdot\mathbf r}\psi(\mathbf r)$，則
$$u_\mathbf k(\mathbf r+\mathbf R)=e^{-i\mathbf k\cdot(\mathbf r+\mathbf R)}\psi(\mathbf r+\mathbf R)=e^{-i\mathbf k\cdot\mathbf r}e^{-i\mathbf k\cdot\mathbf R}\,e^{i\mathbf k\cdot\mathbf R}\psi(\mathbf r)=u_\mathbf k(\mathbf r).$$
故 $\psi_\mathbf k=e^{i\mathbf k\cdot\mathbf r}u_\mathbf k$ 且 $u_\mathbf k$ 週期。$\blacksquare$
> **小結**：唯一輸入是「平移對稱 ＋ 歸一不變」，沒有任何近似。

### (c) 能隙來源
自由電子 $E=\hbar^2k^2/2m$ 連續、無隙。在 BZ 邊界 $k=\pm\pi/a$，兩個簡併平面波 $e^{\pm i\pi x/a}$ 被週期位能的 Fourier 分量 $U_G$ 耦合，混成兩個駐波 $\cos(\pi x/a)$、$\sin(\pi x/a)$：前者電子密度堆在離子上（能量低）、後者堆在離子間（能量高），能量差
$$\boxed{E_{\rm gap}=2|U_G|.}$$

### (d) 半導體能隙的溫度依賴來源
1. **晶格熱膨脹**：晶格常數隨 $T$ 變 → 能帶交疊改變 → $E_g$ 改變。
2. **電子–聲子交互作用**：升溫聲子數增加，重整化能帶邊。
兩者通常使 $E_g$ **隨 $T$ 升高而減小**（Varshni 關係 $E_g(T)=E_g(0)-\dfrac{\alpha T^2}{T+\beta}$）。

### (e) Kronig–Penney（$P\ll1$，完整）
**(i) $k=0$ 最低能（RHS $=\cos0=1$）。** $P\ll1\Rightarrow Ka$ 小，展開 $\sin Ka\approx Ka-\tfrac{(Ka)^3}6$、$\cos Ka\approx1-\tfrac{(Ka)^2}2$：
$$\frac P{Ka}\Big(Ka-\tfrac{(Ka)^3}6\Big)+1-\tfrac{(Ka)^2}2=1\Rightarrow P-\tfrac{P(Ka)^2}6-\tfrac{(Ka)^2}2=0.$$
$P\ll1$ 時丟掉 $P(Ka)^2$ 高階項：$P\approx\tfrac12(Ka)^2\Rightarrow (Ka)^2=2P\Rightarrow K^2=\dfrac{2P}{a^2}$。
$$\boxed{E_{\min}=\frac{\hbar^2K^2}{2m}=\frac{\hbar^2P}{ma^2}.}$$
> **小結**：$\delta$ 勢（排斥）把最低能從 0 推到 $\hbar^2P/ma^2$。

**(ii) $k=\pi/a$ 的第一能隙（RHS $=\cos\pi=-1$）。** 設 $Ka=\pi+\delta$：$\sin(\pi+\delta)\approx-\delta$、$\cos(\pi+\delta)\approx-1+\tfrac{\delta^2}2$、$\dfrac P{Ka}\approx\dfrac P\pi$：
$$-\frac{P\delta}\pi-1+\frac{\delta^2}2=-1\Rightarrow \delta\Big(\frac\delta2-\frac P\pi\Big)=0\Rightarrow \delta=0\ \text{或}\ \delta=\frac{2P}\pi.$$
兩帶邊 $K_-a=\pi,\ K_+a=\pi+\tfrac{2P}\pi$。能隙
$$E_{\rm gap}=\frac{\hbar^2}{2m}(K_+^2-K_-^2)=\frac{\hbar^2}{2ma^2}\Big[\big(\pi+\tfrac{2P}\pi\big)^2-\pi^2\Big]\approx\frac{\hbar^2}{2ma^2}\cdot4P=\boxed{\frac{2\hbar^2P}{ma^2}.}$$
> **小結**：弱勢能隙 $\propto P$（線性），與 (c) 的「$E_{\rm gap}=2|U_G|$ 正比於位能傅立葉分量」同精神。

<button id="toc-toggle" type="button" aria-label="開關目錄">☰ 目錄</button>
<nav id="toc" aria-label="本頁目錄"></nav>
<style>
  #toc-toggle { position: fixed; top: 12px; left: 12px; z-index: 1001; background: #1a4d7c; color: #fff;
    border: none; border-radius: 6px; padding: 6px 11px; font-size: 0.9em; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25); opacity: 0.9; }
  #toc-toggle:hover { opacity: 1; }
  #toc { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; overflow-y: auto; box-sizing: border-box;
    background: #f4f8fc; border-right: 1px solid #c5d5e5; padding: 3.4em 0.7em 2em; z-index: 1000;
    transform: translateX(-100%); transition: transform 0.2s ease; font-size: 0.9em; }
  #toc.open { transform: translateX(0); box-shadow: 2px 0 14px rgba(0,0,0,0.15); }
  #toc .toc-title { font-weight: 700; color: #1a4d7c; font-size: 1.0em; margin: 0 0 0.5em; padding: 0 0.4em; }
  #toc a { display: block; text-decoration: none; color: #34506b; padding: 3px 0.5em; border-radius: 4px;
    line-height: 1.4; border-left: 2px solid transparent; }
  #toc a:hover { background: #e3eef8; color: #1a4d7c; }
  #toc a.h3 { padding-left: 1.5em; font-size: 0.92em; color: #5d728a; }
  #toc a.h4 { padding-left: 2.7em; font-size: 0.86em; color: #6f8197; }
  #toc a.active { background: #e8f0f9; color: #1a4d7c; border-left-color: #1a4d7c; font-weight: 600; }
  @media (min-width: 1280px) {
    #toc { transform: none; box-shadow: none; }
    #toc-toggle { display: none; }
    body { margin-left: 290px; }
  }
  @media print { #toc, #toc-toggle { display: none !important; } body { margin-left: auto !important; } }
</style>
<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
