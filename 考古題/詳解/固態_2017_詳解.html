# 固態物理導論 2017 資格考 — 教學版逐題詳解（從普物起建 · 代數不跳步）

> **這份的定位**:2017 共 **3 大題 / 100 分**,偏「觀念 + 推導」混合。Q1（55%）是**電子 vs 聲子**的能帶色散與能隙大對比（要畫圖、講 Brillouin zone、用能帶圖分材料），偏觀念但要說清楚物理起源;Q2（30%）要**用牛頓第二定律的形式完整推 effective mass**;Q3（15%）要從 **k 空間費米球**推 $k_F=\left(\tfrac{3\pi^2N}{V}\right)^{1/3}$。寫法同其他年份(`📋原題 → 🎯核心訊息 →（推導題）前情提要 → 🔍符號說明 → 解答 Step（不跳代數、$\boxed{}$、小結）→ ✅自我檢核 → 🔀變化 → 信心`)。共用觀念見 [`_共用觀念與公式.html`](_共用觀念與公式.html)。
>
> **Q3 的待證式藏在原卷被略過的圖裡**,算繪 PDF 確認為:
> ![2017 Q3 待證式 kF](figs/固態_2017_Q3_kF公式.png)
> 即 $k_F=\left(\dfrac{3\pi^2N}{V}\right)^{1/3}$,等價於 $N=\dfrac{Vk_F^3}{3\pi^2}$。Q3 全程證這條。

## 🧭 全卷約定
- 自由電子 $E=\dfrac{\hbar^2k^2}{2m}$;晶體動量 $\hbar\mathbf k$;$\hbar=h/2\pi$。
- 一維晶格常數記 $a$,第一布里淵區邊界在 $k=\pm\pi/a$。
- 含自旋簡併 = 2;Fermi 球指 $T=0$ 占據 $|\mathbf k|\le k_F$ 的球。
- 配分 **1(55%)·2(30%)·3(15%)**。閉書,符號依 Kittel。

---

# 📘 第 1 題 — 電子與聲子的能帶色散與能隙（55%）

## 📋 原題
> 在固態中,**電子**與**聲子**都同時具有「能帶色散（band dispersion）」與「能隙（energy gap）」。
> **(a)** 描述這兩個例子。(10%)
> **(b)** 分別用能帶結構示意圖,概念性說明各自能隙的**物理起源**。(10%)
> **(c)** 簡述兩例的**相同處與相異處**。(10%)
> **(d)** 說明如何在兩者的能帶結構中**建構 Brillouin zone**。兩者的所有 Brillouin zone 都有物理意義嗎?為什麼? (10%)
> **(e)** 用能帶與能隙的示意圖,描述 **insulator / metal / semimetal / n-type / p-type 半導體** 五種材料。(15%)

## 🎯 核心訊息
> 一句話貫穿全題:**「週期性 → 在布里淵區邊界（Bragg 平面）發生反射式混成 → 開能隙」**。電子與聲子活在**同一個倒晶格、同一套 BZ**,差別只在三點:① 電子的隙來自**週期位能的傅立葉分量 $U_G$**（單原子基元就有隙）,聲子的隙來自**基元裡兩種以上原子的質量/彈簧對比**（單原子鏈**沒有**隙);② 電子是費米子、色散在帶底是拋物線 $E\propto k^2$,聲子是玻色子、聲學支在 $k\to0$ 是線性 $\omega\propto k$ 且 $\omega\to0$;③ 電子有**無限多條帶**(高 BZ 都對應更高帶,全部有意義),聲子只有 **$3p$ 條支**(基元 $p$ 原子),第一 BZ 已裝完所有模,高 BZ 只是重複。

## 🔍 符號說明
<details>
<summary><b>▸ band dispersion / energy gap / Brillouin zone（電子與聲子共用的語言）</b></summary>

### 你普物學過的
- **色散關係**:波的「頻率 vs 波數」$\omega(k)$。光在真空 $\omega=ck$（線性、無隙);在晶體裡會被週期性「折」出帶與隙。
- **能隙**:一段「沒有任何傳播態」的能量/頻率區間——波打進去會被全反射（evanescent）。

### 為什麼要這個
週期介質中,凡是波（電子的物質波、晶格振動的彈性波）碰到「波長 = 兩倍晶格週期」就滿足 Bragg 條件被強烈反射,前進波與反射波混成**駐波**,駐波的兩種站法能量不同 → 中間那段能量沒有行進態 = 能隙。電子與聲子是**同一個機制的兩個分身**。

### 定義
- 電子:週期位能 $V(\mathbf r+\mathbf R)=V(\mathbf r)$ 下,能量 $E_n(\mathbf k)$ 分裂成帶 $n$;BZ 邊界開隙 $E_g=2|U_G|$,$U_G$ 為 $V$ 的傅立葉分量。
- 聲子:雙原子鏈（質量 $M>m$、彈簧常數 $C$、晶格常數 $a$）色散
  $$\omega^2=C\!\left(\tfrac1M+\tfrac1m\right)\pm C\sqrt{\left(\tfrac1M+\tfrac1m\right)^2-\tfrac{4\sin^2(ka/2)}{Mm}},$$
  分成 acoustic（−）與 optical（+）兩支,中間有頻率禁帶。

**範例 1（熱身）**:單原子鏈 $\omega=2\sqrt{C/M}\,|\sin(ka/2)|$ → **無隙**（只有一支 acoustic）。對照組:沒有「基元第二顆原子」就沒有聲子隙。
**範例 2（中階）**:近自由電子在 $k=\pi/a$,兩簡併平面波 $e^{\pm i\pi x/a}$ 混成 $\cos,\sin(\pi x/a)$,能量差 $2|U_G|$ = 電子隙。
**範例 3（本題）**:雙原子鏈在 $k=\pi/a$,acoustic 頂 $\omega=\sqrt{2C/M}$、optical 底 $\omega=\sqrt{2C/m}$,隙 $=\sqrt{2C/m}-\sqrt{2C/M}$,**$M\ne m$ 才有**。
</details>

## 解答

### (a) 兩個例子（各自的色散與隙是什麼）

**例 1：週期位能中的電子（近自由電子）。**
自由電子色散 $E=\hbar^2k^2/2m$ 是連續單一拋物線。一旦加上離子的週期位能,色散被「折回」第一 BZ 並在邊界**開隙**,變成一條條能帶 $E_n(k)$;帶與帶之間是電子的**禁帶（energy gap）**。

**例 2：雙原子鏈中的聲子。**
晶格振動量子化成聲子,色散 $\omega(k)$。**雙原子**鏈（每原胞兩顆,質量 $M,m$）有兩支:低頻 **acoustic**（$k\to0$ 時 $\omega\to0$,兩原子同相、整體平移式振動,即聲音）與高頻 **optical**（兩原子反相、質心幾乎不動)。兩支在 BZ 邊界之間夾一段**頻率禁帶**:沒有任何頻率落在此區間的行進聲子。

> **小結**:兩例都是「週期 → 帶 + 隙」;電子的隙在帶與帶間,聲子的隙在 acoustic 與 optical 支之間。

### (b) 能隙的物理起源（附示意圖）

**電子的隙 = Bragg 反射 → 駐波分裂。**
在 BZ 邊界 $k=\pm\pi/a$,$e^{+i\pi x/a}$ 與 $e^{-i\pi x/a}$ 簡併;週期位能把它們混成兩個駐波
$$\psi_+\propto\cos\tfrac{\pi x}a\ (\text{電荷堆在離子上,位能低}),\qquad \psi_-\propto\sin\tfrac{\pi x}a\ (\text{電荷堆在離子間,位能高}).$$
兩者能量差 $=2|U_G|$ = 隙。示意（折回第一 BZ 的能帶圖）:

```
 E ↑                              帶 2（空）
   |         \___           ___/
   |             \___   ___/
   |   ●━━━━━━━━━━━━●━━━━━━━━━━━━●   ←─ 隙 E_g = 2|U_G| 在 k=±π/a
   |             ___/   \___
   |         ___/           \___
   |     ___/      帶 1（滿）    \___
   +----+------------+------------+----→ k
      -π/a           0          π/a
```

**聲子的隙 = 基元兩質量的對比。**
雙原子鏈在 $k=\pi/a$,兩支分離成
$$\omega_{\text{acoustic}}=\sqrt{2C/M}\ (\text{僅重原子 }M\text{ 動}),\qquad \omega_{\text{optical}}=\sqrt{2C/m}\ (\text{僅輕原子 }m\text{ 動}),$$
中間 $[\sqrt{2C/M},\,\sqrt{2C/m}]$ 沒有行進模 = 頻率隙。$M\to m$ 時兩端相等,**隙閉合 → 回到無隙的單原子鏈**,證明隙的根源是「基元裡兩種原子不等價」。示意:

```
 ω ↑
   | √(2C(1/M+1/m)) ─╮  optical 支（反相）
   |                  ╲___________________
   | √(2C/m) ·············●·············  optical 底
   |                       ▒▒ 頻率禁帶 ▒▒
   | √(2C/M) ·············●·············  acoustic 頂
   |               ______/   acoustic 支（同相）
   |         _____/
   |    ____/  (ω∝k, 聲速)
   +---/--------------------------→ k
      0                       π/a
```

> **小結**:電子隙的旋鈕是**位能強度 $|U_G|$**(單原子就有);聲子隙的旋鈕是**質量差 $M\ne m$**(要基元 ≥2 顆)。同一個「BZ 邊界反射」骨架,兩種來源。

**範例 A（近自由電子隙 $E_g=2|U_G|$ 的二態微擾推法）**：在 $k=\pi/a$，兩個簡併平面波 $|{+}\rangle=e^{+i\pi x/a}$、$|{-}\rangle=e^{-i\pi x/a}$ 能量同為 $E_0=\dfrac{\hbar^2}{2m}\left(\dfrac\pi a\right)^2$。週期位能 $U(x)=\sum_G U_G e^{iGx}$ 只有 $G=2\pi/a$ 這一項把 $|{-}\rangle$ 連到 $|{+}\rangle$（因 $-\pi/a+2\pi/a=+\pi/a$）。$2\times2$ 久期方程：

$$\det\begin{pmatrix}E_0-E & U_G\\ U_G^* & E_0-E\end{pmatrix}=0\ \Rightarrow\ (E_0-E)^2-|U_G|^2=0\ \Rightarrow\ E_\pm=E_0\pm|U_G|.$$

兩根差 $E_+-E_-=2|U_G|=\boxed{E_g}$。$U_G\to0$（自由電子）→ 隙閉合。

**範例 B（雙原子鏈色散，從運動方程一路推到隙）**：質量 $M,m$ 交錯、彈簧常數 $C$、晶格常數 $a$。設第 $n$ 胞重原子位移 $u_n$、輕原子 $v_n$，牛頓方程

$$M\ddot u_n=C(v_n+v_{n-1}-2u_n),\qquad m\ddot v_n=C(u_{n+1}+u_n-2v_n).$$

代行波 $u_n=Ae^{i(kna-\omega t)},\ v_n=Be^{i(kna-\omega t)}$，得線性方程組

$$(2C-M\omega^2)A=C(1+e^{-ika})B,\qquad (2C-m\omega^2)B=C(1+e^{ika})A.$$

消 $A,B$（行列式為零）：$(2C-M\omega^2)(2C-m\omega^2)=C^2|1+e^{ika}|^2=C^2\cdot2(1+\cos ka)=4C^2\cos^2\tfrac{ka}2$。展開解 $\omega^2$：

$$\omega^2=C\!\left(\tfrac1M+\tfrac1m\right)\pm C\sqrt{\left(\tfrac1M+\tfrac1m\right)^2-\tfrac{4\sin^2(ka/2)}{Mm}}.$$

**範例 C（代 $k=\pi/a$ 算隙寬，並驗 $M=m$ 隙閉合）**：$k=\pi/a$ 時 $\sin^2(ka/2)=\sin^2(\pi/2)=1$，根號內 $=\left(\tfrac1M+\tfrac1m\right)^2-\tfrac4{Mm}=\left(\tfrac1M-\tfrac1m\right)^2$，故 $\sqrt{\ }=\left|\tfrac1m-\tfrac1M\right|=\tfrac1m-\tfrac1M$（$M>m$）。兩支：

$$\omega_+^2=C\!\left(\tfrac1M+\tfrac1m\right)+C\!\left(\tfrac1m-\tfrac1M\right)=\tfrac{2C}m,\qquad \omega_-^2=C\!\left(\tfrac1M+\tfrac1m\right)-C\!\left(\tfrac1m-\tfrac1M\right)=\tfrac{2C}M.$$

隙寬 $\Delta\omega=\sqrt{2C/m}-\sqrt{2C/M}$。令 $M=m$：根號內 $\left(\tfrac1M-\tfrac1m\right)^2=0$，兩支併攏 $\omega_+=\omega_-=\sqrt{2C/m}$，$\boxed{\Delta\omega=0}$——回到無隙的單原子鏈，證明隙的根源是「基元兩原子不等價」。

</details>

### (c) 相同處與相異處

**相同處。**
1. 都活在**週期晶格 → 倒晶格**上,色散都對倒晶格向量週期:$E(k+G)=E(k)$、$\omega(k+G)=\omega(k)$,皆可折進第一 BZ。
2. 都在 **BZ 邊界（Bragg 平面）開隙**——本質都是前進波 ⇄ 反射波的駐波分裂。
3. 隙都代表一段**禁帶**:該能量/頻率沒有傳播態。

**相異處。**

| | 電子 | 聲子 |
|---|---|---|
| 統計 | 費米子（受 Pauli,填到 $E_F$） | 玻色子（無 Pauli,可任意佔據） |
| 帶底/$k\to0$ | 拋物線 $E\propto k^2$,帶底在**有限能量** | 聲學支線性 $\omega\propto k$,$k\to0$ 時 $\omega\to0$（Goldstone 模） |
| 隙的來源 | 週期位能 $U_G$,**單原子基元即有** | 基元兩種原子的質量/彈簧對比,**單原子鏈無隙** |
| 帶/支數目 | **無限多條**能帶 | 只有 $3p$ 條支（基元 $p$ 原子:3 acoustic + $3p-3$ optical），**有限** |
| 守恆 | $\hbar k$ 為晶體動量,模 $\hbar G$ 守恆 | 同（聲子準動量，可與晶格交換 $\hbar G$） |

> **小結**:同骨架（週期 → 帶 + 隙、同 BZ）、異血肉（費米/玻色、隙來源、帶數有限/無限、$k\to0$ 行為）。

### (d) 建構 Brillouin zone;高 BZ 是否都有物理意義?

**怎麼建（兩者一模一樣，因為 BZ 只認晶格)。**
在**倒空間**:對每個倒晶格向量 $\mathbf G$ 畫它的**垂直平分面（Bragg 平面）**。
- **第一 BZ** = 離原點最近、被最內層 Bragg 平面圍出的區域 = 倒晶格的 Wigner–Seitz cell。
- **第 $n$ BZ** = 從原點出發、恰好穿過 $n-1$ 個 Bragg 平面才到得了的區域。
電子與聲子共用同一倒晶格,故 BZ 的幾何**完全相同**。

**是否都有物理意義?——這裡兩者分道揚鑣。**
- **電子:所有 BZ 都有意義。** 近自由電子在 extended-zone scheme 下,第 $n$ 個 BZ 正好裝第 $n$ 條能帶;電子帶**無限多條**,所以每一個高階 BZ 都對應一條真實的更高能帶（折回第一 BZ 即 reduced-zone scheme）。**全部有物理意義。**
- **聲子:只有第一 BZ 真正必要,高 BZ 是冗餘重複。** 聲子的支數被自由度鎖死 = 基元每顆原子 3 個 → 共 **$3p$ 條**（有限)。$N$ 個原胞的全部 $3pN$ 個模,在第一 BZ 內就**剛好數完**（每支在第一 BZ 有 $N$ 個 $k$ 點）。越過第一 BZ,$\omega(k)$ 只是週期性地重複、不產生任何新模 → **高階 BZ 對聲子沒有獨立物理意義**,只取第一 BZ 即足以窮舉所有聲子態。

> **小結**:BZ 幾何兩者相同;但「要用幾個」不同——電子帶無限多 → 高 BZ 全有意義;聲子支有限（$3p$）→ 第一 BZ 已裝完,高 BZ 多餘。**根因是自由度有限 vs 無限。**

### (e) 五種材料的能帶/能隙示意

用「價帶（滿,▆）／導帶（空,▢）／費米能 $E_F$／能隙 $E_g$」四個元件拼:

```
 insulator        metal           semimetal        n-type           p-type
 導帶▢▢▢▢         導帶▆▆▢▢▢       導帶▢▢▟          導帶▢▢▢          導帶▢▢▢
 ───────E_c       （E_F 落在        ▟▆  ← 小重疊     ─•─•─ donor      ────────E_c
   E_g 大          帶「內」,        ▆▆▟（導帶底略     （E_c 下 ~meV）
   E_F 居中         有態可導電）     低於價帶頂)       E_F 近 E_c       ────────E_v
 ───────E_v        導帶價帶亦       → 少量電子=       ────────E_v       ─○─○─ acceptor
 價帶▆▆▆▆          可重疊           少量電洞          價帶▆▆▆          （E_v 上 ~meV）
                                                                      E_F 近 E_v,價帶頂缺電子
```

- **Insulator（絕緣體）**:價帶全滿、導帶全空,隙大（$E_g\gtrsim3$ eV）,$E_F$ 落在隙中央。室溫熱激發跨不過 → 不導電。
- **Metal（金屬）**:$E_F$ 落在某條**部分填滿**的能帶「內部」(或導帶與價帶**重疊**)。$E_F$ 處有大量空態 → 一加電場即導電。
- **Semimetal（半金屬，如 Bi、石墨）**:導帶底**略低於**價帶頂,有**極小重疊**(在 $k$ 空間不同點)。價帶頂溢出少量電子到導帶底,留下等量電洞 → 載子數很小但不為零。
- **n-type 半導體**:本徵半導體摻施體（donor，如 Si 摻 P）,在導帶底下方 $\sim$meV 處放 donor 能階,室溫游離出電子到導帶;$E_F$ 被推向**靠近導帶**,多數載子為**電子**。
- **p-type 半導體**:摻受體（acceptor，如 Si 摻 B），在價帶頂上方 $\sim$meV 處放 acceptor 能階，接收價帶電子留下電洞;$E_F$ 被拉向**靠近價帶**,多數載子為**電洞**。

> **小結**:五者的差別 = 「$E_F$ 相對於帶與隙的位置」+「隙大小/有無重疊」+「摻雜能階把 $E_F$ 推哪邊」。

**範例 A（本徵載子的質量作用定律 $np=n_i^2$）**：用 Boltzmann 近似，導帶電子濃度 $n=N_c\,e^{-(E_c-E_F)/k_BT}$、價帶電洞濃度 $p=N_v\,e^{-(E_F-E_v)/k_BT}$（$N_c,N_v$ 為等效態密度）。兩式相乘，$E_F$ 在指數相加時抵消：

$$np=N_cN_v\,e^{-(E_c-E_F+E_F-E_v)/k_BT}=N_cN_v\,e^{-(E_c-E_v)/k_BT}=N_cN_v\,e^{-E_g/k_BT}\equiv\boxed{n_i^2}.$$

關鍵:$np$ 與摻雜無關、只看 $E_g$ 與 $T$——這就是「質量作用定律」。

**範例 B（本徵時 $E_F$ 落在哪裡）**：本徵半導體 $n=p$，把上式兩個指數設相等：$N_c\,e^{-(E_c-E_F)/k_BT}=N_v\,e^{-(E_F-E_v)/k_BT}$。取對數整理，$2E_F=E_c+E_v+k_BT\ln\dfrac{N_v}{N_c}$：

$$E_F=\frac{E_c+E_v}2+\frac{k_BT}2\ln\frac{N_v}{N_c}.$$

當 $N_c=N_v$（或 $T\to0$）→ $E_F=\dfrac{E_c+E_v}2$ 恰落在隙的正中央，與圖中 insulator 的 $E_F$ 居中一致。

**範例 C（n-type 摻雜後多數載子）**：摻施體濃度 $N_D$，室溫全游離 → 電子濃度 $n\approx N_D$。由質量作用定律電洞濃度 $p=\dfrac{n_i^2}{n}\approx\dfrac{n_i^2}{N_D}\ll n$。例如 $n_i=10^{10}\,\text{cm}^{-3}$、$N_D=10^{16}\,\text{cm}^{-3}$：

$$p\approx\frac{(10^{10})^2}{10^{16}}=\frac{10^{20}}{10^{16}}=10^4\,\text{cm}^{-3}.$$

電子($10^{16}$)遠多於電洞($10^4$)→ 多數載子為電子，$E_F$ 被推近導帶，正是 n-type ✓。

- 單原子鏈代入聲子隙公式（令 $M=m$）→ $\sqrt{2C/m}-\sqrt{2C/M}=0$,隙消失 ✓（與「無基元第二顆 → 無隙」一致)。
- 電子隙 $E_g=2|U_G|$,$U_G\to0$（自由電子）→ 隙消失,回連續拋物線 ✓。

# 📗 第 2 題 — 有效質量 effective mass（30%）

## 📋 原題
> **(a)** 用牛頓第二定律的形式,在半導體中**定義/推導**有效質量 $m^*$。(20%)
> **(b)** 有效質量可以是**負的**嗎?若可以,簡短說明。(10%)

## 🎯 核心訊息
> Bloch 電子不是自由粒子,但只要把「波包」當粒子,它仍服從 $a=F/m^*$ 的牛頓形式——代價是 $m^*$ **不是真質量,而是能帶曲率的倒數**:$\dfrac1{m^*}=\dfrac1{\hbar^2}\dfrac{d^2E}{dk^2}$。曲率正（帶底）→ $m^*>0$;曲率負（帶頂）→ $m^*<0$（用電洞描述）。

## 📚 前情提要：從普物的波包串到半古典動力學
### 階段 1（普物：波的兩種速度）
波包的**包絡**以**群速** $v_g=\dfrac{d\omega}{dk}$ 前進（不是相速 $\omega/k$）。電子的物質波 $E=\hbar\omega$,故 $v_g=\dfrac1\hbar\dfrac{dE}{dk}$。
> **留存**:電子在晶體中的「實際移動速度」= 群速 = 能帶斜率 $\dfrac1\hbar\dfrac{dE}{dk}$。

### 階段 2（半古典：外力如何改變 $k$）
外力 $F$ 在 $dt$ 內對電子做功 $dE=F\,v_g\,dt$;又 $dE=\dfrac{dE}{dk}dk$。兩式相等 → 推出晶體動量方程 $\hbar\dot k=F$（下面 Step 1 詳推)。
> **留存**:外力改變的是**晶體動量** $\hbar k$,不是真動量;能帶曲率把「$k$ 的變化」翻成「速度的變化」= 加速度。

## 🔍 符號說明
<details>
<summary><b>▸ 群速 $v_g$、晶體動量 $\hbar k$、能帶曲率 → 有效質量</b></summary>

### 你普物學過的
$F=ma$;波包以群速前進;$p=\hbar k$（自由粒子）。

### 為什麼要這個
晶體中電子受離子週期力,真實受力極複雜;但把所有晶格作用**打包進 $m^*$**,就能用一條簡單的 $a=F/m^*$ 只對**外**力寫運動方程。

### 定義
$$v_g=\frac1\hbar\frac{dE}{dk},\qquad \hbar\frac{dk}{dt}=F_{\text{ext}},\qquad \frac1{m^*}=\frac1{\hbar^2}\frac{d^2E}{dk^2}.$$
3D 時 $m^*$ 是張量:$\left(\dfrac1{m^*}\right)_{ij}=\dfrac1{\hbar^2}\dfrac{\partial^2E}{\partial k_i\partial k_j}$。

**範例 1（熱身）**:自由電子 $E=\hbar^2k^2/2m$ → $d^2E/dk^2=\hbar^2/m$ → $m^*=m$（回到真質量，✓ 一致性檢查)。
**範例 2（中階）**:拋物線近似帶底 $E\approx E_c+\dfrac{\hbar^2k^2}{2m^*}$ → 曲率常數 → $m^*$ 為常數正值。
**範例 3（本題）**:價帶頂 $E\approx E_v-\dfrac{\hbar^2k^2}{2|m^*|}$ → 曲率負 → $m^*<0$。
</details>

## 解答

### (a) 用牛頓第二定律形式推 $m^*$（完整、不跳代數）

**Step 1 — 群速與晶體動量方程。**
電子波包的速度 = 群速
$$v_g=\frac{d\omega}{dk}=\frac1\hbar\frac{dE}{dk}.\tag{1}$$
外力 $F$ 在時間 $dt$ 對電子做功,等於能量增量:
$$dE=F\,v_g\,dt=F\cdot\frac1\hbar\frac{dE}{dk}\,dt.\tag{2}$$
但同時 $dE=\dfrac{dE}{dk}\,dk$。代入 (2),兩邊同含因子 $\dfrac{dE}{dk}$,消去得
$$dk=\frac{F}{\hbar}\,dt\quad\Longrightarrow\quad \boxed{\ \hbar\frac{dk}{dt}=F\ }\tag{3}$$
這就是半古典「晶體動量」運動方程。

**Step 2 — 對群速取時間微分得加速度。**
$$a=\frac{dv_g}{dt}=\frac{d}{dt}\!\left(\frac1\hbar\frac{dE}{dk}\right)=\frac1\hbar\frac{d}{dt}\!\left(\frac{dE}{dk}\right).$$
用連鎖律,把對 $t$ 的微分換成對 $k$ 的微分乘 $\dfrac{dk}{dt}$:
$$a=\frac1\hbar\frac{d^2E}{dk^2}\cdot\frac{dk}{dt}.\tag{4}$$

**Step 3 — 代入 (3) 的 $\dfrac{dk}{dt}=F/\hbar$。**
$$a=\frac1\hbar\frac{d^2E}{dk^2}\cdot\frac{F}{\hbar}=\frac1{\hbar^2}\frac{d^2E}{dk^2}\,F.\tag{5}$$

**Step 4 — 對照牛頓第二定律 $a=F/m^*$。**
比較 (5) 與 $a=\dfrac{F}{m^*}$,係數對應給
$$\boxed{\ \frac1{m^*}=\frac1{\hbar^2}\frac{d^2E}{dk^2}\quad\Longleftrightarrow\quad m^*=\hbar^2\Big/\frac{d^2E}{dk^2}\ }$$
（3D 推廣為張量 $\left(\tfrac1{m^*}\right)_{ij}=\tfrac1{\hbar^2}\partial^2E/\partial k_i\partial k_j$。)

> **小結**:$m^*$ 的全部物理 = **能帶曲率的倒數**。晶格的所有作用都被吸收進這個數,讓 Bloch 電子在只看外力時仍服從 $F=m^*a$。

<summary><b>📝 更多範例（點開）：從各種色散直接算 $m^*$（曲率的倒數）</b></summary>

**範例 A（自由電子,一致性檢查）**：$E=\dfrac{\hbar^2k^2}{2m}$。一階導 $\dfrac{dE}{dk}=\dfrac{\hbar^2k}{m}$，二階導 $\dfrac{d^2E}{dk^2}=\dfrac{\hbar^2}{m}$。代入

$$\frac1{m^*}=\frac1{\hbar^2}\frac{d^2E}{dk^2}=\frac1{\hbar^2}\cdot\frac{\hbar^2}{m}=\frac1m\ \Rightarrow\ \boxed{m^*=m}.$$

晶格作用消失 → 有效質量回到真質量 ✓。

**範例 B（緊束縛 1D 能帶,算帶底與帶頂的 $m^*$）**：$E(k)=E_0-2t\cos ka$（$t>0$，$a$ 晶格常數）。一階導 $\dfrac{dE}{dk}=2ta\sin ka$，二階導 $\dfrac{d^2E}{dk^2}=2ta^2\cos ka$。

- **帶底** $k=0$：$\cos0=1$ → $\dfrac{d^2E}{dk^2}=2ta^2>0$ → $m^*=\dfrac{\hbar^2}{2ta^2}>0$。
- **帶頂** $k=\pi/a$：$\cos\pi=-1$ → $\dfrac{d^2E}{dk^2}=-2ta^2<0$ → $m^*=-\dfrac{\hbar^2}{2ta^2}<0$。

同一條帶,底正頂負,符號隨曲率翻轉。$t$ 越大(帶越寬)→ $|m^*|$ 越小(電子越輕、越易動)。

**範例 C（價帶頂拋物線,確認 $m^*<0$ 與電洞描述）**：$E(k)=E_v-\dfrac{\hbar^2k^2}{2m_h}$（$m_h>0$ 為一正參數）。二階導 $\dfrac{d^2E}{dk^2}=-\dfrac{\hbar^2}{m_h}<0$，故

$$\frac1{m^*}=\frac1{\hbar^2}\left(-\frac{\hbar^2}{m_h}\right)=-\frac1{m_h}\ \Rightarrow\ m^*=-m_h<0.$$

電子有效質量為負。改記帳:價帶頂缺一個電子的空缺 = 電洞,帶 $+e$、有效質量 $+m_h$，方程 $a=F/(+m_h)$ 恢復正常直覺。

</details>

### (b) $m^*$ 可以是負的嗎?——可以

**可以。** 由 (a),$m^*=\hbar^2/(d^2E/dk^2)$,符號完全由**能帶曲率**決定:
- **帶底**（如導帶最低點）色散向上彎,$d^2E/dk^2>0$ → $m^*>0$。
- **帶頂**（如價帶最高點）色散向下彎,$d^2E/dk^2<0$ → $\boxed{m^*<0}$。

**物理解釋。** 負 $m^*$ 表示「電子的加速度與外力**反向**」。原因:在 BZ 邊界附近電子被晶格 **Bragg 反射**,晶格向電子回傳的動量比外場給的還多 → 淨加速度逆著外力。與其追蹤這顆「負質量電子」,不如改追蹤價帶頂少掉它後留下的空缺——這個空缺行為如一顆**帶 $+e$、正有效質量 $|m^*|$ 的電洞（hole）**,方程式 $a=F/(+|m^*|)$ 又恢復正常直覺。

> **小結**:$m^*<0$ 不違反物理,只是「電子被晶格反推」的記帳方式;改用正質量電洞描述更方便,這正是半導體價帶輸運的標準語言。

## ✅ 自我檢核
- 一致性:自由電子 $E=\hbar^2k^2/2m$ → $d^2E/dk^2=\hbar^2/m$ → $m^*=m$ ✓（晶格作用消失時回到真質量)。
- 量綱:$[\hbar^2/(d^2E/dk^2)]=\dfrac{(\text{J·s})^2}{\text{J·m}^2}=\dfrac{\text{kg}^2\text{m}^4/\text{s}^2}{\text{kg·m}^4/\text{s}^2}=\text{kg}$ ✓。
- 負質量自洽:價帶頂曲率負 → $m^*<0$ → 用 $+e$ 正質量電洞描述,電流方向正確 ✓。

## 🔀 變化的可能情況
- 加問「**如何量 $m^*$**」→ 迴旋共振（cyclotron resonance,$\omega_c=eB/m^*$）、或由 $C_v$、Hall + 電導反推。
- 加問「為何 $m^*$ 是**張量**」→ 各向異性能帶（Si、Ge 的縱/橫質量），(a) 的二階導變偏微分矩陣。
- 把 (a) 接到「**mobility** $\mu=e\tau/m^*$」或「**effective mass equation** 的算符版 $i\hbar\partial_t\psi=E(-i\nabla)\psi$」（2016 Q5(d) 同型)。

## 信心：**高**（$v_g\to\hbar\dot k=F\to a=\tfrac1{\hbar^2}E''F\to 1/m^*$ 為 Kittel Ch8 標準推導，每步代數展開，無跳步）。

# 📙 第 3 題 — 自由電子費米球與 $k_F$（15%）

## 📋 原題
> **(a)** 在三維 $N$ 個自由電子於 $0\,$K 的基態,被佔據的軌道可表示為 $\mathbf k$ 空間中一個**球**內的點。請推導
> $$k_F=\left(\frac{3\pi^2N}{V}\right)^{1/3},$$
> 其中 $k_F$ 是費米面的波向量、$V$ 是體積。(15%)

## 🎯 核心訊息
> 三步即得:① 週期邊界使每個 $\mathbf k$ 態占 $k$ 空間體積 $(2\pi)^3/V$;② 乘自旋 2、數滿費米球 $|\mathbf k|\le k_F$ 的態 = $N$;③ 解出 $k_F$。關鍵常數 $3\pi^2$ 來自「球體積 $\tfrac43\pi k_F^3$ ÷ 態體積 ÷（除以）後再 ×2 自旋」。

## 📚 前情提要：從普物的「箱中粒子」串到費米球
### 階段 1（普物：一維箱量子化）
長度 $L$ 的箱中粒子,駐波條件使 $k$ 離散。改用**週期（Born–von Kármán）邊界** $\psi(x+L)=\psi(x)$ → $e^{ik L}=1$ → $k=\dfrac{2\pi}L n$,相鄰 $k$ 間距 $\dfrac{2\pi}L$。
### 階段 2（三維 + 自旋）
邊長 $L$ 立方($V=L^3$),三方向各間距 $\dfrac{2\pi}L$ → 每個 $\mathbf k$ 態占 $k$ 空間體積 $\left(\dfrac{2\pi}L\right)^3=\dfrac{(2\pi)^3}{V}$。每個 $\mathbf k$ 點因 Pauli 可放**自旋 ↑↓ 兩顆**電子。
### 階段 3（$T=0$ 基態 = 填滿費米球）
$0\,$K 時電子由低能往上填,$E=\hbar^2k^2/2m$ 隨 $|\mathbf k|$ 單調增 → 佔據區是半徑 $k_F$ 的**球**。
> **留存**:「數球內的 $\mathbf k$ 點 ×2 = $N$」就是全部。

## 🔍 符號說明
<details>
<summary><b>▸ k 空間態計數（每態體積 + 自旋 + 費米球）</b></summary>

### 你普物學過的
箱中粒子能階離散;每能階因自旋放 2 個費米子。

### 為什麼要這個
把「$N$ 個電子填到哪」翻成「$k$ 空間幾何」:佔據區體積 ÷ 每態體積 ×2 = $N$,反解任何想要的量（$k_F$、$E_F$、DOS、總能）。

### 定義
$$\text{每態占 }k\text{ 空間體積}=\frac{(2\pi)^3}{V},\qquad N=2\times\frac{\text{佔據區體積}}{(2\pi)^3/V}.$$

**範例 1（熱身，1D）**:佔據區 = 線段 $[-k_F,k_F]$ 長 $2k_F$,每態占 $2\pi/L$ → $N=2\cdot\dfrac{2k_F}{2\pi/L}=\dfrac{2Lk_F}\pi$。
**範例 2（中階，2D）**:佔據區 = 圓 $\pi k_F^2$,每態占 $(2\pi)^2/A$ → $N=2\cdot\dfrac{\pi k_F^2}{(2\pi)^2/A}=\dfrac{A k_F^2}{2\pi}$。
**範例 3（本題，3D）**:佔據區 = 球 $\tfrac43\pi k_F^3$,每態占 $(2\pi)^3/V$ → 下面 Step 2–4。
</details>

## 解答

### (a) 推導 $k_F=\left(\dfrac{3\pi^2N}{V}\right)^{1/3}$（完整、含自旋）

**Step 1 — 每個 $\mathbf k$ 態占的 $k$ 空間體積。**
週期邊界 $e^{ik_iL}=1$ → $k_i=\dfrac{2\pi}L n_i$,三方向間距皆 $\dfrac{2\pi}L$。故每個允許的 $\mathbf k$ 點獨佔
$$\Delta V_k=\left(\frac{2\pi}L\right)^3=\frac{(2\pi)^3}{V}=\frac{8\pi^3}{V}.$$

**Step 2 — 費米球內的 $\mathbf k$ 點數目。**
$0\,$K 佔據 $|\mathbf k|\le k_F$ 的球,球體積 $\dfrac43\pi k_F^3$。$\mathbf k$ 點數 =
$$\mathcal N_k=\frac{\text{球體積}}{\Delta V_k}=\frac{\tfrac43\pi k_F^3}{8\pi^3/V}=\frac{4\pi k_F^3\,V}{3\cdot8\pi^3}=\frac{V k_F^3}{6\pi^2}.$$

**Step 3 — 乘自旋簡併 2 得電子數 $N$。**
每個 $\mathbf k$ 點放自旋 ↑↓ 兩顆:
$$N=2\,\mathcal N_k=2\cdot\frac{V k_F^3}{6\pi^2}=\boxed{\ \frac{V k_F^3}{3\pi^2}\ }.$$

**Step 4 — 反解 $k_F$。**
$$k_F^3=\frac{3\pi^2N}{V}\quad\Longrightarrow\quad \boxed{\ k_F=\left(\frac{3\pi^2N}{V}\right)^{1/3}\ }.$$
（順帶:數密度 $n=N/V=k_F^3/3\pi^2$,故 $k_F=(3\pi^2n)^{1/3}$。)

> **小結**:常數 $3\pi^2$ 的來歷一清二楚——$\tfrac43\pi$（球）÷ $8\pi^3$（態體積）×2（自旋）= $\dfrac1{3\pi^2}$ 的倒數。每一步只是體積相除 + 乘 2。

**範例 A（1D 完整計數）**：每態占 $k$ 空間長度 $\dfrac{2\pi}L$，佔據區為線段 $[-k_F,k_F]$ 長 $2k_F$。乘自旋 2：

$$N=2\cdot\frac{2k_F}{2\pi/L}=\frac{4k_F L}{2\pi}=\frac{2Lk_F}\pi\ \Rightarrow\ k_F=\frac{\pi N}{2L}=\frac{\pi n}2\quad(n=N/L).$$

$k_F\propto n^1$（指數 $=1/d=1$）。

**範例 B（2D 完整計數）**：每態占 $k$ 空間面積 $\dfrac{(2\pi)^2}A$，佔據區為圓 $\pi k_F^2$。乘自旋 2：

$$N=2\cdot\frac{\pi k_F^2}{(2\pi)^2/A}=2\cdot\frac{\pi k_F^2 A}{4\pi^2}=\frac{A k_F^2}{2\pi}\ \Rightarrow\ k_F^2=\frac{2\pi N}A=2\pi n\ \Rightarrow\ k_F=\sqrt{2\pi n}.$$

$k_F\propto n^{1/2}$（指數 $=1/d=1/2$）。

**範例 C（3D 接著算 $E_F,v_F,$ DOS）**：由本題 $k_F=(3\pi^2n)^{1/3}$，$n=N/V$。

- **費米能** $E_F=\dfrac{\hbar^2k_F^2}{2m}=\dfrac{\hbar^2}{2m}(3\pi^2n)^{2/3}$。
- **費米速度** $v_F=\dfrac{\hbar k_F}m=\dfrac\hbar m(3\pi^2n)^{1/3}$。
- **態密度** 由 $N=\dfrac{Vk_F^3}{3\pi^2}$ 與 $k_F\propto E^{1/2}$，得 $N\propto E_F^{3/2}$，微分 $g(E_F)=\dfrac{dN}{dE_F}=\dfrac32\cdot\dfrac{N}{E_F}=\boxed{\dfrac{3N}{2E_F}}$。

三維一路接到後面所有費米氣體量,起點都是同一條「球 ÷ 每態 ×2 = N」。

</details>

## ✅ 自我檢核
- 量綱:$[k_F]=(\text{無因次}/\text{m}^3)^{1/3}=\text{m}^{-1}$ ✓（$N/V$ 是數密度,單位 $\text{m}^{-3}$)。
- 維度檢查（用符號說明的範例反推）:3D 給 $k_F\propto n^{1/3}$、2D 給 $k_F\propto n^{1/2}$、1D 給 $k_F\propto n$ ✓（指數 = $1/d$，合理)。
- 接續量:$E_F=\dfrac{\hbar^2k_F^2}{2m}=\dfrac{\hbar^2}{2m}(3\pi^2n)^{2/3}$,與 Kittel 結果一致 ✓。

## 🔀 變化的可能情況
- 接著問 **$E_F$、$v_F$、DOS $g(E_F)=\dfrac{3N}{2E_F}$、$0\,$K 總能 $U_0=\tfrac35NE_F$**（2016 Q2(c) 同型，由本題一路延伸)。
- 改 **2D / 1D** 版本（符號說明範例 1、2 即答)。
- 漏掉自旋因子 2 是最常見錯誤 → 會少一半、$k_F$ 差 $2^{1/3}$;本題務必保留 ×2。

## 信心：**高**（標準費米球計數，每態體積 → 球 → ×2 自旋 → 反解,代數無跳步;待證式已算繪 PDF 核對為 $k_F=(3\pi^2N/V)^{1/3}$）。

  #toc a.active { background: #e8f0f9; color: #1a4d7c; border-left-color: #1a4d7c; font-weight: 600; }
  @media (min-width: 1280px) {
    #toc { transform: none; box-shadow: none; }
    #toc-toggle { display: none; }
    body { margin-left: 290px; }
  }
  @media print { #toc, #toc-toggle { display: none !important; } body { margin-left: auto !important; } }
</style>
<script>
(function () {
  function buildTOC() {
    var content = document.getElementById('content');
    var toc = document.getElementById('toc');
    var toggle = document.getElementById('toc-toggle');
    if (!content || !toc) return;
    var heads = content.querySelectorAll('h2, h3, h4');
    var frag = document.createDocumentFragment();
    var title = document.createElement('div');
    title.className = 'toc-title'; title.textContent = '本頁目錄';
    frag.appendChild(title);
    var items = [];
    heads.forEach(function (h, i) {
      if (h.closest('details')) return;
      if (!h.id) h.id = 'sec-' + i;
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var label = h.textContent.replace(/\s+/g, ' ').trim();
      a.innerHTML = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      a.className = h.tagName.toLowerCase();
      a.addEventListener('click', function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + h.id);
        if (window.matchMedia('(max-width: 1279px)').matches) toc.classList.remove('open');
      });
      frag.appendChild(a);
      items.push({ el: h, link: a });
    });
    if (!items.length) { toc.style.display = 'none'; if (toggle) toggle.style.display = 'none'; return; }
    toc.innerHTML = ''; toc.appendChild(frag);
    if (toggle) toggle.addEventListener('click', function () { toc.classList.toggle('open'); });
    var ticking = false;
    function spy() {
      ticking = false;
      var y = window.scrollY + 120, cur = items[0];
      for (var k = 0; k < items.length; k++) {
        if (items[k].el.getBoundingClientRect().top + window.scrollY <= y) cur = items[k];
      }
      items.forEach(function (it) { it.link.classList.toggle('active', it === cur); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(spy); }
    }, { passive: true });
    spy();
    (function typesetTOC() {
      if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([toc]).catch(function () {}); }
      else { setTimeout(typesetTOC, 300); }
    })();
  }
  function whenReady() {
    var content = document.getElementById('content');
    if (content && content.querySelector('h1, h2, h3')) { buildTOC(); return; }
    var tries = 0;
    var timer = setInterval(function () {
      var c = document.getElementById('content');
      if ((c && c.querySelector('h1, h2, h3')) || ++tries > 100) { clearInterval(timer); buildTOC(); }
    }, 50);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenReady);
  else whenReady();
})();
</script>
</body>
</html>
